[package]
name = "render-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Browser render runtime: Rust admission, shared templates and Rayon dispatch, with a C ABI retained for compute golden tests."

# The workspace denies `unsafe_code`. This crate is the raw-pointer boundary and
# cannot; it and `rust/crates/listing-core-wasm` (browser-owned-listing slice 03)
# are the only two places in the tree that may say so. Cargo's
# `[lints] workspace = true` is all-or-nothing, so the workspace set is restated
# here with that one key flipped, plus the two clippy lints that make the
# exception pay for itself.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"
unreachable_pub = "warn"
raw_borrows_via_references = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
render.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen = { version = "=0.2.127", optional = true }
wasm-bindgen-futures = { version = "=0.4.77", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.11", optional = true }
futures-channel = "0.3"
