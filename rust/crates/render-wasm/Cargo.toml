[package]
name = "render-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Browser render runtime: Rust admission, shared templates and Rayon dispatch over one shared WASM memory."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
render.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen = { version = "=0.2.127", optional = true }
wasm-bindgen-futures = { version = "=0.4.77", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.11", optional = true }
futures-channel = "0.3"
