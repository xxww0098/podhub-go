[workspace]
members = [
    "crates/listing-core",
    "crates/listing-core-wasm",
    "crates/listing-tags",
    "crates/op-workflow",
    "crates/psd-x",
    "crates/render",
    "crates/render-wasm",
    "crates/wasm-host-probe",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
raw_borrows_via_references = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# The browser artifacts are size-gated (listing-core ≤1.75 MiB, see
# web/tests/listing-core-wasm.test.ts). These are the upstream settings the
# gates were measured against; dropping them makes both wasm modules larger.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[workspace.dependencies]
op-workflow = { path = "crates/op-workflow" }
listing-core = { path = "crates/listing-core" }
psdx = { path = "crates/psd-x", default-features = false }
render = { path = "crates/render" }
serde = { version = "1.0.229", default-features = false, features = ["rc"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2"
uuid = { version = "1", default-features = false }
# Used by render/ and render-wasm/.
image = { version = "0.25.10", default-features = false }
fast_image_resize = { version = "6.1.0", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false }
anyhow = "1"
base64 = "0.22.1"
