name: verify-wasm-followup-20261021
on:
  push:
    branches: [verify/wasm-state-followup-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Pinned Rust and bindgen
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-09-14 --profile minimal --component rust-src
          cargo +1.99.0 install wasm-bindgen-cli --debug --version 0.2.127 --locked
      - name: Lockfile install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Reproduce against existing PR 11
        run: python3 .verification/wasm-followup/run.py red
      - name: Test incremental reservation and completion fix
        run: python3 .verification/wasm-followup/run.py green
      - name: Rebuild all WASM and verify frontend
        run: python3 .verification/wasm-followup/run.py artifacts
      - name: Real threaded Chrome rendering
        env:
          PODHUB_MOCK_GATE: '1'
        run: |
          set -euo pipefail
          cp .verification/wasm-followup/browser.mjs web/.fsm-followup.mjs
          cd web
          node .fsm-followup.mjs 2>&1 | tee "$RUNNER_TEMP/wasm-state-followup/browser.log"
          rm .fsm-followup.mjs
      - name: Publish verified child commit without changing PR or main
        run: python3 .verification/wasm-followup/run.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-state-followup-evidence
          path: ${{ runner.temp }}/wasm-state-followup
          retention-days: 14
