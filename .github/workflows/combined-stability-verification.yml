name: combined-stability-verification

on:
  push:
    branches: [verify/combined-stability-20261020]

permissions:
  contents: read

jobs:
  verify:
    name: combined (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [go-full, web-full, lint-codegen, regression-race]
    env:
      EVIDENCE: /tmp/podhub-combined-evidence
      LISTING_TAGS_WASM: wasm/dist/server/listing-tags.wasm
      WASM_HOST_PROBE: wasm/dist/test/host-probe.wasm
      LISTING_CORE_WASM: wasm/dist/server/listing-core.wasm
      LISTING_STATE_WASM: wasm/dist/browser/listing-state.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose pinned PR patches locally (never push or merge main)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git config user.name 'Local verification'
          git config user.email 'verification@localhost.invalid'
          git checkout --detach 29c23835d3c6c4bcdf5253b1069c5f7370e3c4ec
          for sha in \
            d817bbbd2921dd9850561b9f5ce855fb96822487 \
            b28455007c81e07698c5b8463cc6f8ff2dd8c722 \
            26b0fcfc21f2199ef654e566e528da7f0891eddf \
            7d7604997c5caea2eeece98d6334f4f66e267146 \
            39fd3d578f8bdfc78e16c55297a81e9505c9ba73 \
            225b906f451d6f690888441febc457af43f0c81e \
            62152cec9e00e17e706e9201e9c4c6a3b1625e51
          do
            git fetch --no-tags origin "$sha"
            git cherry-pick "$sha"
            printf '%s\n' "$sha" >> "$EVIDENCE/pr-heads.txt"
          done
          git write-tree | tee "$EVIDENCE/combined-tree.txt"
          git diff --binary 29c23835d3c6c4bcdf5253b1069c5f7370e3c4ec HEAD > "$EVIDENCE/combined.patch"
          git diff --check 29c23835d3c6c4bcdf5253b1069c5f7370e3c4ec HEAD
          git log --format='%H %s' -8 > "$EVIDENCE/local-commits.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@v5
        if: matrix.part != 'web-full'
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        if: matrix.part == 'web-full' || matrix.part == 'regression-race'
        with:
          bun-version: '1.4.3'
      - name: Verify combined changes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$EVIDENCE/checks.log") 2>&1
          scripts/check-wasm-dist.sh
          case '${{ matrix.part }}' in
            go-full)
              go version
              test -S /var/run/docker.sock
              docker info > "$EVIDENCE/docker-info.txt"
              go test -count=1 -timeout=25m ./...
              ;;
            web-full)
              bun --version
              cd web
              bun install --frozen-lockfile
              bun run build
              bun run api:check
              bun run test
              ;;
            lint-codegen)
              go version
              bash scripts/test-wasm-dist.sh
              test -z "$(gofmt -l .)"
              go vet ./...
              go test -count=1 ./tests/archtest
              python3 scripts/check-third-party-licenses.py
              make generate CODEGEN_BIN="$RUNNER_TEMP/codegen-bin"
              git diff --exit-code
              ;;
            regression-race)
              go version
              go test -race -count=20 -timeout=15m ./internal/listing/core/domain ./internal/billing/domain ./internal/queue/domain ./internal/supplier/domain ./internal/supply/domain ./internal/delegate/domain
              go test -race -count=1 -timeout=10m ./internal/ratings/...
              cd web
              bun install --frozen-lockfile
              bun test --preload ./tests/network-guard.preload.ts ./src/features/account/account-overview-cache.test.ts ./src/features/account/account-overview-session-fence.test.ts ./src/lib/error-feedback-reporting.test.ts ./src/lib/error-telemetry.test.ts ./src/lib/notify.test.ts ./src/features/workflow/card/template-backup.test.ts ./src/features/workflow/card/template-assets.test.ts ./src/bindings/multipart-upload.test.ts ./src/components/changelog-dialog.test.tsx
              for attempt in $(seq 1 20); do
                printf '\nSession and storage isolation repetition %s/20\n' "$attempt"
                bun test --preload ./tests/network-guard.preload.ts ./src/features/account/account-overview-session-fence.test.ts ./src/bindings/multipart-upload.test.ts ./src/components/changelog-dialog.test.tsx
              done
              ;;
          esac
          printf 'PASS\n' > "$EVIDENCE/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-${{ matrix.part }}
          path: /tmp/podhub-combined-evidence
          retention-days: 14
