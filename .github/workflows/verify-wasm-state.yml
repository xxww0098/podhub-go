name: verify-wasm-state
on:
  push:
    branches: [verify/wasm-runtime-state-20261020]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      EVIDENCE: /tmp/wasm-state-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install pinned toolchains
        run: |
          mkdir -p "$EVIDENCE"
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-09-14 --profile minimal --component rust-src
          rustc +1.99.0 --version | tee "$EVIDENCE/toolchain.txt"
          git rev-parse HEAD > "$EVIDENCE/verification-head.txt"
          cd web && bun install --frozen-lockfile
      - name: Prove hidden tests then run original state logic natively
        run: |
          set -o pipefail
          (cd rust && cargo test --locked -p render-wasm --lib -- --list) 2>&1 | tee "$EVIDENCE/native-hidden.log"
          if grep -q 'scheduler::.*: test' "$EVIDENCE/native-hidden.log"; then exit 1; fi
          python3 .verification/apply-wasm-state.py expose
          (cd rust && cargo test --locked -p render-wasm --lib) 2>&1 | tee "$EVIDENCE/native-exposed-baseline.log"
          git restore rust/crates/render-wasm
          rm rust/crates/render-wasm/src/scheduler/runtime.rs
      - name: Reproduce cancellation regressions on original host
        run: |
          set -o pipefail
          cat .verification/wasm-cancellation-tests.ts >> web/src/render/client.test.ts
          set +e
          (cd web && bun test --preload ./tests/network-guard.preload.ts ./src/render/client.test.ts) 2>&1 | tee "$EVIDENCE/web-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q '5 fail' "$EVIDENCE/web-red.log"
          git restore web/src/render/client.test.ts
      - name: Apply focused fixes and test native lifecycle
        run: |
          set -o pipefail
          python3 .verification/apply-wasm-state.py apply
          for file in rust/crates/render-wasm/src/lib.rs rust/crates/render-wasm/src/scheduler/*.rs; do
            rustfmt +1.99.0 --edition 2024 < "$file" > /tmp/wasm-state-formatted.rs
            cp /tmp/wasm-state-formatted.rs "$file"
          done
          bash scripts/test-wasm-state.sh 2>&1 | tee "$EVIDENCE/native-state.log"
          (cd rust && cargo test --locked -p render -p psdx -p render-wasm) 2>&1 | tee "$EVIDENCE/native-all.log"
          (cd web && bun test --preload ./tests/network-guard.preload.ts ./src/render/client.test.ts) 2>&1 | tee "$EVIDENCE/web-green.log"
          for attempt in $(seq 1 20); do
            (cd web && bun test --preload ./tests/network-guard.preload.ts ./src/render/client.test.ts) >> "$EVIDENCE/web-repeat.log" 2>&1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-state-native
          path: /tmp/wasm-state-evidence
          retention-days: 14
      - name: Rebuild committed WASM and validate source manifest
        run: |
          set -o pipefail
          cargo +1.99.0 install wasm-bindgen-cli --debug --version 0.2.127 --locked
          make wasm 2>&1 | tee "$EVIDENCE/rebuild.log"
          bash scripts/check-wasm-dist.sh | tee "$EVIDENCE/manifest.log"
      - name: Full frontend and fresh renderer tests
        working-directory: web
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$EVIDENCE/web-build.log"
          bun run api:check 2>&1 | tee "$EVIDENCE/web-api.log"
          bun run test 2>&1 | tee "$EVIDENCE/web-full.log"
      - name: Actual threaded browser and init cancellation
        working-directory: web
        env:
          PODHUB_MOCK_GATE: '1'
        run: |
          set -o pipefail
          cat > .wasm-state-verify.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import { createServer } from 'vite';
          const server = await createServer({server:{port:14922,strictPort:true}});
          let browser;
          try {
            await server.listen();
            browser = await chromium.launch({channel:'chrome',headless:true});
            const context = await browser.newContext({serviceWorkers:'block'});
            await context.route('**/*', route => new URL(route.request().url()).origin === 'http://127.0.0.1:14922' ? route.continue() : route.abort());
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:14922/tests/threaded-render.html');
            await page.waitForFunction(() => typeof window.verifyThreadedRenderer === 'function', null, {timeout:30000});
            const result = await page.evaluate(() => window.verifyThreadedRenderer());
            if (!result.passed) throw new Error(JSON.stringify(result));
            console.log('threaded', JSON.stringify(result));
            const cancellation = await page.evaluate(async () => {
              const {createRuntimeHost} = await import('/src/render/threaded-client.ts');
              const host = createRuntimeHost({spawn:()=>new Worker('/src/render/threaded-worker.ts',{type:'module'}),maxLanes:2,budgetBytes:512*2**20});
              const a=host.createBatch(), b=host.createBatch();
              let entered=false, code, timer;
              try {
                const wait=a.withLane('init-cancel-fixture',async()=>{entered=true}).then(()=>{throw new Error('cancelled caller succeeded')},e=>{code=e.code});
                a.dispose();
                await Promise.race([wait,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('owner cancellation stalled')),1000)})]);
                clearTimeout(timer);
                if(code!=='RENDER_CANCELLED'||entered) throw new Error('invalid cancelled-owner result');
                await b.withLane('init-cancel-fixture',async()=>{});
                return {passed:true,code,entered};
              } finally {clearTimeout(timer);a.dispose();b.dispose()}
            });
            console.log('init-cancellation', JSON.stringify(cancellation));
          } finally {await browser?.close();await server.close()}
          JS
          node .wasm-state-verify.mjs 2>&1 | tee "$EVIDENCE/browser.log"
          rm .wasm-state-verify.mjs
      - name: Capture exact tested source and binaries
        run: |
          git add rust/crates/render-wasm web/src/render/threaded-client.ts web/src/render/client.test.ts scripts/test-wasm-state.sh .github/workflows/wasm-state.yml wasm/dist
          git diff --cached --check
          git diff --exit-code
          git diff --cached --binary > "$EVIDENCE/verified.patch"
          git diff --cached --stat > "$EVIDENCE/changes.txt"
          git ls-files -s rust/crates/render-wasm web/src/render/threaded-client.ts web/src/render/client.test.ts scripts/test-wasm-state.sh .github/workflows/wasm-state.yml wasm/dist > "$EVIDENCE/staged-blobs.txt"
          printf 'PASS\n' > "$EVIDENCE/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-state-verified
          path: /tmp/wasm-state-evidence
          retention-days: 14
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be364cb76e87dc9ea178cd322b888ab3b641d998
      - uses: actions/download-artifact@v4
        with:
          name: wasm-state-verified
          path: /tmp/wasm-state-evidence
      - name: Publish only the verified topic branch
        env:
          BRANCH: fix/wasm-runtime-lifecycle-20261020
        run: |
          set -euo pipefail
          test "$(cat /tmp/wasm-state-evidence/result.txt)" = PASS
          test "$(cat /tmp/wasm-state-evidence/verification-head.txt)" = '${{ github.sha }}'
          if git ls-remote --exit-code --heads origin "$BRANCH"; then echo 'Branch exists; refuse to overwrite'; exit 1; fi
          git switch -c "$BRANCH"
          git apply --index /tmp/wasm-state-evidence/verified.patch
          git diff --cached --check
          git ls-files -s rust/crates/render-wasm web/src/render/threaded-client.ts web/src/render/client.test.ts scripts/test-wasm-state.sh .github/workflows/wasm-state.yml wasm/dist > /tmp/published-blobs.txt
          cmp /tmp/published-blobs.txt /tmp/wasm-state-evidence/staged-blobs.txt
          bash scripts/check-wasm-dist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(wasm): test native scheduler states and fence cancelled callers'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD | tee /tmp/wasm-state-evidence/published-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-state-published
          path: /tmp/wasm-state-evidence/published-head.txt
          retention-days: 14
