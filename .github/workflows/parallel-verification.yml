name: parallel-stability-verification

on:
  push:
    branches: [verify/parallel-stability-20261020]

permissions:
  contents: read

concurrency:
  group: parallel-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact tracked source and provenance
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/podhub-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/podhub-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: podhub-verification-source
          path: |
            ${{ runner.temp }}/podhub-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 3
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - area: queue
            packages: ./internal/queue/... ./internal/platform/jobsched/...
          - area: supplier
            packages: ./internal/supplier/... ./internal/supply/... ./internal/delegate/... ./internal/admin/...
          - area: billing-identity
            packages: ./internal/billing/... ./internal/identity/...
          - area: listing-catalog
            packages: ./internal/listing/... ./internal/catalog/... ./internal/ratings/...
          - area: platform-architecture
            packages: ./internal/platform/... ./tests/archtest/...
          - area: integration-parity
            packages: ./tests/integration/... ./tests/parity/... ./tests/testkit/...
    env:
      LISTING_TAGS_WASM: wasm/dist/server/listing-tags.wasm
      WASM_HOST_PROBE: wasm/dist/test/host-probe.wasm
      LISTING_CORE_WASM: wasm/dist/server/listing-core.wasm
      LISTING_STATE_WASM: wasm/dist/browser/listing-state.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify committed WASM
        run: scripts/check-wasm-dist.sh
      - name: Test ${{ matrix.area }}
        run: |
          set -o pipefail
          go version | tee toolchain.txt
          go test -json -count=1 -timeout 25m ${{ matrix.packages }} 2>&1 | tee tests.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.area }}
          path: |
            tests.jsonl
            toolchain.txt
          retention-days: 3
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Web build, contract and tests
        working-directory: web
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run build
          bun run api:check
          bun run test 2>&1 | tee web-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-web
          path: web/web-tests.log
          retention-days: 3
