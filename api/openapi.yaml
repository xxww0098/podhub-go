    PaymentOrderView:
      type: object
      required:
      - public_id
      - plan
      - months
      - amount_cents
      - currency
      - provider
      - status
      - entry_state
      - created_at
      properties:
        amount_cents:
          type: integer
          format: int64
        canceled_at:
          type: string
          nullable: true
        created_at:
          type: string
        currency:
          type: string
        entry_state:
          type: string
          description: |-
            Where the payment entry stands, derived from the stored row alone:
            `paid` / `canceled` are the terminal statuses; `ready` means a
            stored QR or pay URL is present; `entry_confirming` means the provider
            confirmed the upstream order but this channel cannot re-issue an entry,
            so the reservation is held for reconciliation; `entry_unknown` is a
            pending order whose entry has not been stored (yet).
        months:
          type: integer
          format: int32
          description: Billed months, frozen at creation (1 / 3 / 12).
        paid_at:
          type: string
          nullable: true
        pay_url:
          type: string
          nullable: true
        plan:
          type: string
          description: The plan key of a subscription order.
        provider:
          type: string
        public_id:
          type: string
        purchase_agreement:
          oneOf:
