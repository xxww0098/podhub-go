        has_next:
          type: boolean
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/AdminDelegateOrderRow"
      additionalProperties: false
    AdminDelegateOrderRow:
      type: object
      description: |-
        管理队列一行 = 一张委托单的单级字段。厂家名集合 = 行绑定 ∪ 派发包
        涉及的厂家名（`name` 键，沿用 `SellerSupplierDbData` 的厂家名纪律）。
      required:
      - order_id
      - org_id
      - store_id
      - posting_number
      - state
      - cancel_requested
      - line_count
      - source_names
      - created_at_ms
      - updated_at_ms
      properties:
        cancel_requested:
          type: boolean
        created_at_ms:
          type: integer
          format: int64
        line_count:
          type: integer
          format: int64
        order_id:
          type: string
        org_id:
          type: integer
          format: int64
          description: Workspace row id — the admin directory view exposes the same number.
        posting_number:
          type: string
        source_names:
          type: array
          items:
            type: string
        state:
          type: string
        store_id:
          type: string
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    AdminDelegateReceiptView:
      type: object
