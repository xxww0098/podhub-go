        One Pack as its author sees it. Field names match the SPA's `FieldPackView`
        so the renderer keeps its existing shape (each side owns its own view of
        the same wire).
      required:
      - id
      - name
      - description_category_id
      - type_id
      - language
      - author_is_self
      - shared
      - active
      - source
      - updated_at_ms
      properties:
        active:
          type: boolean
        author_is_self:
          type: boolean
          description: 'Always true on this route: it lists the caller''s own Packs only.'
        description_category_id:
          type: integer
          format: int64
        id:
          type: string
        language:
          type: string
        library_id:
          type: string
          description: The Field Library id, which is the Pack's own id while it is shared.
          nullable: true
        name:
          type: string
        shared:
          type: boolean
        source:
          type: string
          description: Where the values came from. `cloud` is the only origin.
        type_id:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    FreezeRefusal:
      type: string
      description: |-
        Why a row did not freeze. Stable wire names (`snake_case` in the WASM
        projection); the issues attached to the refusal carry the details.

        A closed set with one owner: the serde names, [`Self::as_str`], the
        `FreezeRefusal` OpenAPI component (feature `openapi`, registered by
        Cloud's publish doc) and the WASM op 11 `reason` are the same six
        literals, enumerated by [`Self::ALL`]. Decoding is strict — there is no
        catch-all variant, so an unknown reason fails instead of turning into a
        known one. These are *reasons*, not issue codes: the freeze-stage
        `FieldIssue` codes are [`crate::issue_keys::OzonFreezeCode`]
        (`language_mismatch` rides under `coordinate_mismatch`,
        `ai_candidate_unresolved` under `candidates_unresolved`), and
        `validation_failed` carries validate codes.
      enum:
      - row_id_invalid
      - schema_stale
      - coordinate_mismatch
      - candidates_unresolved
      - validation_failed
      - freeze_failed
    ImportFollowupPhase:
      type: string
      description: |-
        Where an accepted import is, after a read of the import task and the
        product. Absent means the screen keeps 「已受理」.
      enum:
      - pending
      - moderating
      - created
      - import_failed
      - moderation_failed
      - skipped
    ImportFollowupView:
      type: object
      description: |-
        Operator-facing import or moderation progress for an accepted row.
        The browser copies `detail` as written; it does not classify Ozon.
      required:
      - phase
      - detail
      properties:
        detail:
          type: string
        phase:
          "$ref": "#/components/schemas/ImportFollowupPhase"
      additionalProperties: false
    ImportProbePhase:
      type: string
      description: Whether an unknown import is still on the automatic read schedule.
      enum:
      - checking
      - needs_manual
    ImportProbeView:
      type: object
      description: |-
        Progress of the read-only import probe. Present only while the current
        input's Intent is `unknown`. The browser formats the clock; it does not
        decide the phase.
      required:
      - phase
      - passes
      properties:
        next_check_at_ms:
          type: integer
          format: int64
          description: |-
            Next automatic read, unix milliseconds. Absent after the cap: a
            leftover `reconcile_after` on a stopped row is not a promise.
          nullable: true
        passes:
          type: integer
          format: int32
          description: Recorded observations, including a historical `probePassCount`.
        phase:
          "$ref": "#/components/schemas/ImportProbePhase"
      additionalProperties: false
