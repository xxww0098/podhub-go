          type: integer
          format: int64
        rate_limited_until_ms:
          type: integer
          format: int64
    ProductMutationCommand:
      type: object
      description: |-
        Stable client-generated identity plus the Store whose products were shown
        when the operator confirmed the mutation.
      required:
      - operation_id
      - store_id
      - request
      properties:
        operation_id:
          type: string
        request:
          "$ref": "#/components/schemas/ProductMutationRequest"
        store_id:
          type: string
      additionalProperties: false
    ProductMutationItemResult:
      type: object
      required:
      - identity
      - succeeded
      - message
      properties:
        identity:
          type: string
        message:
          type: string
        succeeded:
          type: boolean
    ProductMutationRequest:
      oneOf:
      - type: object
        required:
        - items
        - kind
        properties:
          items:
            type: array
            items:
              "$ref": "#/components/schemas/ProductStockMutationItem"
          kind:
            type: string
            enum:
            - stock
      - type: object
        required:
        - items
        - kind
        properties:
          items:
            type: array
            items:
              "$ref": "#/components/schemas/ProductPriceMutationItem"
          kind:
            type: string
            enum:
            - price
      - type: object
        required:
        - product_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - archive
          product_ids:
            type: array
            items:
              type: integer
              format: int64
      - type: object
        required:
        - product_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - unarchive
          product_ids:
            type: array
            items:
              type: integer
              format: int64
      - type: object
        required:
        - offer_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - delete
          offer_ids:
            type: array
            items:
              type: string
      - type: object
        description: Join or adjust a promotion. Boosting updates also change the product's unified price.
        required:
        - action_id
        - action_type
        - items
        - kind
        properties:
          action_id:
            type: integer
            format: int64
          action_type:
            type: string
            enum: [PROMOCODE, ELASTIC_BOOSTING, STOCK_DISCOUNT]
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              "$ref": "#/components/schemas/ProductPromotionMutationItem"
          kind:
            type: string
            enum: [promotion_join]
      - type: object
        description: |-
          Withdraw products. PROMOCODE uses deactivation. Boosting promotions
          require a price strictly above the activity limit and change the
          product's unified price.
        required:
        - action_id
        - action_type
        - product_ids
        - kind
        properties:
          action_id:
            type: integer
            format: int64
          action_type:
            type: string
            enum: [PROMOCODE, ELASTIC_BOOSTING, STOCK_DISCOUNT]
          exit_prices:
            type: array
            maxItems: 100
            description: Required one-to-one with product_ids for boosting; absent for PROMOCODE.
            items:
              "$ref": "#/components/schemas/ProductPromotionExitPrice"
          kind:
            type: string
            enum: [promotion_leave]
          product_ids:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              format: int64
      description: |-
        One absolute product-page state change. Absolute, not relative, so a probe
        can decide whether it happened by looking at the current state alone.
    ProductMutationResponse:
      type: object
      required:
      - operation_id
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMutationItemResult"
        operation_id:
          type: string
    ProductOfficialState:
      type: string
      enum:
      - active
      - moderating
      - delisted
      - archived
      - missing
      - unknown
    ProductPriceMutationItem:
      type: object
      required:
      - product_id
      - offer_id
      - price
      - old_price
      - currency_code
      properties:
        currency_code:
          type: string
        offer_id:
          type: string
        old_price:
          type: string
        price:
          type: string
        product_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductPromotionActionView:
      type: object
      description: |-
        One live seller activity. The selected counts apply only to a selected-product
        overview; the total counts always describe the whole store.
      required:
      - action_id
      - title
      - action_type
      - date_start
      - date_end
      - freeze_date
      - is_participating
      - eligible_selected
      - participating_selected
      - potential_products_total
      - participating_products_total
      properties:
        action_id:
          type: integer
          format: int64
        action_type:
          type: string
        date_end:
          type: string
        date_start:
          type: string
        eligible_selected:
          type: integer
          format: int64
          description: Selected products Ozon accepts into this promotion.
        freeze_date:
          type: string
          description: |-
            Non-empty means Ozon reports frozen terms. Raising prices, changing
            participation or reducing committed stock is blocked.
        is_participating:
          type: boolean
        participating_products_total:
          type: integer
          format: int64
        participating_selected:
          type: integer
          format: int64
          description: Selected products already in this promotion.
        potential_products_total:
          type: integer
          format: int64
          description: Whole-store counts, for context on a partial selection.
        title:
          type: string
    ProductPromotionExitPrice:
      type: object
      description: A unified price strictly above the promotion limit.
      required: [product_id, exit_price, currency_code]
      properties:
        exit_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,2})?$'
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        product_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductPromotionMutationItem:
      type: object
      required: [product_id, offer_id, action_price, currency_code, stock]
      properties:
        action_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,2})?$'
          description: Explicit price in currency_code; must not exceed max_action_price. No automatic clamping.
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        offer_id:
          type: string
        product_id:
          type: integer
          format: int64
        stock:
          type: integer
          minimum: 0
          description: Committed units for PROMOCODE only; zero and omitted upstream for boosting.
      additionalProperties: false
    ProductPromotionOfferView:
      type: object
      description: Live terms for one product inside one promotion. Unknown optional values remain null.
      required:
      - action_id
      - product_id
      - participating
      - price
      - price_currency_code
      - action_price
      - max_action_price
      - currency_code
      - add_mode
      - stock
      - min_stock
      - current_boost
      - min_boost
      - max_boost
      - price_min_elastic
      - price_max_elastic
      - price_quarantined
      properties:
        action_id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        offer_id:
          type: string
        name:
          type: string
        sku:
          type: string
          description: Exact Ozon SKU decimal identifier; never a floating-point number.
        participating:
          type: boolean
        price:
          type: string
          description: Current price amount in price_currency_code, as supplied by Ozon.
        price_currency_code:
          type: string
        action_price:
          type: string
        max_action_price:
          type: string
          description: Actual highest price Ozon accepts, without adjustment.
        currency_code:
          type: string
          description: Currency for action_price, max_action_price and elastic prices. May differ from price_currency_code.
        add_mode:
          type: string
          description: Ozon SELLER or AUTO; empty for an unspecified source.
        stock:
          type: integer
          nullable: true
        min_stock:
          type: integer
          nullable: true
        current_boost:
          type: number
          nullable: true
        min_boost:
          type: number
          nullable: true
        max_boost:
          type: number
          nullable: true
        price_min_elastic:
          type: string
          description: Empty when not supplied by Ozon.
        price_max_elastic:
          type: string
          description: Empty when not supplied by Ozon.
        price_quarantined:
          type: boolean
          nullable: true
    ProductPromotionsRequest:
      type: object
      required: [store_id, product_ids]
      properties:
        store_id:
          type: string
          format: uuid
        product_ids:
          type: array
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          description: Selected-product overview. Empty without action_id reads only the activity catalog.
        action_id:
          type: integer
          format: int64
          minimum: 1
          description: Read one activity page; requires participating and empty product_ids.
        participating:
          type: boolean
          description: True for participating products; false for candidates. Requires action_id.
        cursor:
          type: string
          maxLength: 256
          description: Opaque cursor returned by the previous page; only valid with action_id.
      additionalProperties: false
    ProductPromotionsView:
      type: object
      required: [actions, offers]
      properties:
        actions:
          type: array
          items:
            "$ref": "#/components/schemas/ProductPromotionActionView"
        offers:
          type: array
          items:
            "$ref": "#/components/schemas/ProductPromotionOfferView"
        total:
          type: integer
          minimum: 0
          description: Ozon's total for the selected activity and participation tab.
        next_cursor:
          type: string
          nullable: true
          description: Null after the last activity product page.
    ProductStockMutationItem:
      type: object
      required:
      - product_id
      - offer_id
      - sku
      - warehouse_id
      - stock
      properties:
        offer_id:
          type: string
        product_id:
          type: integer
          format: int64
        sku:
          type: integer
          format: int64
          description: |-
            Ozon SKU. The write is addressed by `product_id` when it is positive;
            the read-only settlement probe can only query stock by SKU, so it
            travels with the request and is persisted in the write ledger.
        stock:
          type: integer
          format: int64
        warehouse_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductStorePerformance:
      type: object
      required:
      - period_days
      - hits_view
      - session_view
      - ordered_units
      - revenue
      - through_day
      properties:
        hits_view:
          type: number
