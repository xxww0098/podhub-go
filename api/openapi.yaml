          type: integer
          format: int64
          description: Stores whose summary is fresh or stale (counted into `totals`).
        total:
          type: integer
          format: int64
          description: Every visible store, including expired and never-synced ones.
      additionalProperties: false
    StoreProductsListData:
      type: object
