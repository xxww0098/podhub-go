  "/api/listing/submit":
    post:
      operationId: postListingSubmit
      tags:
      - listing
      summary: 'Freeze stored rows or drafts and enqueue listing.submit.batch. The body shape selects the path: row_ids is a stored-row batch send, store_id or items is a Draft send, anything else is a tag check. A stored-row send requires the exact server revisions captured by the click. A tag check needs no principal; a batch or Draft send requires the submit role. It does not dial Ozon.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListingSubmitRequest"
      responses:
        '200':
          description: Batch or Draft send frozen and enqueued; per-row items
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingSubmitResponse"
        '400':
          description: The body is not a tag check, a banned tag refused the gate, the Draft envelope is invalid, or the stored-row IDs and revision pins are not a one-to-one match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '403':
          description: Role cannot submit
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '404':
          description: The card or row no longer exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '409':
          description: Rules or schema must be refreshed, the store send slot is held, or a stored row changed during freeze (code revision_mismatch). A revision_mismatch rolls back this entire request; none of its new intents or jobs are committed. A revision already stale when read is instead returned as an individual skipped item in the 200 response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '503':
          description: Rules or the matcher could not be evaluated. This is not a pass.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
