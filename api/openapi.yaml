        code:
          "$ref": "#/components/schemas/ListingErrorCode"
        conflict:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRevisionConflict"
            description: |-
              Present on revision CAS conflict (HTTP 409). Boxed: every listing
              handler returns this body in its `Err`, and a conflict is the rare case.
        denial:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/SupplierOzonConfigDenial"
            description: |-
              Present only with `code: supplier_not_listable` (HTTP 409): the
              machine-readable reason the supplier product cannot be listed.
        error:
          type: string
        queue_level:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingQueueLevel"
            description: |-
              Present on HTTP 429 admission refusals: the submitter's lane
