      - NOT_FOUND
      - CONFLICT
      - INTERNAL
      - WRITES_DISABLED
    AvatarErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/AvatarErrorCode"
        error:
          type: string
      additionalProperties: false
    CancelPrepareListingRowData:
      type: object
      required:
      - jobs
      properties:
        jobs:
          type: array
          items:
            "$ref": "#/components/schemas/ListingRunView"
          description: Prepare jobs that received `cancel_requested_at` in this call.
      additionalProperties: false
    CatalogCoordinateFreshness:
      type: object
      description: |-
        Freshness rollup over the catalogue rows the daily fetch maintains, in the
        fetch's configured language.

        `total` partitions into `fresh` + `stale` + `expired` + `missing`. The bands
        are classified by `ozon_catalog::contract::catalog_freshness` at read time —
        readers render these counts and never recompute an age, so the 24h/72h
        thresholds keep exactly one owner.
      required:
      - total
      - fresh
      - stale
      - expired
      - missing
      properties:
        expired:
          type: integer
          format: int64
          description: Past `CATALOG_MAX_AGE_MS` — admission fails closed on these.
        fresh:
          type: integer
          format: int64
          description: Inside the daily refresh cadence.
        missing:
          type: integer
          format: int64
          description: Referenced by a product but with no `ozon_category_current` row at all.
        stale:
          type: integer
          format: int64
          description: |-
            Past `CATALOG_STALE_AGE_MS` but inside `CATALOG_MAX_AGE_MS` — still
            listable, operator-visible.
        total:
          type: integer
          format: int64
          description: |-
            Referenced coordinates counted, capped at the referenced-coordinate
            bound (the surplus is truncated, not reported).
      additionalProperties: false
    CatalogDictionarySearchRequest:
      type: object
      description: Platform-authenticated live dictionary lookup; no Store credential selector.
      required:
      - attribute_id
      - description_category_id
      - type_id
      - limit
      - value
      properties:
        attribute_id:
          type: integer
          format: int64
        description_category_id:
          type: integer
          format: int64
        language:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CatalogSchemaLanguage"
        limit:
          type: integer
          format: int64
        type_id:
          type: integer
          format: int64
        value:
          type: string
      additionalProperties: false
    CatalogDictionarySearchResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSchemaOption"
        total:
          type: integer
          format: int64
    CatalogErrorCode:
      type: string
      enum:
      - auth_invalid
      - auth_required
      - forbidden
      - validation
      - conflict
      - internal
      - capability_not_ready
      - not_found
      - writes_disabled
    CatalogErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/CatalogErrorCode"
        error:
          type: string
      additionalProperties: false
    CatalogFetchConfigData:
      type: object
      description: The whole configuration plus its runtime state.
      required:
      - enabled
      - schedule_mode
      - at_minute
      - window_start_minute
      - window_end_minute
      - utc_offset_minutes
      - language
      - keys
      - wb_credential
      - last_error
      - last_key_attempts
      - failure_streak
      - running
      - coordinate_freshness
      - updated_at_ms
      properties:
        at_minute:
          type: integer
          format: int32
          description: Minute of day (0..1439) for `fixed`.
        coordinate_freshness:
          "$ref": "#/components/schemas/CatalogCoordinateFreshness"
          description: |-
            How fresh the catalogue is at the coordinates supplier products
            reference — the "is the daily fetch keeping up" summary the pane shows.
        enabled:
          type: boolean
        failure_streak:
          type: integer
          format: int32
          description: |-
            Consecutive failures. Above the retry bound the schedule returns to the
            daily slot instead of retrying every few minutes.
        keys:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogFetchKeyView"
          description: The ordered failover list. Empty means the feature has no key yet.
        language:
          "$ref": "#/components/schemas/CatalogTreeLanguage"
          description: Language variant the daily fetch downloads and caches.
        last_duration_ms:
          type: integer
          format: int64
          nullable: true
        last_error:
          type: string
          description: Operator-facing failure detail of the last run; empty after a success.
        last_key_attempts:
          type: integer
          format: int32
          description: How many keys that run tried. 1 means the first one answered.
        last_key_client_id:
          type: string
          description: |-
            Client-Id of the last run's final attempt: the key that served it on
            success, or the last one tried before giving up.
          nullable: true
        last_root_nodes:
          type: integer
          format: int64
          nullable: true
        last_run_at_ms:
          type: integer
          format: int64
          nullable: true
        last_status:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CatalogFetchRunStatus"
        next_run_at_ms:
          type: integer
          format: int64
          nullable: true
        running:
          type: boolean
          description: |-
            A run — manual or scheduled — holds the claim right now. The `last_*`
            fields still describe the previous run until this one records.
        schedule_mode:
          "$ref": "#/components/schemas/CatalogFetchScheduleMode"
        updated_at_ms:
          type: integer
          format: int64
        utc_offset_minutes:
          type: integer
          format: int32
          description: Offset from UTC in minutes; the schedule is wall-clock local to it.
        wb_credential:
          "$ref": "#/components/schemas/CatalogFetchWbCredentialView"
        window_end_minute:
          type: integer
          format: int32
        window_start_minute:
          type: integer
          format: int32
          description: Local window `[window_start_minute, window_end_minute)` for `random`.
      additionalProperties: false
    CatalogFetchConfigWriteRequest:
      type: object
      description: |-
        A full replacement of the settings. The submitted list order is the
        failover order.
      required:
      - enabled
      - schedule_mode
      - at_minute
      - window_start_minute
      - window_end_minute
      - utc_offset_minutes
      - language
      - keys
      properties:
        at_minute:
          type: integer
          format: int32
        enabled:
          type: boolean
        keys:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogFetchKeyInput"
        language:
          "$ref": "#/components/schemas/CatalogTreeLanguage"
        schedule_mode:
          "$ref": "#/components/schemas/CatalogFetchScheduleMode"
        utc_offset_minutes:
          type: integer
          format: int32
        window_end_minute:
          type: integer
          format: int32
        window_start_minute:
          type: integer
          format: int32
      additionalProperties: false
    CatalogFetchKeyInput:
      type: object
      description: |-
        One submitted key. An empty `api_key` keeps the stored one for this
        Client-Id; there being nothing stored is a first configuration and must
        carry a key.
      required:
      - client_id
      properties:
        api_key:
          type: string
        client_id:
          type: string
      additionalProperties: false
    CatalogFetchKeyView:
      type: object
      description: One configured key, in list order. The Api-Key is a flag here, never a value.
      required:
      - client_id
      - api_key_configured
      - disabled
      properties:
        api_key_configured:
          type: boolean
          description: Whether a sealed Api-Key is stored for this Client-Id.
        client_id:
          type: string
          description: Seller Client-Id. Not a secret, so it is read back for display.
        disabled:
          type: boolean
          description: |-
            Whether a run saw Ozon refuse this credential and retired it from the
            failover list. Replaced secrets re-enable; kept ones stay retired.
      additionalProperties: false
    CatalogFetchRunStatus:
      type: string
      enum:
      - ok
