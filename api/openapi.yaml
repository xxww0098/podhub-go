      - line_count
      - created_at_ms
      - updated_at_ms
      properties:
        attempted_by:
          type: string
          description: "`'auto'` 或 `admin:<account_id>`（spec §D.15）。"
        created_at_ms:
          type: integer
          format: int64
        dispatch_id:
          type: string
        dispatch_no:
          type: string
        line_count:
          type: integer
          format: int64
          description: 包 payload 冻结的行数。
        receipt:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/AdminDelegateReceiptView"
        source:
          "$ref": "#/components/schemas/SellerSupplierDbData"
          description: 厂家 header — `name` is the factory-name key.
        state:
          type: string
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    AdminDelegateOrderDetailView:
      type: object
