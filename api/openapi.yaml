      - renews_lot_id
      - term
      - provider
      - expected_workspace_uuid
      properties:
        expected_workspace_uuid:
          type: string
          description: Same contract as [`PaymentIntentRequest::expected_workspace_uuid`].
        operation_id:
          type: string
          description: Same contract as [`PaymentIntentRequest::operation_id`].
        provider:
          type: string
        purchase_agreement:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/PurchaseAgreementAcceptance"
        renews_lot_id:
          type: integer
          format: int64
          description: "`member_seat_lots.id` of the lot being extended."
