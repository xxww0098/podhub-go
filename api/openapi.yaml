        agents:
          type: array
          items:
            "$ref": "#/components/schemas/AdminAgentView"
        attribution_validity_days:
          type: integer
          format: int64
        default_rebate_bps:
          type: integer
          format: int64
        min_order_cents:
          type: integer
          format: int64
        min_withdraw_cents:
          type: integer
          format: int64
      additionalProperties: false
    AdminAgentRebatePolicyData:
      type: object
      required:
      - default_rebate_bps
      - min_order_cents
      - attribution_validity_days
      - min_withdraw_cents
      properties:
        attribution_validity_days:
          type: integer
          format: int64
        default_rebate_bps:
          type: integer
          format: int64
        min_order_cents:
          type: integer
          format: int64
        min_withdraw_cents:
          type: integer
          format: int64
      additionalProperties: false
    AdminAgentRebatePolicyRequest:
      type: object
      description: The whole platform rebate policy, replaced atomically.
      required:
      - default_rebate_bps
      - min_order_cents
      - attribution_validity_days
      - min_withdraw_cents
      properties:
        attribution_validity_days:
          type: integer
          format: int64
          description: Days an attribution stays open; 0 means it never expires.
        default_rebate_bps:
          type: integer
          format: int64
          description: 0–10000; 1000 means 10 %.
        min_order_cents:
          type: integer
          format: int64
          description: The first order must reach this amount to qualify.
        min_withdraw_cents:
          type: integer
          format: int64
          description: The smallest withdrawal the platform pays out.
      additionalProperties: false
    AdminAgentUpdateRequest:
      type: object
