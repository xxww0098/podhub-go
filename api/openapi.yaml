          type: array
          items:
            "$ref": "#/components/schemas/ProductMonitorItem"
        store_id:
          type: string
        sync_states:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMonitorSyncState"
    ProductMonitorSyncState:
      type: object
      required:
