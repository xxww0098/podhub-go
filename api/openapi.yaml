          format: int64
        intent_id:
          type: string
        phase:
          type: string
          description: |-
            Open string: `pre_dispatch` or `submit` for every issue this build
            mints (the stage of its `KnownIssueKey`); another value is kept as
            written and is unclassified.
        provider_code:
          type: integer
          format: int64
          nullable: true
        remediation:
