components:
  parameters:
    CatalogLanguage:
      in: query
      name: language
      required: true
      schema:
        type: string
        enum:
        - default
        - ru
        - en
        - tr
        - zh_hans
    CatalogStoreID:
      in: query
      name: store_id
      required: false
      description: Store uuid visible to the caller; enables a live fill on a cache miss
      schema:
        type: string
    AIIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    AILogType:
      in: query
      name: type
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 7
    AILogStart:
      in: query
      name: start_timestamp
      required: false
      schema:
        type: integer
        format: int64
    AILogEnd:
      in: query
      name: end_timestamp
      required: false
      schema:
        type: integer
        format: int64
    AILogModel:
      in: query
      name: model_name
      required: false
      schema:
        type: string
    AILogToken:
      in: query
      name: token_name
      required: false
      schema:
        type: string
    AILogGroup:
      in: query
      name: group
      required: false
      schema:
        type: string
    AILogRequestID:
      in: query
      name: request_id
      required: false
      schema:
        type: string
    AILogUpstreamID:
      in: query
      name: upstream_request_id
      required: false
      schema:
        type: string
    AILogUsername:
      in: query
      name: username
      required: false
      description: Applied only for workspace managers
      schema:
        type: string
    AILogChannel:
      in: query
      name: channel
      required: false
      description: Applied only for workspace managers
      schema:
        type: integer
  responses:
    AIError:
      description: AI error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AIError"
    AIRetryError:
      description: AI error; Retry-After is set when the same key is in flight or the relay is busy
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AIError"
    BillingError:
      description: Billing error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/BillingError"
    BillingProviderClosed:
      description: The provider has no verification key configured; code PAYMENT_NOT_AVAILABLE
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/BillingError"
    BillingPlainError:
      description: Plain-text refusal written by http.Error
      content:
        text/plain:
          schema:
            type: string
    CatalogError:
      description: Catalog error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CatalogError"
    CatalogBusy:
      description: Another request is filling the same cache entry
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CatalogError"
    StoreError:
      description: Store error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/StoreError"
    WorkspaceStoreError:
      description: Workspace Store error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/WorkspaceStoreErrorResponse"
    RatingError:
      description: Rating error; Cache-Control is no-store
      headers:
        Cache-Control:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/RatingError"
  schemas:
    StoreError:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
          enum:
          - VALIDATION
          - AUTH_REQUIRED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - INTERNAL
    StoreRenameRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
    StoreRefreshRequest:
      type: object
      additionalProperties: false
      description: Empty object; an empty body is also accepted
    StoreRefreshResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - company_short_name
      - company_legal_name
      - name_source
      - create_order
      - company_currency
      - company_country
      - subscription_is_premium
      - subscription_type
      - seller_info_synced_at
      - seller_key_status
      - seller_key_reason
      - currency_mismatch
      - currency_warning
      properties:
        id:
          type: string
        name:
          type: string
        company_short_name:
          type: string
        company_legal_name:
          type: string
        name_source:
          type: string
          enum:
          - auto
          - manual
        create_order:
          type: integer
          format: int64
        company_currency:
          type: string
        company_country:
          type: string
        subscription_is_premium:
          type: boolean
          nullable: true
        subscription_type:
          type: string
        seller_info_synced_at:
          type: string
          format: date-time
          nullable: true
        seller_key_status:
          type: string
          enum:
          - valid
          - invalid
          - unknown
        seller_key_reason:
          type: string
        currency_mismatch:
          type: boolean
        currency_warning:
          type: string
    RatingError:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
          enum:
          - validation
          - auth_invalid
          - forbidden
          - not_found
          - internal
    RatingItem:
      type: object
      additionalProperties: false
      required:
      - rating_key
      - name
      - value_type
      - status
      - current_value
      - past_value
      - no_data
      - direction
      - synced_at
      properties:
        rating_key:
          type: string
        name:
          type: string
        value_type:
          type: string
        status:
          type: string
        current_value:
          type: number
          nullable: true
        past_value:
          type: number
          nullable: true
        no_data:
          type: boolean
        direction:
          type: string
          enum:
          - no_data
          - flat
          - up
          - down
        synced_at:
          type: string
          format: date-time
    RatingHistoryItem:
      type: object
      additionalProperties: false
      required:
      - id
      - rating_key
      - name
      - value_type
      - status
      - current_value
      - past_value
      - no_data
      - recorded_at
      properties:
        id:
          type: integer
          format: int64
        rating_key:
          type: string
        name:
          type: string
        value_type:
          type: string
        status:
          type: string
        current_value:
          type: number
          nullable: true
        past_value:
          type: number
          nullable: true
        no_data:
          type: boolean
        recorded_at:
          type: string
          format: date-time
    RatingListResponse:
      type: object
      additionalProperties: false
      required:
      - store_id
      - items
      properties:
        store_id:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/RatingItem"
    RatingHistoryResponse:
      type: object
      additionalProperties: false
      required:
      - store_id
      - items
      - next_cursor
      properties:
        store_id:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/RatingHistoryItem"
        next_cursor:
          type: integer
          format: int64
          nullable: true
    AIError:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
    AIPrice:
