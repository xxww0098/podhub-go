    DesktopErrorLogV4:
      type: object
      required:
      - schema_version
      - diagnostic_id
      - platform
      - stage
      - field
      - code
      - occurred_at
      - trace_id
      - payload_sha256
      - summary
      properties:
        code:
          "$ref": "#/components/schemas/DiagnosticCode"
        diagnostic_id:
          type: string
          maxLength: 36
          minLength: 36
        field:
          type: string
          maxLength: 128
          nullable: true
        occurred_at:
          type: string
          description: RFC3339 timestamp, at most 40 bytes, nonnegative Unix time.
          maxLength: 40
        payload_sha256:
          type: string
          description: Exactly 64 lowercase hex digits; null iff no payload was available.
          pattern: "^[0-9a-f]{64}$"
          nullable: true
        platform:
          type: string
          description: Adapter slug, ASCII [a-z][a-z0-9_-]{0,31}; future adapters are legal.
          maxLength: 32
          minLength: 1
          pattern: "^[a-z][a-z0-9_-]*$"
        schema_version:
          type: integer
          format: int32
          maximum: 4
          minimum: 4
        stage:
          "$ref": "#/components/schemas/DiagnosticStage"
        summary:
          type: array
          items:
            "$ref": "#/components/schemas/DiagnosticFieldSummary"
          maxItems: 64
        trace_id:
          type: string
          description: Request correlation, 1..=128 ASCII letters/digits/underscore/hyphen/dot.
          maxLength: 128
          minLength: 1
          pattern: "^[A-Za-z0-9_.-]+$"
      additionalProperties: false
    DiagnosticCode:
      type: string
      enum:
      - contract_violation
      - unclassified_server
      - wasm_exception
      - result_unknown
    DiagnosticEnumValue:
      type: string
      description: Only unit/currency choices, additionally constrained by the field address.
      enum:
      - RUB
      - USD
      - EUR
      - CNY
      - mm
      - cm
      - m
      - g
      - kg
    DiagnosticFieldSummary:
      type: object
      required:
      - field
      - field_id
      - value_type
      - length
      - enum_value
      properties:
        enum_value:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/DiagnosticEnumValue"
        field:
          type: string
        field_id:
          type: integer
          format: int64
          description: Native catalog ID, 0..=2^53-1; only catalog-addressed fields allow it.
          maximum: 9007199254740991
          minimum: 0
          nullable: true
        length:
          type: integer
          format: int32
          description: Unicode scalar count / array or object count; null for null/boolean/number.
          minimum: 0
          nullable: true
        value_type:
          "$ref": "#/components/schemas/DiagnosticValueType"
      additionalProperties: false
    DiagnosticStage:
      type: string
      enum:
      - import
      - edit
      - prepare
      - validate
      - build
      - freeze
      - preview
      - pre_dispatch
      - submit
      - reconcile
      - repair
      - result
    DiagnosticValueType:
      type: string
      enum:
      - 'null'
      - boolean
      - number
      - string
      - array
      - object
    DirectUploadGrant:
