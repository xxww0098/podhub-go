        cached_input_microfen:
          type: integer
          format: int64
        cached_prompt_tokens:
          type: integer
          format: int64
        charged_microfen:
          type: integer
          format: int64
          description: Ledger debit min(total, held); charged + absorbed = nominal total.
        completion_tokens:
          type: integer
          format: int64
        created_at:
          type: string
        error_class:
          type: string
          description: Server-owned failure class (legacy rows may retain upstream_status), never provider text.
          nullable: true
        model:
          type: string
        output_microfen:
          type: integer
          format: int64
        price:
          "$ref": "#/components/schemas/AiPriceView"
        prompt_tokens:
          type: integer
          format: int64
        reasoning_completion_tokens:
          type: integer
          format: int64
        reasoning_microfen:
          type: integer
          format: int64
        request_id:
          type: string
        settled_at:
