          type: boolean
    WorkspaceBillingOverviewData:
      type: object
      description: |-
        The Workspace's entitlement overview for the plans screen — a display
        projection over `member_seat_lots` and the admin overrides, never a second
        authorization source.

        `plan_expires_at` is the stored `organizations` projection: the *latest*
        expiry among unexpired lots, future-dated renewal successors included. It
        is not "the current tier's end" — mixed lots make that reading wrong, so
        per-lot timing lives on `lots` and `next_change`.
      required:
      - plan
      - purchased_seats
      - member_seats
      - store_slots
      - lots
      - upgrade_credits
      properties:
        lots:
          type: array
          items:
            "$ref": "#/components/schemas/MemberSeatLotView"
          description: Every unexpired lot, earliest expiry first.
        member_seats:
          "$ref": "#/components/schemas/WorkspaceQuotaView"
          description: |-
            Member seats: `default` is the purchased count floored at one,
            `overrideValue` the admin's persisted `member_seat_limit_override`,
            `effective`/`used`/`suspended` the live state.
        next_change:
          "$ref": "#/components/schemas/EntitlementChangeView"
          description: The next instant the purchased state changes, and what it changes to.
        plan:
          type: string
          description: Highest tier among currently-active lots (the badge).
        plan_expires_at:
          type: string
        purchased_seats:
          type: integer
          format: int64
          description: |-
            Seats summed over currently-active lots (0 on the free tier — the
            owner seat is a floor, not a purchase).
        store_slots:
          "$ref": "#/components/schemas/WorkspaceQuotaView"
          description: |-
            Store slots: `default` follows the effective seats on the active tier,
            `overrideValue` the admin's persisted `store_limit_override`.
        upgrade_credits:
          type: array
          items:
            "$ref": "#/components/schemas/SeatUpgradeCreditView"
          description: 'One row per purchasable tier: what an upgrade to it would deduct today.'
      additionalProperties: false
    WorkspaceInvitationEntry:
      type: object
      description: |-
        One pending Workspace Invitation. It is addressed to an email rather than to a
        person, so it has no display name, and it always carries the uuid the
        roster revokes it by — never a one-time token.
      required:
      - id
      - uuid
      - email
      - role
      - invited_by_email
      - created_at_ms
      - expires_at_ms
      properties:
        created_at_ms:
          type: integer
          format: int64
          minimum: 0
        email:
          type: string
        expires_at_ms:
          type: integer
          format: int64
          minimum: 0
        id:
          type: integer
          format: int64
        invited_by_email:
          type: string
        role:
          type: string
        uuid:
          type: string
      additionalProperties: false
    WorkspaceMemberPermissions:
      type: object
      description: Actions on this particular Membership, including target-role and self checks.
      required:
      - remove
      properties:
        change_roles:
          type: array
          items:
            type: string
          description: |-
            Stored roles the caller may move this member onto via
            `PUT /api/workspaces/members/{id}/role` (`manager` / `member`). Empty
            when the caller may not change this member's role at all.
        remove:
          type: boolean
      additionalProperties: false
    WorkspaceMembersData:
      type: object
      description: |-
        Active Workspace roster. A Membership and a pending Invitation are different
        entities with disjoint states, so they travel as separate lists rather than
        as one list discriminated by a `kind` tag.
      required:
      - permissions
      - members
      - invitations
      - seats_used
      - pending_used
      - pending_limit
      properties:
        invitations:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceInvitationEntry"
        members:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceMembershipEntry"
        pending_limit:
          type: integer
          format: int64
        pending_used:
          type: integer
          format: int64
        permissions:
          "$ref": "#/components/schemas/WorkspacePermissions"
        seats_used:
          type: integer
          format: int64
      additionalProperties: false
    WorkspaceMembershipEntry:
      type: object
      description: One joined seat on the Active Workspace.
      required:
      - id
      - name
      - email
      - role
      - status
      - joined_at_ms
      - permissions
      properties:
        email:
          type: string
        id:
          type: integer
          format: int64
        joined_at_ms:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        permissions:
          "$ref": "#/components/schemas/WorkspaceMemberPermissions"
        role:
          type: string
        status:
          "$ref": "#/components/schemas/WorkspaceMembershipStatus"
      additionalProperties: false
    WorkspaceMembershipStatus:
      type: string
      description: |-
        The seat states a joined Membership can be in. A pending Workspace Invitation is
        not a Membership and never carries one of these.
      enum:
      - active
      - manual_disabled
      - quota_suspended
    WorkspacePermissions:
      type: object
      description: |-
        Role-level actions for the usable caller on the Active Workspace. Writes still
        revalidate membership, target constraints and quotas in their transaction.
      required:
      - invite_roles
      - revoke_invitation
      - edit_profile
      - dissolve
      - leave
      properties:
        dissolve:
          type: boolean
        edit_profile:
          type: boolean
        invite_roles:
          type: array
          items:
            type: string
        leave:
          type: boolean
        revoke_invitation:
          type: boolean
      additionalProperties: false
    WorkspaceQuotaView:
      type: object
      description: |-
        One Workspace resource quota: plan default, nullable Workspace override, effective
        value, current usage and suspended quantity.
      required:
      - default
      - effective
      - used
      - suspended
      properties:
        default:
          type: integer
          format: int64
          description: Plan default for this resource.
        effective:
          type: integer
          format: int64
          description: Effective quota after applying the Workspace override.
        override_value:
          type: integer
          format: int64
          description: Workspace override; null means the plan default applies.
          nullable: true
        suspended:
          type: integer
          format: int64
          description: Quantity suspended by quota enforcement.
        used:
          type: integer
          format: int64
          description: Currently in-use quantity.
      additionalProperties: false
    WorkspaceStoreAssignee:
      type: object
      description: |-
        The one Membership assigned to run a Store (`docs/workspace-store-credentials.md`).
        Absent means the Store is unassigned: Owner / Manager only.
      required:
      - membership_id
      - name
      - email
      properties:
        email:
          type: string
        membership_id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties: false
    WorkspaceStoreAssigneeRequest:
      type: object
      description: 'Reassign a Store. `assigneeMembershipId: null` makes it unassigned.'
      required:
      - revision
      properties:
        assignee_membership_id:
          type: integer
          format: int64
          nullable: true
        revision:
          type: integer
          format: int64
      additionalProperties: false
    WorkspaceStoreData:
      type: object
      required:
      - store
      properties:
        quota_changes:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreQuotaChanges"
            description: Store transitions caused by this mutation, when any.
        store:
          "$ref": "#/components/schemas/WorkspaceStoreView"
      additionalProperties: false
    WorkspaceStoreErrorCode:
      type: string
      enum:
      - AUTH_INVALID
      - AUTH_REQUIRED
      - FORBIDDEN
      - VALIDATION
      - CONFLICT
      - NOT_FOUND
      - INTERNAL
      - WRITES_DISABLED
      - QUOTA_EXHAUSTED
      - UPSTREAM_PATH_NOT_ALLOWED
      - UPSTREAM_RATE_LIMITED
      - UPSTREAM_UNREACHABLE
      - CREDENTIAL_EXPIRED
      - PRODUCT_SYNC_COOLDOWN
      - MANUAL_TOO_SOON
    WorkspaceStoreErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/WorkspaceStoreErrorCode"
        error:
          type: string
      additionalProperties: false
    WorkspaceStoreFinanceBalance:
      type: object
      description: |-
        Last Seller Finance → Balance snapshot for this Store.

        `amount` is `total.closing_balance.value` and `currency_code` is that
        object's `currency_code`. This is the balance at the end of `period_to`,
        not an amount available to withdraw — the Seller API does not return one.
        When the amount is RUB and the store contract currency is not, `fx_*`
        carries the Bank of Russia quote used for display (`amount / fx_rate`).
      required:
      - outcome
      - period_to
      - fetched_at_ms
      properties:
        amount:
          type: string
          description: Decimal text of the period-end amount, two fraction digits.
          nullable: true
        currency_code:
          type: string
          description: ISO code from `total.closing_balance.currency_code`.
          nullable: true
        fetched_at_ms:
          type: integer
          format: int64
        fx_as_of:
          type: string
          description: Calendar day of `fx_rate`, `YYYY-MM-DD`.
          nullable: true
        fx_quote:
          type: string
          description: |-
            Contract currency the RUB amount converts toward. Present only when
            the reported currency is RUB, the contract currency is not, and a
            central-bank quote was stamped.
          nullable: true
        fx_rate:
          type: string
          description: Rubles per one unit of `fx_quote`.
          nullable: true
        fx_source:
          type: string
          description: Quote source. Display conversion accepts only `cbr`.
          nullable: true
        outcome:
          "$ref": "#/components/schemas/WorkspaceStoreFinanceBalanceOutcome"
        period_to:
          type: string
          description: "`date_to` of the report, `YYYY-MM-DD` (Moscow calendar, closed day)."
      additionalProperties: false
    WorkspaceStoreFinanceBalanceOutcome:
      type: string
      description: What the last `POST /v1/finance/balance` attempt produced.
      enum:
      - ready
      - forbidden
      - unavailable
      - error
    WorkspaceStoreGroupData:
      type: object
      required:
      - group
      properties:
        group:
          "$ref": "#/components/schemas/WorkspaceStoreTagView"
      additionalProperties: false
    WorkspaceStorePermissions:
      type: object
      description: Effective permissions for the authenticated actor on one Store.
      required:
      - manage_store
      - edit_name
      - manage_key_grants
      - test_key
      - manage_key
      - delete_store
      - manage_tags
      properties:
        delete_store:
          type: boolean
        edit_name:
          type: boolean
        manage_key:
          type: boolean
          description: Register, rotate, or clear the hosted key.
        manage_key_grants:
          type: boolean
          description: Owner, and only when the Store currently has an Assignee.
        manage_store:
          type: boolean
        manage_tags:
          type: boolean
        test_key:
          type: boolean
          description: Visible, live, and Cloud already holds ciphertext. Not a key-write grant.
    WorkspaceStoreProductQuota:
      type: object
      description: |-
        Last successful Seller product-quota snapshot for this Store.

        This is Ozon's cabinet quota, not the Workspace store-seat quota. Absent until
        a hosted-key read succeeds.
      required:
      - fetched_at_ms
      properties:
        daily_create:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreProductQuotaBucket"
        daily_update:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreProductQuotaBucket"
        fetched_at_ms:
          type: integer
          format: int64
        total:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreProductQuotaTotal"
      additionalProperties: false
    WorkspaceStoreProductQuotaBucket:
      type: object
      description: |-
        One Ozon product-upload bucket from `/v4/product/info/limit`.

        `limit == -1` means Ozon does not cap this bucket. Remaining capacity is
        `max(0, limit - usage)` when `limit >= 0`.
      required:
      - limit
      - usage
      properties:
        limit:
          type: integer
          format: int64
        usage:
          type: integer
          format: int64
      additionalProperties: false
    WorkspaceStoreProductQuotaCategory:
      type: object
      description: |-
        Additional upload quota for one in-demand category
        (`total.quota_by_category` in `/v4/product/info/limit`).

        Products in the category consume this quota before the basic `total` bucket.
      required:
      - category_id
      - limit
      - usage
      properties:
        category_id:
          type: integer
          format: int64
          description: Ozon description-category id.
        limit:
          type: integer
          format: int64
        usage:
          type: integer
          format: int64
      additionalProperties: false
    WorkspaceStoreProductQuotaTotal:
      type: object
      description: Basic product-upload limit plus the additional in-demand-category quotas.
      required:
      - limit
      - usage
      properties:
        archived:
          type: integer
          format: int64
          description: |-
            Archived products at snapshot time (`/v3/product/list` ARCHIVED total).
            Each archived product refunds +1 to the limit in the cabinet's
            accounting, so the effective limit is `limit + archived`. Absent when
            the archived count could not be read.
          nullable: true
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreProductQuotaCategory"
          description: Per-category additional quotas. Empty when the cabinet has none.
        limit:
          type: integer
          format: int64
          description: Base limit from `/v4/product/info/limit` (archive refunds excluded).
        usage:
          type: integer
          format: int64
          description: Products counting against the limit, archived included.
      additionalProperties: false
    WorkspaceStoreQuotaChange:
      type: object
      required:
      - uuid
      - create_order
      - action
      properties:
        action:
          "$ref": "#/components/schemas/WorkspaceStoreQuotaChangeAction"
        create_order:
          type: integer
          format: int64
        uuid:
          type: string
      additionalProperties: false
    WorkspaceStoreQuotaChangeAction:
      type: string
      description: |-
        A Store transition caused by Workspace quota reconciliation. The immutable
        `create_order` is included so previews and audit projections can explain
        why a Store was selected without relying on UUID ordering.
      enum:
      - SUSPEND
      - RESTORE
    WorkspaceStoreQuotaChanges:
      type: object
      required:
      - suspend
      - restore
      properties:
        restore:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreQuotaChange"
        suspend:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreQuotaChange"
      additionalProperties: false
    WorkspaceStoreRosterData:
      type: object
      required:
      - stores
      - store_limit
      - stores_used
      - suspended
      properties:
        groups:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreTagView"
        quota_revision:
          type: integer
          format: int64
          description: OCC revision for Workspace quota writers and previews.
          nullable: true
        quota_suspended_stores:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreQuotaChange"
          description: Current quota-suspended Stores, ordered by immutable create order.
        store_limit:
          type: integer
          format: int64
        stores:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreView"
        stores_used:
          type: integer
          format: int64
        suspended:
          type: integer
          format: int64
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreTagView"
        tombstones:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreTombstoneView"
          description: |-
            Deleted Store tombstones, retained so a long-offline desktop can still
            learn about a remote deletion on its next sync. Each desktop deletes
            the matching local Secret and reports consumption idempotently.
      additionalProperties: false
    WorkspaceStoreStatus:
      type: string
      description: |-
        Effective state of a Workspace Store in the Cloud roster. Manual disable and
        quota suspension remain separate wire fields on [`WorkspaceStoreView`]; this is
        the display projection with manual disable taking precedence.
      enum:
      - active
      - manual_disabled
      - quota_suspended
    WorkspaceStoreTagData:
      type: object
      required:
      - tag
      properties:
        tag:
          "$ref": "#/components/schemas/WorkspaceStoreTagView"
      additionalProperties: false
    WorkspaceStoreTagRef:
      type: object
      required:
      - uuid
      - name
      properties:
        name:
          type: string
        uuid:
          type: string
      additionalProperties: false
    WorkspaceStoreTagView:
      type: object
      required:
      - uuid
      - name
      - store_count
      properties:
        name:
          type: string
        store_count:
          type: integer
          format: int64
        uuid:
          type: string
      additionalProperties: false
    WorkspaceStoreTombstoneView:
      type: object
      description: |-
        A deleted Workspace Store tombstone: stable UUID, deletion moment, and the
        monotonic Store revision the deletion produced. Tombstones never carry
        Secret material and are never garbage-collected.
      required:
      - uuid
      - deleted_at_ms
      - revision
      properties:
        deleted_at_ms:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        uuid:
          type: string
      additionalProperties: false
    WorkspaceStoreView:
      type: object
      description: |-
        Non-secret Workspace Store identity and Cloud-controlled state. API credential
        material is deliberately absent; `credential_configured` reports only
        whether Cloud holds ciphertext for the current Store.
      required:
      - uuid
      - create_order
      - name
      - status
      - manual_disabled
      - quota_suspended
      - credential_revision
      - credential_configured
      - credential_verified_operators
      - assignee_key_manage
      - permissions
      - revision
      properties:
        assignee:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreAssignee"
            description: Absent means the Store is unassigned (Owner / Manager only).
        assignee_key_manage:
          type: boolean
          description: |-
            Assignee key-management switch. Always false when unassigned. Opened at
            create when the store is assigned to the creator; otherwise Owner-set.
        client_id:
          type: string
          nullable: true
        create_order:
          type: integer
          format: int64
        credential_configured:
          type: boolean
        credential_key_expires_at_ms:
          type: integer
          format: int64
          description: |-
            The registered API key's `expires_at` from `/v1/roles`, epoch ms.
            `None` when the key predates Ozon's time-limited-key policy or has not
            been verified since expiry tracking landed.
          nullable: true
        credential_last_used_at_ms:
          type: integer
          format: int64
          description: Most recent Seller upstream request made with the current credential.
          nullable: true
        credential_last_verified_at_ms:
          type: integer
          format: int64
          description: Most recent verification attempt for the current generation.
          nullable: true
        credential_revision:
          type: integer
          format: int64
        credential_verified_operators:
          type: integer
          format: int64
          description: Number of operators that verified the current credential generation.
        finance_balance:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreFinanceBalance"
            description: |-
              Last observed Finance → Balance period-end amount. Missing until a
              hosted-key read of `/v1/finance/balance` is recorded for the current
              credential.
        group:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreTagRef"
            description: The one group this Store belongs to. Absent means ungrouped.
        manual_disabled:
          type: boolean
        name:
          type: string
        permissions:
          "$ref": "#/components/schemas/WorkspaceStorePermissions"
        product_quota:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreProductQuota"
            description: |-
              Last observed Ozon product-upload quota. Missing until a hosted-key
              read of `/v4/product/info/limit` succeeds for the current credential.
        quota_suspended:
          type: boolean
        revision:
          type: integer
          format: int64
        status:
          "$ref": "#/components/schemas/WorkspaceStoreStatus"
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceStoreTagRef"
        uuid:
          type: string
      additionalProperties: false
    WorkspaceSummary:
      type: object
      required:
      - id
      - uuid
      - name
      - plan
      - role
      - is_owned
      properties:
        avatar_revision:
          type: integer
          format: int64
          description: Milliseconds when the Workspace avatar was last replaced. Absent when none.
          nullable: true
        id:
          type: integer
          format: int64
        is_owned:
          type: boolean
        member_count:
          type: integer
          format: int64
          description: |-
            Live roster size (`organization_members` rows, any state) — the switcher's
            hover card prints it as "N 名成员". Defaulted so older fixtures stay valid.
        name:
          type: string
        plan:
          type: string
        role:
          type: string
        uuid:
          type: string
          description: |-
            Immutable Cloud Workspace UUID (`organizations.uuid`). Media Object Keys use this,
            never the login User UUID or the numeric Workspace id.
      additionalProperties: false
    WorkspaceSummaryView:
      type: object
      required:
      - id
      - uuid
      - name
      - plan
      - role
      - is_owned
      properties:
        avatar_url:
          type: string
          description: |-
            `GET /api/avatars/workspaces/{id}`, revision-stamped. Absent when the Workspace
            has no avatar.
        id:
          type: integer
          format: int64
        is_owned:
          type: boolean
        member_count:
          type: integer
          format: int64
          description: |-
            Live roster size (`organization_members` rows, any state) — the switcher's
            hover card prints it as "N 名成员". Defaulted so older fixtures stay valid.
        name:
          type: string
        plan:
          type: string
        role:
          type: string
        uuid:
          type: string
          description: Immutable Cloud Workspace UUID — Media Object Key root.
      additionalProperties: false
    WorkspacesData:
      type: object
      required:
      - workspaces
      - account_mode
      - owned_count
      - owned_limit
      properties:
        account_mode:
          "$ref": "#/components/schemas/AccountMode"
        active_workspace:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceSummary"
            description: |-
              Contract: the key is always present — an explicit `null` for a
              workspaceless account, never an absent key.
        owned_count:
          type: integer
          format: int64
          description: Workspaces the caller owns right now.
        owned_limit:
          type: integer
          format: int64
          description: Hard cap on self-created Workspaces.
        workspaces:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceSummary"
      additionalProperties: false
    UpdateWorkspaceStoreRequest:
      type: object
      description: |-
        Partial identity edit. `client_id: null` explicitly clears the Client ID;
        an omitted field leaves it unchanged.
      required:
      - revision
      properties:
        assignee_key_manage:
          type: boolean
          nullable: true
        client_id:
          type: string
          nullable: true
        group_uuid:
          type: string
          description: Group to assign. Omitted leaves the current group. An empty string clears it.
          nullable: true
        name:
          type: string
          nullable: true
        revision:
          type: integer
          format: int64
        tag_uuids:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    DeleteWorkspaceStoreRequest:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          format: int64
      additionalProperties: false
    DeleteWorkspaceStoreData:
      type: object
      required:
      - uuid
      - deleted
      - revision
      properties:
        deleted:
          type: boolean
        quota_changes:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkspaceStoreQuotaChanges"
            description: Store transitions caused by deleting this Store, when any.
        revision:
          type: integer
          format: int64
        uuid:
          type: string
      additionalProperties: false
