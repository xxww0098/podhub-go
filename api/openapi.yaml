        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
      additionalProperties: false
    CompleteListingRowMediaPayload:
      type: object
      description: |-
        What a media executor may write back. Merged at the payload top level, so
        the three keys are the whole contract — an unknown key would silently
        overwrite a payload section, and is refused instead.
      properties:
        failure_log:
          description: "`WorkflowFailureLogEntry[]`."
        media:
          description: "`{ images, videos, videoCover? }`."
        render_evidence:
          description: "`RenderEvidence` plus `sliceCount` / `degradations`."
      additionalProperties: false
    CompleteListingRowMediaRequest:
      type: object
      description: The claimed browser reports a media outcome under its lease and a row CAS.
      required:
      - expected_revision
      - media_state
      - job_id
      properties:
        error_code:
          type: string
          nullable: true
        expected_revision:
          type: integer
          format: int64
          description: |-
            Current row revision for the write CAS; unrelated Draft edits may refresh it.
            The prepared source / template / renderer fingerprint is
            an independent fence. A stale row revision returns `applied: false`.
        job_id:
          type: string
        media_state:
          type: string
          description: Render completion (`rendered`) or stage failure (`failed`); uploads use per-image receipts.
        payload:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CompleteListingRowMediaPayload"
      additionalProperties: false
    ConfirmListingRowImageData:
      type: object
      description: |-
        Per-image upload receipt. Intermediate confirmations stay compact: `row`
        is present only when this receipt settled the Job (or on an idempotent
        replay of an already-succeeded Job), so steady-state upload traffic does
        not pay for a full row projection per slice.
      required:
      - applied
      - index
      - phase
      - completed
      - total
      - media_state
      - view_revision
      properties:
        account_id:
          type: string
          nullable: true
        applied:
          type: boolean
        completed:
          type: integer
          format: int64
        index:
          type: integer
          format: int32
          minimum: 0
        media_state:
          type: string
          description: Row media state after this receipt (`uploading` | `ready`).
        object_key:
          type: string
          nullable: true
        phase:
          type: string
          description: The confirmed image phase (e.g. `public_ready`).
        public_url:
          type: string
          nullable: true
        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
        storage_revision:
          type: integer
          format: int64
          nullable: true
        total:
          type: integer
          format: int64
        view_revision:
          type: integer
          format: int64
          description: The row's view revision after the writeback.
      additionalProperties: false
    ConfirmListingRowImageInput:
      type: object
      required:
      - index
      - object_key
      - account_id
      properties:
        account_id:
          type: string
        index:
          type: integer
          format: int32
          minimum: 0
        object_key:
          type: string
      additionalProperties: false
    ConfirmListingRowImageRequest:
