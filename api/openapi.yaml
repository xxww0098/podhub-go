            "$ref": "#/components/schemas/MediaObjectBatchCompleteItem"
        upload_batch:
          type: string
          nullable: true
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectBatchItemError:
      type: object
      description: |-
        One object's failure inside a batch confirm. The HTTP status of the batch
        stays 200; this status is the status that object would have returned alone.
      required:
      - status
      - code
      - error
      properties:
        code:
          "$ref": "#/components/schemas/IntegrationConfigErrorCode"
        error:
          type: string
        retry_after:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        status:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    MediaObjectBatchPresignData:
      type: object
      required:
      - objects
      properties:
        objects:
          type: array
          items:
            "$ref": "#/components/schemas/MediaObjectPresignData"
      additionalProperties: false
    MediaObjectBatchPresignItem:
      type: object
      description: One object inside a row-level presign. The digest is the object name.
      required:
      - digest
      - extension
      - byte_length
      properties:
        byte_length:
          type: integer
          format: int64
          minimum: 0
        digest:
          type: string
        extension:
          type: string
      additionalProperties: false
    MediaObjectBatchPresignRequest:
      type: object
      description: |-
        Presign every slice of one row in a single round trip. Single-object
        `/presign` stays for retries and clients that upload one file.
      required:
      - workspace_uuid
      - objects
      properties:
        objects:
          type: array
          items:
            "$ref": "#/components/schemas/MediaObjectBatchPresignItem"
        store_checksum:
          type: string
          nullable: true
        upload_batch:
          type: string
          nullable: true
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectCompleteData:
      type: object
      required:
      - transport
      - workspace_uuid
      - account_id
      - object_key
      - public_url
      - storage_revision
      - byte_length
      - deduplicated
      properties:
        account_id:
          type: string
        byte_length:
          type: integer
          format: int64
          minimum: 0
        checksum_trusted:
          type: boolean
          description: |-
            Confirm trusted the store's full-object SHA-256 and did not re-read the
            body to hash it. Omitted when false so older clients still parse.
        deduplicated:
          type: boolean
        object_key:
          type: string
        public_url:
          type: string
        storage_revision:
          type: integer
          format: int64
        transport:
          "$ref": "#/components/schemas/MediaObjectTransport"
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectCompleteRequest:
      type: object
      required:
      - upload_ticket
      - workspace_uuid
      - account_id
      - object_key
      - byte_length
      - storage_revision
      properties:
        account_id:
          type: string
        byte_length:
          type: integer
          format: int64
          minimum: 0
        object_key:
          type: string
        storage_revision:
          type: integer
          format: int64
        upload_batch:
          type: string
          nullable: true
        upload_ticket:
          type: string
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectPresignData:
      type: object
      required:
      - transport
      - workspace_uuid
      - account_id
      - object_key
      - public_url
      - storage_revision
      properties:
        account_id:
          type: string
        object_key:
          type: string
        public_url:
          type: string
        storage_revision:
          type: integer
          format: int64
        transport:
          "$ref": "#/components/schemas/MediaObjectTransport"
        upload:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/DirectUploadGrant"
        upload_batch:
          type: string
          nullable: true
        upload_ticket:
          type: string
          nullable: true
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectPresignRequest:
      type: object
      required:
      - workspace_uuid
      - byte_length
      properties:
        account_id:
          type: string
          nullable: true
        byte_length:
          type: integer
          format: int64
          minimum: 0
        store_checksum:
          type: string
          description: |-
            `sha256` asks the signer to cover `x-amz-checksum-sha256` when the
            account accepts it. Same signal as the `x-podhub-store-checksum` header.
            Absent on older clients, which must not receive a signature they will
            not send.
          nullable: true
        upload_batch:
          type: string
          description: Server-issued four-hour upload directory token. Omitted for legacy clients.
          nullable: true
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectProbeData:
      type: object
      required:
      - account_id
      - object_key
      - public_url
      - exists
      properties:
        account_id:
          type: string
        exists:
          type: boolean
        object_key:
          type: string
        public_url:
          type: string
      additionalProperties: false
    MediaObjectTransport:
      type: string
      description: The browser-side transport chosen by Cloud for one content-addressed image.
      enum:
      - ready
      - direct
    MediaStorageDeleteData:
      type: object
      required:
      - account_id
      - path
      - kind
      - deleted
      - missing
      - failed
      - remaining
      properties:
        account_id:
          type: string
        deleted:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        kind:
          "$ref": "#/components/schemas/MediaStorageObjectKind"
