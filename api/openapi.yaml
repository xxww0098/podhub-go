          content:
            application/json:
              schema:
                type: object
        '500':
          description: Database error
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: rollup
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: Add the organization and member rollup blocks to the ledger. Manager or above only; a member receives 403 with 需要主管权限.
