          type: integer
          format: int64
      additionalProperties: false
    StoreProductMetrics:
      type: object
      description: |-
        One SKU's funnel snapshot (`store_product_metrics`), landed once per
        committed generation by the finalize unit's `/v1/analytics/data` page.
        `null` on the row means Ozon reported nothing for this SKU in the window
        — never render it as zero.
      required:
      - hits_view
      - session_view
      - hits_tocart
      - conv_tocart
      - ordered_units
      - revenue
      - revenue_currency
      - period_days
      - through_day
      - fetched_at_ms
      properties:
        conv_tocart:
          type: number
          format: double
          description: Ozon's own view→cart conversion, percent (Ozon `conv_tocart`).
        fetched_at_ms:
          type: integer
          format: int64
          description: When the page landed.
        fx_as_of:
          type: string
          description: |-
            Calendar day of `fx_rate`, `YYYY-MM-DD`.
            May be earlier than `through_day` when that day was not published.
          nullable: true
        fx_quote:
          type: string
          description: |-
            Contract currency this ruble figure was converted toward.
            Absent when the store is RUB, or when no rate was recorded.
          nullable: true
        fx_rate:
          type: number
          format: double
          description: |-
            Rubles per 1 unit of `fx_quote` (Bank of Russia daily quote).
            The display amount is `revenue / fx_rate`.
          nullable: true
        fx_source:
          type: string
          description: Rate source. `cbr` is the Bank of Russia daily quote.
          nullable: true
        hits_tocart:
          type: number
          format: double
          description: Add-to-cart actions (Ozon `hits_tocart`).
        hits_view:
          type: number
          format: double
          description: Product views in the window (Ozon `hits_view`).
        ordered_units:
          type: number
          format: double
        period_days:
          type: integer
          format: int64
          description: The window's length in days.
        revenue:
          type: number
          format: double
          description: |-
            Ordered revenue from `/v1/analytics/data`, always in rubles.
            Ozon sends no currency field; this is not the store contract currency.
        revenue_currency:
          type: string
          description: ISO code of `revenue`. Always `RUB`.
        session_view:
          type: number
          format: double
          description: Unique visitors (Ozon `session_view`).
        through_day:
          type: string
          description: The window's last day, `YYYY-MM-DD`.
      additionalProperties: false
    StoreProductOverviewRow:
      type: object
      description: One store's mirror position in the products overview.
      required:
      - store_id
      - name
      - status
      - freshness
      properties:
        assignee_name:
          type: string
          description: Who the store is assigned to; absent for Owner/Manager-only views.
          nullable: true
        count_archived:
          type: integer
          format: int64
          nullable: true
        count_delisted:
          type: integer
          format: int64
          nullable: true
        count_hidden:
          type: integer
          format: int64
          nullable: true
        count_moderation_failed:
          type: integer
          format: int64
          nullable: true
        count_on_sale:
          type: integer
          format: int64
          nullable: true
        count_processing:
          type: integer
          format: int64
          nullable: true
        count_total:
          type: integer
          format: int64
          description: |-
            Whole-or-nothing summary from the last completed full sync. All six
            are present together or absent together (`count_*` CHECK).
          nullable: true
        count_zero_stock:
          type: integer
          format: int64
          nullable: true
        currency:
          type: string
          description: |-
            The store's currency code as Seller reports it (C11 store-level fact).
            Price mutations must quote this code; absent until a detail read saw one.
          nullable: true
        freshness:
          "$ref": "#/components/schemas/ProductFreshness"
        hold:
          type: string
          description: |-
            Why the row is not spending calls (`none`, `yield`, `backoff`,
            `budget`, `cooldown`, `credential`, `disabled`).
          nullable: true
        hold_reason:
          type: string
          description: |-
            The hold's stable code (`rate_limited`, `ip_restricted`, …) —
            persisted business data; the UI maps it to copy.
          nullable: true
        hold_until_ms:
          type: integer
          format: int64
          nullable: true
        last_full_sync_at_ms:
          type: integer
          format: int64
          nullable: true
        manual_next_allowed_at_ms:
          type: integer
          format: int64
          description: |-
            When the store's next manual press unlocks (`manual_requested_at_ms`
            + the interval); the button counts down to it.
          nullable: true
        manual_requested_at_ms:
          type: integer
          format: int64
          description: A person pressed 「立即更新」 — the manual interval anchors here.
          nullable: true
        metrics_at_ms:
          type: integer
          format: int64
          description: When the newest funnel page landed; absent means none has.
          nullable: true
        metrics_error:
          type: string
          description: |-
            The funnel axis's own refusal code (`restricted`, `rate_limited`, …) —
            it never touches `hold`/`pass`; a set value means per-row `metrics`
            are absent or stale for a reason the store can name.
          nullable: true
        name:
          type: string
        next_due_at_ms:
          type: integer
          format: int64
          nullable: true
        pass:
          type: string
          description: |-
            Where the current generation stands (`none`, `list_live`,
            `list_archived`, `detail`, `commit`). Absent when the store has never
            been scheduled.
          nullable: true
        status:
          type: string
          description: "`active` / `manual_disabled` / `quota_suspended`."
        store_id:
          type: string
          description: The store's Cloud uuid.
      additionalProperties: false
    StoreProductRow:
      type: object
      description: One mirrored product.
      required:
      - store_id
      - store_name
      - product_id
      - offer_id
      - gone
      properties:
        gone:
          type: boolean
          description: Soft-deleted by a finished full sync; hidden unless `includeGone`.
        image_url:
          type: string
          description: |-
            Thumbnail the browser may load. An allowlisted Ozon CDN URL is rewritten
            to the same-origin thumbnail route; any other `https` URL is the URL
            Ozon reported (`primary_image[0]`, then `images[0]`).
          nullable: true
        metrics:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/StoreProductMetrics"
            description: The last landed funnel page for this SKU; absent means none landed.
        model_count:
          type: integer
          format: int64
          description: |-
            Ozon's own report of how many products the model groups. An
            observation, never proof the mirror holds every member; absent means
            the count is unknown and the column says so instead of writing 0.
          nullable: true
        model_id:
          type: integer
          format: int64
          description: |-
            Ozon's numeric model identity for this row (`model_info.model_id`), as
            the mirror last observed it — the grouping column and the 移入 target
            candidates read it. Absent means the mirror does not know (never 0):
            a row that has never been read, or a Seller payload without
            `model_info`, must not render as "grouped".
          nullable: true
        name:
          type: string
          nullable: true
        offer_id:
          type: string
        old_price:
          type: string
          nullable: true
        price:
          type: string
          description: Numeric as string — exact, never re-rounded by a float.
          nullable: true
        product_id:
          type: integer
          format: int64
        refreshed_at_ms:
          type: integer
          format: int64
          description: |-
            The row's newest single-row read (targeted refresh / verify); the
            store's headline freshness stays on the reconcile commit.
          nullable: true
        sku:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Decimal identifier as text, preserving integers beyond JavaScript's safe range.
          nullable: true
        state:
          type: string
          description: |-
            The dictionary's mutually exclusive bucket: `on_sale`, `processing`,
            `moderation_failed`, `hidden`, `archived`.
          nullable: true
        status_name:
          type: string
          nullable: true
        stock_present:
          type: integer
          format: int32
          nullable: true
        stock_reserved:
          type: integer
          format: int32
          nullable: true
        store_id:
          type: string
        store_name:
          type: string
      additionalProperties: false
    StoreProductStatusFilter:
      type: string
      description: |-
        `status` filter for the products list — the same predicates the finalize
        pass counts with.
      enum:
      - on_sale
      - processing
      - hidden
      - moderation_failed
      - zero_stock
      - archived
      - delisted
    StoreProductsCoverage:
