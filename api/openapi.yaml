        `withdrawal_release`. The agent-facing list only surfaces `commission` and
        `transfer_out`; the withdrawal halves read off the withdrawal rows.
      required:
      - entry_type
      - amount_cents
      - held_delta_cents
      - balance_after_cents
      - note
      - created_at
      properties:
        amount_cents:
          type: integer
          format: int64
          description: The balance delta in 分.
        balance_after_cents:
          type: integer
          format: int64
        created_at:
          type: string
        entry_type:
          type: string
        held_delta_cents:
          type: integer
          format: int64
          description: The held delta in 分.
        note:
          type: string
      additionalProperties: false
    AgentPayoutAccountRequest:
      type: object
      description: |-
        Saving (or clearing) the payout account: either all three fields are set
        and shaped, or all three are `null` and the account clears.
      properties:
        account:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        real_name:
          type: string
          nullable: true
      additionalProperties: false
    AgentPayoutAccountView:
      type: object
      description: |-
        Where a manual withdrawal goes. The Agent saves it once; every withdrawal
        snapshots it so an in-flight request can never be rewritten by an edit.
      required:
      - channel
      - account
      - real_name
      properties:
        account:
          type: string
          description: The account the payout targets (手机号 / 邮箱 / 微信号).
        channel:
          type: string
          description: "`alipay` or `wechat`."
        real_name:
          type: string
          description: The real name the payout account verifies against.
      additionalProperties: false
    AgentTransferData:
      type: object
      required:
      - operation_id
      - amount_cents
      - wallet_balance_microfen
      - workspace_uuid
      - workspace_name
      properties:
        amount_cents:
          type: integer
          format: int64
        operation_id:
          type: string
          description: |-
            The operation id the caller sent, echoed so a retry can be told apart
            from a new transfer.
        wallet_balance_microfen:
          type: integer
          format: int64
          description: The wallet the cents landed in, microfen as the AI API counts it.
        workspace_name:
          type: string
        workspace_uuid:
          type: string
      additionalProperties: false
    AgentWalletView:
      type: object
      description: |-
        The Agent's commission wallet: `balance` everything ever credited minus
        everything moved out, `held` the amount frozen behind a pending
        withdrawal, `available = balance − held` what a new move may take.
      required:
      - balance_cents
      - held_cents
      - available_cents
      properties:
        available_cents:
          type: integer
          format: int64
        balance_cents:
          type: integer
          format: int64
        held_cents:
          type: integer
          format: int64
      additionalProperties: false
    AgentWithdrawalView:
      type: object
      description: |-
        A withdrawal request the Agent filed: `amount_cents` is frozen in
        `wallet.held_cents` until an admin pays or rejects it.
      required:
      - public_id
      - amount_cents
      - channel
      - account
      - real_name
      - status
      - requested_at
      properties:
        account:
          type: string
        amount_cents:
          type: integer
          format: int64
        channel:
          type: string
          description: The payout account snapshot taken at request time.
        decided_at:
          type: string
          nullable: true
        public_id:
          type: string
          description: "`wd_` + 12 chars, shown to the Agent and the admin."
        real_name:
          type: string
        reference:
          type: string
          description: The 打款流水号 an admin recorded when paying; absent otherwise.
          nullable: true
        reject_reason:
          type: string
          description: Why a rejection happened, shown to the Agent; absent otherwise.
          nullable: true
        requested_at:
          type: string
        status:
          type: string
          description: "`pending`, `paid` or `rejected`."
      additionalProperties: false
    AgentWorkbenchData:
      type: object
      description: |-
        An Agent's own workbench: the invite code, the platform rule it earns
        under, the commission wallet it withdraws or transfers from, and its own
        commission rows with the invitee masked.
      required:
      - invite_code
      - status
      - rebate_bps
      - min_order_cents
      - attribution_validity_days
      - min_withdraw_cents
      - wallet
      - wallet_transfer_available
      - invitee_count
      - credited_count
      - skipped_count
      - credited_total_cents
      - commissions
      properties:
        attribution_validity_days:
          type: integer
          format: int64
          description: Days an attribution stays open; 0 means it never expires.
        commissions:
          type: array
          items:
            "$ref": "#/components/schemas/AgentCommissionView"
        credited_count:
          type: integer
          format: int64
        credited_total_cents:
          type: integer
          format: int64
          description: |-
            Lifetime credited commissions in 分 — history, not the spendable
            number; `wallet.balance_cents` is the truth for what is left.
        invite_code:
          type: string
        invitee_count:
          type: integer
          format: int64
        min_order_cents:
          type: integer
          format: int64
          description: The first order must reach this amount to qualify.
        min_withdraw_cents:
          type: integer
          format: int64
          description: The smallest withdrawal the platform pays out.
        payout_account:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/AgentPayoutAccountView"
            description: Where the Agent wants withdrawals paid; absent until they save one.
        rebate_bps:
          type: integer
          format: int64
          description: The platform rate; there is no per-Agent rate to override it.
        skipped_count:
          type: integer
          format: int64
        status:
          type: string
          description: |-
            `active` or `disabled`; a disabled Agent still reads this — the balance
            is theirs to withdraw or transfer even while new commissions stop.
        wallet:
          "$ref": "#/components/schemas/AgentWalletView"
          description: The Agent's commission balance.
        wallet_transfer_available:
          type: boolean
          description: |-
            Whether 「转入钱包」can run: the Agent still owns a live Workspace
            for the wallet ledger row to land on.
      additionalProperties: false
    AiBillingView:
      type: object
      description: |-
        Four token counts and charges with their price snapshot. Prompt/completion totals
        already include cached/reasoning details; do not add those details twice.
      required:
      - request_id
      - model
      - status
      - prompt_tokens
      - cached_prompt_tokens
      - completion_tokens
      - reasoning_completion_tokens
      - uncached_input_microfen
      - cached_input_microfen
      - output_microfen
      - reasoning_microfen
      - total_microfen
      - charged_microfen
      - absorbed_microfen
      - price
      - created_at
