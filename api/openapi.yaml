          format: int64
      additionalProperties: false
    ListingCurrentIssueStatus:
      type: string
      description: What the stored history says about the current input's issue.
      enum:
      - absent
      - present
      - undeterminable
    ListingDispatchEvidence:
      type: string
      enum:
      - not_dispatched
      - rejected
      - unknown
    ListingErrorCode:
      type: string
      enum:
      - auth_required
      - auth_invalid
      - forbidden
      - validation
      - not_found
      - conflict
      - gone
      - schema_sync_required
      - media_confirmation_required
      - queue_busy
      - supplier_not_listable
      - not_replayable
      - store_unusable
      - store_busy
      - store_unavailable
      - submit_capacity_full
      - offer_busy
      - internal
    ListingErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        blockers:
          type: array
          items: {}
          description: |-
            Present on HTTP 422: the `op_workflow` blockers that refused the
            operation. Displayable, fixable conditions — never a system error.
        code:
          "$ref": "#/components/schemas/ListingErrorCode"
        conflict:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRevisionConflict"
            description: |-
              Present on revision CAS conflict (HTTP 409). Boxed: every listing
              handler returns this body in its `Err`, and a conflict is the rare case.
        denial:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/SupplierOzonConfigDenial"
            description: |-
              Present only with `code: supplier_not_listable` (HTTP 409): the
              machine-readable reason the supplier product cannot be listed.
        error:
          type: string
        queue_level:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingQueueLevel"
            description: |-
              Present on HTTP 429 admission refusals: the submitter's lane
              water level at the moment of refusal. Additive and optional — the
              `Retry-After` header stays the machine-readable wait.
      additionalProperties: false
    ListingIntentView:
      type: object
      description: |-
        One Intent as stored, plus the read facts every consumer needs to act on
        it without re-deriving them from `submissionIssues`: that list is the
        displayable history (unbindable elements are omitted), never a way to find
        the current issue by taking its last element.
      required:
      - submission_issues
      - current_issue_status
      - can_resume
      - id
      - store_id
      - listing_row_id
      - row_revision
      - client_operation_id
      - state
      - submission_receipt_status
      - updated_at_ms
      properties:
        can_resume:
          type: boolean
          description: |-
            Domain readiness to resume this Intent for the same input: a
            definite, classified pre-dispatch or rejected outcome on a `rejected`
            Intent. `false` for unknown, undeterminable, unproven or terminal
            outcomes. Not an authorization: the caller's own permissions still
            decide whether it may act.
        cancel_requested_at_ms:
          type: integer
          format: int64
          nullable: true
        client_operation_id:
          type: string
        current_issue:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIssue"
            description: |-
              The current input's issue, only when `currentIssueStatus` is
              `present`. An undeterminable history never shows an older issue here.
        current_issue_status:
          "$ref": "#/components/schemas/ListingCurrentIssueStatus"
          description: Whether the current input's issue could be determined.
        external_task_id:
          type: string
          nullable: true
        has_live_reconcile_claim:
          type: boolean
          description: |-
            GET/list snapshot only: a reconciler claim is live by database time.
            Absent when not enriched or the Intent changed during the read; absence
            is unknown, never `false`. This is not release authorization.
          nullable: true
        has_unfinished_dispatch_job:
          type: boolean
          description: |-
            GET/list snapshot only: an org-scoped `listing.submit.batch` Job in
            queued/running/retry_wait/uncertain names this exact Intent. Absence is
            unknown. Even two explicit `false` values require the release POST's
            atomic recheck; after release, read the exact Intent afresh.
          nullable: true
        id:
          type: string
        import_probe:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportProbeView"
            description: Set only while this Intent is `unknown`. Same facts as the row projection.
        known_error_code:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/IntentErrorCode"
            description: |-
              `lastErrorCode` when it is a value this build declares. Absent for an
              unrecognized value too: absence alone says nothing about dispatch and
              grants no automatic action.
        last_error_code:
          type: string
          description: |-
            The stored value as written — possibly one this build does not
            declare.
          nullable: true
        listing_row_id:
          type: string
        reconciliation_outcome: {}
        row_revision:
          type: integer
          format: int64
        state:
          type: string
        store_id:
          type: string
        submission_issues:
          type: array
          items:
            "$ref": "#/components/schemas/ListingIssue"
        submission_receipt:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingSubmissionReceipt"
            description: Present only when `submissionReceiptStatus` is `valid`.
        submission_receipt_status:
          "$ref": "#/components/schemas/ListingSubmissionReceiptStatus"
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    ListingIntentsPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ListingIntentView"
        next_cursor:
          type: string
          nullable: true
      additionalProperties: false
    ListingIssue:
      type: object
      required:
      - phase
      - scope
      - code
      - summary
      - remediation
      - allowed_actions
      - trace_id
      - endpoint
      - safe_message
      - dispatch_evidence
      - intent_id
      - input_revision
      - request_hash
      - row_id
      - store_id
      - credential_revision
      - retry_after_fallback
      - created_at_ms
      properties:
        allowed_actions:
          type: array
          items:
            "$ref": "#/components/schemas/ListingIssueAction"
        code:
          type: string
          description: |-
            Open string: a `KnownIssueKey` code of `phase` for every issue this
            build mints; another value is kept as written and is unclassified.
        created_at_ms:
          type: integer
          format: int64
        credential_revision:
          type: integer
          format: int64
        dispatch_evidence:
          "$ref": "#/components/schemas/ListingDispatchEvidence"
        endpoint:
          type: string
        http_status:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        input_revision:
          type: integer
          format: int64
        intent_id:
          type: string
        phase:
          type: string
          description: |-
            Open string: `pre_dispatch` or `submit` for every issue this build
            mints (the stage of its `KnownIssueKey`); another value is kept as
            written and is unclassified.
        provider_code:
          type: integer
          format: int64
          nullable: true
        remediation:
          type: string
        request_hash:
          type: string
        resolved_at_ms:
          type: integer
          format: int64
          nullable: true
        retry_after_fallback:
          type: boolean
        retry_after_ms:
          type: integer
          format: int64
          nullable: true
        row_id:
          type: string
        safe_message:
          type: string
          description: Credential-redacted at the dispatch boundary, at most 512 characters.
        scope:
          "$ref": "#/components/schemas/ListingIssueScope"
        store_id:
          type: string
        summary:
          type: string
        trace_id:
          type: string
          description: Stable worker job identity, also recorded in the listing_job trace span.
    ListingIssueAction:
      type: string
      enum:
      - edit_row
      - check_store
      - resume
      - wait
      - reconcile
      - recover
    ListingIssueScope:
      type: string
      enum:
      - row
      - store
    ListingPrepareStageIssue:
      type: object
      required:
      - kind
      - blockers
      properties:
        blockers:
          type: array
          items: {}
        kind:
          type: string
        message:
          type: string
          description: 'Queue admission only: safe to replan this stage after capacity frees.'
          nullable: true
      additionalProperties: false
    ListingQueueLevel:
      type: object
      description: |-
        One submitter's queue water level for a lane. `queued_cost` and
        `running_cost` share the cost-unit currency of the lane cap
        (`queuedCostLimit`), not row counts.
      required:
      - lane
      - queued_cost
      - queued_cost_limit
      - running_cost
      properties:
        lane:
          type: string
        queued_cost:
          type: integer
          format: int64
        queued_cost_limit:
          type: integer
          format: int64
        running_cost:
          type: integer
          format: int64
    ListingRevisionConflict:
      type: object
      required:
      - server_revision
      - server_payload
      - client_base_revision
      - client_changes
      properties:
        client_base_revision:
          type: integer
          format: int64
        client_changes: {}
        last_editor_id:
          type: integer
          format: int64
          nullable: true
        server_payload: {}
        server_revision:
          type: integer
          format: int64
      additionalProperties: false
    ListingRowBuildView:
      type: object
      required:
      - state
      - sources
      properties:
        sources:
          type: array
          items:
            "$ref": "#/components/schemas/ListingBuildSourceView"
        state:
          "$ref": "#/components/schemas/ListingBuildState"
      additionalProperties: false
    ListingRowEventData:
      type: object
      required:
      - workspace_id
      - card_id
      - seq
      - row_id
      properties:
        card_id:
          type: string
        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
        row_id:
          type: string
        seq:
          type: string
        workspace_id:
          type: string
      additionalProperties: false
    ListingRowProjection:
      type: object
      description: Read-only semantics shared by every row response. The browser only formats them.
      required:
      - submission_receipt_status
      - current_issue_status
      - can_resume
      - stage
      - ai
      - media
      - fields
      - readiness
      - image_total
      - image_completed
      properties:
        ai:
          "$ref": "#/components/schemas/WorkflowAiPhase"
        can_resume:
          type: boolean
          description: |-
            Domain readiness to resume the latest Intent for the current input,
            by the same rule as the Intent view's `canResume`. Not an
            authorization.
        current_issue_status:
          "$ref": "#/components/schemas/ListingCurrentIssueStatus"
          description: |-
            Whether the current input's issue (`submissionIssue`) could be
            determined; `undeterminable` also closes `publish`.
        error_code:
          type: string
          nullable: true
        error_detail:
          type: string
          nullable: true
        fields:
          "$ref": "#/components/schemas/WorkflowFieldPhase"
        image_completed:
          type: integer
          format: int32
          minimum: 0
        image_total:
          type: integer
          format: int32
          minimum: 0
        import_followup:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportFollowupView"
            description: Set when an accepted import has a newer read than 「已受理」.
        import_probe:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportProbeView"
            description: Set only while this row's current input is an unknown import.
        media:
          "$ref": "#/components/schemas/WorkflowMediaPhase"
        media_failure_stage:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkflowMediaStage"
        product_id:
          type: integer
          format: int64
          nullable: true
        readiness:
          "$ref": "#/components/schemas/WorkflowReadinessReport"
        run_id:
          type: string
          nullable: true
        sku:
          type: integer
          format: int64
          nullable: true
        stage:
          "$ref": "#/components/schemas/RowStageView"
        submission_issue:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIssue"
        submission_receipt:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingSubmissionReceipt"
            description: Present only when `submissionReceiptStatus` is `valid`.
        submission_receipt_status:
          "$ref": "#/components/schemas/ListingSubmissionReceiptStatus"
          description: |-
            `absent` here only means no displayable receipt: the row read model
            cannot tell a stored JSON `null` from none. Never a dispatch fact.
        task_id:
          type: string
          nullable: true
      additionalProperties: false
    ListingRowView:
      type: object
      required:
      - id
      - card_id
      - revision
      - view_revision
      - projection
      - content_state
      - media_state
      - validation_state
      - submission_state
      - draft
      - validation_issues
      - media
      - ai
      - source
      - payload
      - updated_at_ms
      - build
      properties:
        ai:
          description: "`{ candidates, summary?, promptSha256, modelVersion }`."
        build:
          "$ref": "#/components/schemas/ListingRowBuildView"
          description: |-
            Effective build evidence. `built` only when the stored stamp still
            matches the card's current defaults digest.
        card_id:
          type: string
        content_state:
          type: string
        draft:
          description: |-
            `WorkflowCategoryDraft` (`{ values, complex_values }`): the
            operator-visible field values.
        id:
          type: string
        media:
          description: "`{ images, videos, videoCover? }` lifecycle media."
        media_state:
          type: string
        ocr_recovery:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/OcrRecoveryView"
            description: Present only on `GET …/rows/{id}?include=ocrRecovery&jobId=`.
        payload:
          description: |-
            The row payload without the server-only `schemaSnapshot`.
            Includes `schemaRevision`, `normalizedSnapshot`, `handEditedKeys`,
            and the sections projected above.
        projection:
          "$ref": "#/components/schemas/ListingRowProjection"
        render_evidence:
          description: Committed render evidence, when an executor wrote one back.
        revision:
          type: integer
          format: int64
        source:
          description: "`{ assetId, sha256, fileName }` of the PSD / photo the row came from."
        store_id:
          type: string
          nullable: true
        submission_state:
          type: string
        updated_at_ms:
          type: integer
          format: int64
        validation_issues:
          description: "`FieldIssue[]` from the last validate: why the row is `blocked`."
        validation_state:
          type: string
        view_revision:
          type: integer
          format: int64
          description: Monotonic response version. Draft CAS continues to use `revision`.
      additionalProperties: false
    ListingRunView:
      type: object
      required:
      - id
      - kind
      - aggregate_type
      - aggregate_id
      - input_revision
      - state
      - attempt
      - idempotency_key
      - payload
      - updated_at_ms
      properties:
        aggregate_id:
          type: string
        aggregate_type:
          type: string
        attempt:
          type: integer
          format: int32
        id:
          type: string
        idempotency_key:
          type: string
          description: |-
            The key that made this job unique at enqueue. An executor replays under
            it, so the same work is bought once.
        input_revision:
          type: integer
          format: int64
        kind:
          type: string
        last_error_code:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: What the job was pinned to, in snake_case. executor is common to every kind; render jobs pin psd_template_sha256, upload jobs pin manifest_digest, manifest, and recognition_prompt. The browser executor acts on this without a second read of the row.
        state:
          type: string
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    ListingSubmissionReceipt:
      type: object
      description: |-
        A stored transport receipt as a response shows it. Tolerates keys a newer
        writer adds; a missing required field or a wrong type makes the stored
        receipt `unreadable` rather than silently absent (see
        `ListingSubmissionReceiptStatus`).
      required:
      - batch_id
      - item_count
      properties:
        batch_id:
          type: string
        http_status:
          type: integer
          format: int32
          nullable: true
        item_count:
          type: integer
          format: int32
        received_at_ms:
          type: integer
          format: int64
          nullable: true
        response_body:
          type: string
          nullable: true
        task_id:
          type: integer
          format: int64
          nullable: true
        transport_error:
          type: string
          nullable: true
    ListingSubmissionReceiptStatus:
      type: string
      description: Whether the stored transport receipt could be shown.
      enum:
      - absent
      - valid
      - unreadable
    MediaLibraryErrorCode:
      type: string
      enum:
      - auth_required
      - auth_invalid
      - forbidden
      - validation
      - not_found
      - conflict
      - checksum_mismatch
      - expired
      - internal
    MediaLibraryErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/MediaLibraryErrorCode"
        error:
          type: string
      additionalProperties: false
    MediaObjectBatchCompleteData:
      type: object
      required:
      - objects
      properties:
        objects:
          type: array
          items:
            "$ref": "#/components/schemas/MediaObjectBatchCompleteOutcome"
      additionalProperties: false
    MediaObjectBatchCompleteItem:
      type: object
      required:
      - digest
      - extension
      - upload_ticket
      - account_id
      - object_key
      - byte_length
      - storage_revision
      properties:
        account_id:
          type: string
        byte_length:
          type: integer
          format: int64
          minimum: 0
        digest:
          type: string
        extension:
          type: string
        object_key:
          type: string
        storage_revision:
          type: integer
          format: int64
        upload_ticket:
          type: string
      additionalProperties: false
    MediaObjectBatchCompleteOutcome:
      type: object
