          format: int64
          nullable: true
        count_hidden:
          type: integer
          format: int64
          nullable: true
        count_moderation_failed:
          type: integer
          format: int64
          nullable: true
        count_on_sale:
          type: integer
          format: int64
          nullable: true
        count_processing:
          type: integer
          format: int64
          nullable: true
        count_total:
          type: integer
          format: int64
