openapi: 3.0.3
info:
  title: PodHub Cloud API
  version: 0.1.0
  description: |
    The PodHub Cloud HTTP contract. JSON field names are snake_case, responses
    return their payload directly without a data envelope, and list responses
    use {items, total}. Sessions authenticate via cookies; /mcp carries MCP
    JSON-RPC over POST and answers 405 with Allow: POST on every other method.
    Query strings are parsed in Go, not by the generated wrapper: oapi-codegen
    would answer a missing required query with an English 400, which is not
    the wire body. Field order of each JSON body is pinned by the hand-written
    structs, not by the generated models.
paths:
  "/mcp":
    get:
      operationId: mcpGet
      tags:
      - mcp
      summary: MCP endpoint. Only POST carries a request; other methods answer 405 with Allow POST.
      responses:
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '405':
          description: Method not allowed. Allow is POST.
          content:
            application/json:
              schema:
                type: object
      description: 'GET never carries a JSON-RPC request: the router answers 405 with Allow: POST. The method is declared so the contract states the 405 explicitly.'
    post:
      operationId: mcpPost
      tags:
      - mcp
      summary: MCP JSON-RPC over one POST. A grant token or a user session authenticates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC result or error envelope
          content:
            application/json:
              schema:
                type: object
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Origin refused by the DNS-rebinding check
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: mcpDelete
      tags:
      - mcp
      summary: MCP endpoint. Only POST carries a request; DELETE answers 405 with Allow POST.
      responses:
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '405':
          description: Method not allowed. Allow is POST.
          content:
            application/json:
              schema:
                type: object
      description: 'DELETE never carries a JSON-RPC request: the router answers 405 with Allow: POST. The method is declared so the contract states the 405 explicitly.'
  "/api/health":
    get:
      operationId: getHealth
      tags:
      - health
      summary: Cloud liveness plus a PostgreSQL ping
      responses:
        '200':
          description: Cloud and PostgreSQL are available
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
        '503':
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/api/listing/rules":
    get:
      operationId: getListingRules
      tags:
      - listing-rules
      summary: Enabled listing rules, including banned tags, with a version token
      parameters:
      - in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Current enabled rules
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingRulesResponse"
        '304':
          description: If-None-Match is the current rules version
        '503':
          description: The rule table could not be read. This is not an empty allow-list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingError"
  "/api/listing/validate":
    post:
      operationId: postListingValidate
      tags:
      - listing-rules
      summary: Side-effect-free listing tag check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListingTagCheckRequest"
      responses:
        '200':
          description: Verdict only. No row was written.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingValidateResponse"
        '400':
          description: The body is not a tag check
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingError"
        '409':
          description: rulesVersion is not the version currently served
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingError"
        '503':
          description: Rules or the matcher could not be evaluated. This is not a pass.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListingError"
  "/api/listing/submit":
    post:
      operationId: postListingSubmit
      tags:
      - listing
      summary: 'Freeze stored rows or drafts and enqueue listing.submit.batch. The body shape selects the path: row_ids is a stored-row batch send, store_id or items is a Draft send, anything else is a tag check. A stored-row send requires the exact server revisions captured by the click. A tag check needs no principal; a batch or Draft send requires the submit role. It does not dial Ozon.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListingSubmitRequest"
      responses:
        '200':
          description: Batch or Draft send frozen and enqueued; per-row items
          content:
            application/json:
              schema:
                type: object
        '400':
          description: The body is not a tag check, a banned tag refused the gate, the Draft envelope is invalid, or the stored-row IDs and revision pins are not a one-to-one match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '403':
          description: Role cannot submit
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '404':
          description: The card or row no longer exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '409':
          description: Rules or schema must be refreshed, the store send slot is held, or a stored row changed during freeze (code revision_mismatch). A revision_mismatch rolls back this entire request; none of its new intents or jobs are committed. A revision already stale when read is instead returned as an individual skipped item in the 200 response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
        '503':
          description: Rules or the matcher could not be evaluated. This is not a pass.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubmitListingError"
