components:
  parameters:
    CatalogLanguage:
      in: query
      name: language
      required: true
      schema:
        type: string
        enum:
        - default
        - ru
        - en
        - tr
        - zh_hans
    CatalogStoreID:
      in: query
      name: store_id
      required: false
      description: Store uuid visible to the caller; enables a live fill on a cache miss
      schema:
        type: string
    AIIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    AILogType:
      in: query
      name: type
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 7
    AILogStart:
      in: query
      name: start_timestamp
      required: false
      schema:
        type: integer
        format: int64
    AILogEnd:
      in: query
      name: end_timestamp
      required: false
      schema:
        type: integer
        format: int64
    AILogModel:
      in: query
      name: model_name
      required: false
      schema:
        type: string
    AILogToken:
      in: query
      name: token_name
      required: false
      schema:
        type: string
    AILogGroup:
      in: query
      name: group
      required: false
      schema:
        type: string
    AILogRequestID:
      in: query
      name: request_id
      required: false
      schema:
        type: string
    AILogUpstreamID:
      in: query
      name: upstream_request_id
      required: false
      schema:
        type: string
    AILogUsername:
      in: query
      name: username
      required: false
      description: Applied only for workspace managers
      schema:
        type: string
    AILogChannel:
      in: query
      name: channel
      required: false
      description: Applied only for workspace managers
      schema:
        type: integer
  responses:
    AIError:
      description: AI error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AIError"
    AIRetryError:
      description: AI error; Retry-After is set when the same key is in flight or the relay is busy
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AIError"
    BillingError:
      description: Billing error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/BillingError"
    BillingProviderClosed:
      description: The provider has no verification key configured; code PAYMENT_NOT_AVAILABLE
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/BillingError"
    BillingPlainError:
      description: Plain-text refusal written by http.Error
      content:
        text/plain:
          schema:
            type: string
    CatalogError:
      description: Catalog error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CatalogError"
    CatalogBusy:
      description: Another request is filling the same cache entry
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CatalogError"
    StoreError:
      description: Store error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/StoreError"
    WorkspaceStoreError:
      description: Workspace Store error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/WorkspaceStoreErrorResponse"
    RatingError:
      description: Rating error; Cache-Control is no-store
      headers:
        Cache-Control:
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/RatingError"
  schemas:
    StoreListingPolicy:
      type: object
      required:
      - store_id
      - daily_cap
      - min_gap_seconds
      - timezone
      - submitted_today
      - last_dispatched_at
      - next_allowed_at
      - wait_reason
      - can_manage
      properties:
        store_id:
          type: string
          format: uuid
        daily_cap:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000000
        min_gap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        timezone:
          type: string
          enum:
          - Asia/Shanghai
        submitted_today:
          type: integer
          minimum: 0
        last_dispatched_at:
          type: string
          format: date-time
          nullable: true
        next_allowed_at:
          type: string
          format: date-time
          nullable: true
        wait_reason:
          type: string
          enum:
          - STORE_DAILY_CAP_REACHED
          - STORE_MIN_SEND_GAP
          nullable: true
        can_manage:
          type: boolean
    TaskRecordsPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TaskRecord'}
        next_cursor: {type: string, nullable: true}
    TaskRecord:
      type: object
      required: [id, kind, store_id, store_name, title, card_id, row_id, state, error_code, external_task_id, attempt, next_attempt_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [listing, product_sync, media]}
        store_id: {type: string, format: uuid, nullable: true}
        store_name: {type: string}
        title: {type: string}
        card_id: {type: string, format: uuid, nullable: true}
        row_id: {type: string, format: uuid, nullable: true}
        state: {type: string}
        error_code: {type: string}
        external_task_id: {type: string, nullable: true}
        attempt: {type: integer, minimum: 0, nullable: true}
        next_attempt_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CloudflareConnection:
      type: object
      required: [available, connected, expires_at]
      properties:
        available: {type: boolean}
        connected: {type: boolean}
        expires_at: {type: integer, format: int64, description: Unix timestamp in seconds; zero when not connected}
    WorkspaceSliceStorage:
      type: object
      required: [configured, can_manage]
      properties:
        configured: {type: boolean}
        can_manage: {type: boolean}
        delete_enabled: {type: boolean, description: Current owner and server-side deletion switch both allow deletion.}
        key_prefix: {type: string, description: Stable storage namespace used to bind folder deletion to the selected workspace configuration.}
        bucket: {type: string}
        public_base_url: {type: string}
        oauth_available: {type: boolean}
        cloudflare_connected: {type: boolean}
        clear_status: {type: string, enum: [idle, pending, retrying, completed]}
        daily_clear_status: {type: string, enum: [waiting, unconfirmed, running, retrying, completed]}
        cleanup_mode: {type: string, enum: [daily, manual]}
        cleanup_time: {type: string, nullable: true, description: Daily cleanup time in Asia/Shanghai; null in manual mode.}
        provision:
          type: object
          nullable: true
          required: [id, account_id, bucket, phase, error_code]
          properties:
            id: {type: string}
            account_id: {type: string}
            bucket: {type: string}
            phase: {type: string, enum: [creating, bucket_ready, token_creating, verifying, ready, blocked]}
            error_code: {type: string}
    WorkspaceSliceObjects:
      type: object
      required: [objects, folders, next_cursor]
      properties:
