      - label
      - value
      properties:
        attribute_id:
          type: integer
          format: int64
        dictionary_value_id:
          type: integer
          format: int64
          nullable: true
        label:
          type: string
          description: The dimension's display name, from the category material.
        value:
          type: string
      additionalProperties: false
