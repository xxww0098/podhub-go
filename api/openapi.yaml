      additionalProperties: false
    CatalogSchemaData:
      type: object
      description: |-
        The cached material for one `(category, type, language)` coordinate. No
        `schema_revision`: it is recomputed from the fields.
      required:
      - description_category_id
      - type_id
      - language
      - fetched_at_ms
      - fields
      properties:
        description_category_id:
          type: integer
          format: int64
        fetched_at_ms:
          type: integer
          format: int64
        fields:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSchemaField"
