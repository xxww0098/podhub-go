        page:
          type: integer
          format: int64
        page_size:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
      additionalProperties: false
    AdminAgentCommissionView:
      type: object
      description: |-
        One row of the commission ledger as the SuperAdmin reads it — emails
        unmasked, because the console is the audit surface.
      required:
      - id
      - agent_email
      - invitee_email
      - workspace_name
      - payment_order_public_id
      - product
      - order_amount_cents
      - rebate_bps
      - amount_cents
      - status
      - note
      - created_at
      properties:
        agent_email:
          type: string
        amount_cents:
          type: integer
          format: int64
          description: 0 on a `skipped` row.
        created_at:
          type: string
        id:
          type: integer
          format: int64
        invitee_email:
          type: string
        note:
          type: string
        order_amount_cents:
          type: integer
          format: int64
        payment_order_public_id:
          type: string
        product:
          type: string
        rebate_bps:
          type: integer
          format: int64
          description: The rate in force when this row was written.
        status:
          type: string
          description: "`credited` or `skipped`."
        workspace_name:
          type: string
          description: The paying Workspace's name, when it still exists.
      additionalProperties: false
    AdminAgentCreateRequest:
      type: object
      description: |-
        `POST /api/admin/agents`: enable a User as an Agent. The only required
        fact is the email; a custom invite code is optional and the generated one
        is the normal case.
      required:
      - email
      properties:
        email:
          type: string
        invite_code:
          type: string
          description: "`[A-Z0-9]{8,32}`; absent means a generated code."
          nullable: true
      additionalProperties: false
    AdminAgentListData:
      type: object
