openapi: 3.0.3
info:
  title: PodHub Cloud API
  version: 0.1.0
  description: |
    The PodHub Cloud HTTP contract. Field names, response envelopes and pagination
    follow each operation's explicit schema. Sessions authenticate via cookies; /mcp carries MCP
    JSON-RPC over POST and answers 405 with Allow: POST on every other method.
    Query strings are parsed in Go, not by the generated wrapper: oapi-codegen
    would answer a missing required query with an English 400, which is not
    the wire body. Field order of each JSON body is pinned by the hand-written
    structs, not by the generated models.
paths:
  /api/listing/store-policies/{store_id}:
    parameters:
    - name: store_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listing_store_policy_get
      summary: Read a visible store's dispatch policy and Shanghai daily usage
      tags:
      - listing-read
      responses:
        '200':
          description: Current policy and actual dispatch usage; unknown dispatches remain counted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListingPolicy'
        '400':
          description: Invalid store id
        '401':
          description: Authentication required
        '403':
          description: Workspace membership unavailable
        '404':
          description: Store missing or outside the caller's visibility
        '500':
          description: Read failed
    put:
      operationId: listing_store_policy_put
      summary: Replace a store dispatch policy as a workspace manager
      tags:
      - listing-read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                daily_cap:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 1000000
                min_gap_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
      responses:
        '200':
          description: Saved policy and current usage; waiting jobs are eligible for a fresh check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListingPolicy'
        '400':
          description: Invalid policy or request body
        '401':
          description: Authentication required
        '403':
          description: Manager authority required or cross-site request rejected
        '404':
          description: Store missing or outside the caller's visibility
        '500':
          description: Save failed
  /api/workspaces/products/export:
    get:
      tags:
      - stores
      operationId: exportWorkspaceProducts
      description: 导出当前筛选的全部可见商品镜像，最多5万行且最多64MiB；超限返回413，不返回部分CSV。
      parameters:
      - name: storeId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: includeGone
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: UTF-8 BOM CSV
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                properties:
                  error:
                    type: string
                  code:
                    type: string
  /api/listing/task-records:
    get:
      tags: [listing-read]
      operationId: listingTaskRecords
      description: Existing submission receipts, media jobs and product sync jobs visible to the current workspace member. This read never sends or retries work.
      parameters:
        - {name: storeId, in: query, schema: {type: string, format: uuid}}
        - {name: kind, in: query, schema: {type: string, enum: [listing, product_sync, media]}}
        - {name: status, in: query, schema: {type: string, enum: [active, attention, finished, cancelled]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: A page ordered by creation time and ID, newest first. Platform acceptance is not an on-sale result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TaskRecordsPage'}
        '400': {description: Invalid filters or cursor}
        '401': {description: Authentication required}
        '403': {description: Workspace membership is unavailable}
        '404': {description: Store does not exist or is not assigned to this member}
        '503': {description: Task records are temporarily unavailable}
  /api/workspace/slice-storage:
    get:
      tags: [workspace-slice-storage]
      operationId: getWorkspaceSliceStorage
      responses:
        '200':
          description: Current workspace bucket and owner-only management capability; never returns credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSliceStorage'}
    post:
      tags: [workspace-slice-storage]
      operationId: provisionWorkspaceSliceStorage
      description: Owner only. Omit bucket to generate podhub- followed by a random UUID without hyphens, or supply a valid R2 name before creation. The reserved name cannot change during retries or after activation. Custom names are never adopted from an existing bucket; ambiguous creation requires review. Creates through OAuth, configures CORS and public access, obtains a bucket-scoped credential, then verifies actual upload/read/list/delete before activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, public_access]
              properties:
                account_id: {type: string, pattern: '^[a-f0-9]{32}$'}
                public_access: {type: boolean, enum: [true]}
                bucket:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
                  description: Optional custom name; lowercase ASCII letters, digits and hyphens only, with alphanumeric endpoints. Omit to generate a default name.
      responses:
        '200':
          description: Verified workspace storage; creation is idempotent per workspace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSliceStorage'}
        '400': {description: Invalid bucket name, invalid selection, or public access consent missing}
        '403': {description: Only the current workspace owner can provision storage}
        '409': {description: Bucket name already used or locked, creation in progress, original Cloudflare account required, or a prior unknown creation or credential outcome needs review}
        '502': {description: External operation or verification failed; no successful activation is claimed}
        '503': {description: OAuth or storage services are not configured}
  /api/workspace/slice-storage/cleanup:
    patch:
      tags: [workspace-slice-storage]
      operationId: updateWorkspaceSliceCleanup
      description: Owner only. Daily schedules use Asia/Shanghai and begin at the next selected time. Manual mode stops starting automatic clears; a running clear must finish before changing the policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cleanup_mode]
              properties:
                cleanup_mode: {type: string, enum: [daily, manual]}
                cleanup_time: {type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Required for daily; null or omitted for manual.}
      responses:
        '200':
          description: Saved cleanup policy and current bucket status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSliceStorage'}
        '400': {description: Invalid cleanup mode or time}
        '403': {description: Workspace owner required}
        '409': {description: Automatic cleanup is still running}
        '422': {description: Workspace bucket is not configured}
  /api/workspace/slice-storage/clear:
    post:
      tags: [workspace-slice-storage]
      operationId: clearWorkspaceSliceStorage
      responses:
        '202':
          description: Owner requested clear; existing upload grants are allowed to expire before deletion.
          content:
            application/json:
              schema:
                type: object
                required: [clear_status]
                properties:
                  clear_status: {type: string, enum: [pending]}
        '403': {description: Workspace owner required}
  /api/workspace/slice-storage/objects:
    get:
      tags: [workspace-slice-storage]
      operationId: listWorkspaceSliceObjects
      parameters:
        - {name: prefix, in: query, schema: {type: string, maxLength: 512}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
      responses:
        '200':
          description: One S3 page inside the workspace slice namespace. Folders are relative to the namespace root; object keys remain exact for downloads and deletion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSliceObjects'}
        '409': {description: Workspace storage is not ready}
        '502': {description: Listing could not be read}
  /api/workspace/slice-storage/stats:
    get:
      tags: [workspace-slice-storage]
      operationId: workspaceSliceStats
      responses:
        '200':
          description: On-demand sum of actual S3 listings, at most 100000 objects. Incomplete totals are lower bounds, not a complete bucket count or billing quota.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSliceStats'}
        '502': {description: Statistics could not be read}
  /api/workspace/slice-storage/download:
    get:
      tags: [workspace-slice-storage]
      operationId: downloadWorkspaceSliceObject
      parameters:
        - {name: key, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Five-minute GET URL for an object in this workspace's namespace
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
        '400': {description: Key is not a canonical slice key in this workspace}
  /api/workspace/slice-storage/objects/delete:
    post:
      tags: [workspace-slice-storage]
      operationId: deleteWorkspaceSliceObjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [keys]
                  properties:
                    keys: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
                - type: object
                  additionalProperties: false
                  required: [prefix]
                  properties:
                    prefix: {type: string, minLength: 1, maxLength: 1024, description: Full key prefix of a non-root folder inside the current storage uploads namespace, ending with a slash. Includes the storage UUID to prevent deletion after workspace switching.}
      responses:
        '200':
          description: Deletes up to 100 exact objects or one batch of a recursive folder delete. Failed keys remain explicit. For folders, repeat the same prefix while has_more is true; stop on failures. An empty folder is an idempotent success.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, failed_keys, has_more]
                properties:
                  deleted: {type: integer}
                  failed_keys: {type: array, nullable: true, items: {type: string}}
                  has_more: {type: boolean, description: Folder still contains objects after this batch; no snapshot guarantee for concurrent uploads.}
        '400': {description: Invalid keys, root or foreign folder, or both keys and prefix supplied}
        '403': {description: Workspace owner required}
        '409': {description: A selected object or a pending upload in the folder may still have an unexpired upload grant; wait 16 minutes}
        '502': {description: Deletion not confirmed; refresh the list before retrying}
  /api/workspace/slice-storage/cloudflare:
    get:
      tags: [workspace-slice-storage]
      operationId: getCloudflareConnection
      responses:
        '200':
          description: Current login session's short-lived Cloudflare setup connection. Does not verify R2 usability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudflareConnection'}
        '401': {description: Login required}
        '403': {description: Workspace membership required}
    delete:
      tags: [workspace-slice-storage]
      operationId: disconnectCloudflare
      responses:
        '204': {description: Active access token revoked and setup cookies cleared; missing or expired setup connections are already disconnected. Buckets are retained.}
        '502': {description: Revocation could not be confirmed}
        '503': {description: OAuth is not configured}
  /api/workspace/slice-storage/cloudflare/authorize:
    post:
      tags: [workspace-slice-storage]
      operationId: authorizeCloudflare
      description: Creates a login-session-bound OAuth state cookie and an S256 PKCE authorization URL. The caller navigates to the returned URL.
      responses:
        '200':
          description: Authorization URL. Client secret and PKCE verifier are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: {type: string, format: uri}
        '401': {description: Login required}
        '403': {description: Workspace membership required or cross-origin write rejected}
        '503': {description: OAuth is not configured}
  /api/workspace/slice-storage/cloudflare/callback:
    get:
      tags: [workspace-slice-storage]
      operationId: callbackCloudflare
      description: Owner only. Exchanges a single-use authorization code with PKCE. Stores the access token in an encrypted HttpOnly cookie for at most 15 minutes, bound to the current workspace and PodHub login session. No refresh token is retained.
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '303':
          description: Redirects to workspace storage settings after success or an authorization error. A fixed error code in the URL fragment identifies denial, invalid state, or exchange failure. A successful connection does not create a bucket or enable slice storage.
          headers:
            Location:
              schema: {type: string, format: uri}
        '401': {description: Original login session required}
        '503': {description: OAuth is not configured}
  /api/workspace/slice-storage/cloudflare/accounts:
    get:
      tags: [workspace-slice-storage]
      operationId: listCloudflareAccounts
      responses:
        '200':
          description: Accounts visible to the current user's Cloudflare grant
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: string, pattern: '^[a-f0-9]{32}$'}
                        name: {type: string}
        '403': {description: Cloudflare grant lacks account read permission}
        '409': {description: Setup connection is missing or expired}
        '502': {description: Account list could not be read completely}
        '503': {description: OAuth is not configured}
