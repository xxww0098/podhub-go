    StoreProductMetrics:
      type: object
      description: |-
        One SKU's funnel snapshot (`store_product_metrics`), landed once per
        committed generation by the finalize unit's `/v1/analytics/data` page.
        `null` on the row means Ozon reported nothing for this SKU in the window
