      properties:
        account_mode:
          "$ref": "#/components/schemas/AccountMode"
          description: |-
            Absent only for an anonymous session. `unaffiliated` is a normal
            signed-in state: the shell offers create-Workspace or wait-for-invite.
        accounts:
          type: array
          items:
            "$ref": "#/components/schemas/StackedAccountView"
          description: |-
            Every account signed in on this browser's session stack (`sids`
