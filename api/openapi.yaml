      - rows
      properties:
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page.
          nullable: true
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/StoreProductRow"
      additionalProperties: false
    StoreProductsOverviewData:
      type: object
      required:
      - stores
