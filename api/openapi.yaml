          type: boolean
          description: |-
            Present only when this process was started with client listing-log
            collection on. Omitted means the browser must not buffer or upload.
        entitlement:
          "$ref": "#/components/schemas/EntitlementView"
          description: |-
            Absent when the plan read failed; the shell keeps its last badge
            rather than showing the account as unentitled.
        is_agent:
          type: boolean
          description: |-
            Whether this User is an Agent (any status). The shell paints the Agent
            destination from this one fact; `GET /api/agent` still owns the
            active/disabled answer. Defaulted so older fixtures stay valid.
        owned_count:
          type: integer
          format: int64
        owned_limit:
          type: integer
          format: int64
        session:
          "$ref": "#/components/schemas/AccountSessionView"
        unusable_workspaces:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceSummaryView"
          description: |-
            Seats the session cannot switch into: manually disabled or
            quota-suspended rows on live Workspaces, row order. Empty for a healthy
            session; the degraded shell lists them so a member with no Active
            Workspace can name which one to leave.
        workspaces:
          type: array
          items:
            "$ref": "#/components/schemas/WorkspaceSummaryView"
      additionalProperties: false
