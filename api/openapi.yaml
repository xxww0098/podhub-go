              `Retry-After` header stays the machine-readable wait.
      additionalProperties: false
    ListingIntentView:
      type: object
      description: |-
        One Intent as stored, plus the read facts every consumer needs to act on
        it without re-deriving them from `submissionIssues`: that list is the
        displayable history (unbindable elements are omitted), never a way to find
        the current issue by taking its last element.
      required:
      - submission_issues
      - current_issue_status
      - can_resume
      - id
      - store_id
      - listing_row_id
      - row_revision
      - client_operation_id
      - state
      - submission_receipt_status
      - updated_at_ms
      properties:
        can_resume:
          type: boolean
          description: |-
            Domain readiness to resume this Intent for the same input: a
            definite, classified pre-dispatch or rejected outcome on a `rejected`
            Intent. `false` for unknown, undeterminable, unproven or terminal
            outcomes. Not an authorization: the caller's own permissions still
            decide whether it may act.
        cancel_requested_at_ms:
          type: integer
          format: int64
          nullable: true
        client_operation_id:
          type: string
        current_issue:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIssue"
            description: |-
              The current input's issue, only when `currentIssueStatus` is
              `present`. An undeterminable history never shows an older issue here.
        current_issue_status:
          "$ref": "#/components/schemas/ListingCurrentIssueStatus"
          description: Whether the current input's issue could be determined.
        external_task_id:
          type: string
          nullable: true
        has_live_reconcile_claim:
          type: boolean
          description: |-
            GET/list snapshot only: a reconciler claim is live by database time.
            Absent when not enriched or the Intent changed during the read; absence
            is unknown, never `false`. This is not release authorization.
          nullable: true
        has_unfinished_dispatch_job:
          type: boolean
          description: |-
            GET/list snapshot only: an org-scoped `listing.submit.batch` Job in
            queued/running/retry_wait/uncertain names this exact Intent. Absence is
            unknown. Even two explicit `false` values require the release POST's
            atomic recheck; after release, read the exact Intent afresh.
          nullable: true
        id:
          type: string
        import_probe:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportProbeView"
            description: Set only while this Intent is `unknown`. Same facts as the row projection.
        known_error_code:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/IntentErrorCode"
            description: |-
              `lastErrorCode` when it is a value this build declares. Absent for an
              unrecognized value too: absence alone says nothing about dispatch and
              grants no automatic action.
        last_error_code:
