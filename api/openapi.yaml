          items:
            "$ref": "#/components/schemas/StoreProductRow"
      additionalProperties: false
    StoreProductsOverviewData:
      type: object
      required:
      - stores
      - totals
      - coverage
      - sync_disabled
      properties:
        coverage:
          "$ref": "#/components/schemas/StoreProductsCoverage"
        newest_sync_at_ms:
          type: integer
          format: int64
          description: Newest successful read across the visible stores.
          nullable: true
        stores:
          type: array
          items:
            "$ref": "#/components/schemas/StoreProductOverviewRow"
        sync_disabled:
          type: boolean
          description: |-
            The process-wide read-side kill switch (`OZON_PRODUCT_SYNC_DISABLED`):
            stores still render, but no scheduling or verify may leave.
        totals:
          "$ref": "#/components/schemas/StoreProductCounts"
      additionalProperties: false
    StoreProductsSyncNowData:
      type: object
      description: |-
        `POST …/products/sync` — 「立即更新」.

        A press queues a sync the worker claims next, or attaches to the walk
        this store already has in flight. The per-store interval is 10 minutes:
        a second press inside it answers 429 with the moment it lifts.
      required:
      - generation
      - manual_next_allowed_at_ms
      - attached
      properties:
        attached:
          type: boolean
          description: True when this press joined an in-flight walk and did not queue another.
        generation:
          type: integer
          format: int64
          description: The generation this press starts or joined.
        manual_next_allowed_at_ms:
          type: integer
          format: int64
          description: When the store's next manual press unlocks.
      additionalProperties: false
    StoreProductsSyncNowErrorResponse:
      type: object
      description: |-
        Refusals for `sync`: `manual_too_soon` (429) carries the unlock moment;
        holds (cooldown, backoff, credential) and open breakers answer 409 with
        the moment they lift — the page renders the reason, zero Seller calls.
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/WorkspaceStoreErrorCode"
        error:
          type: string
        manual_next_allowed_at_ms:
          type: integer
          format: int64
          nullable: true
        retry_after_ms:
          type: integer
          format: int64
          nullable: true
        until_ms:
          type: integer
          format: int64
          nullable: true
      additionalProperties: false
    StoreProductsVerifyData:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/StoreProductRow"
      additionalProperties: false
    StoreProductsVerifyRequest:
      type: object
      description: |-
        `POST …/products/verify` — the only path allowed to spend a Seller read
        from a page. ≤ 50 offer ids, one `info/list` call.
      required:
      - offer_ids
      properties:
        offer_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    SubmitDraftOutcome:
      type: string
      description: |-
        What happened to one submitted Draft. None of these is a Seller verdict:
        the Intent's state (and its `taskId` once accepted) is the outcome.
      enum:
      - created
      - resumed
      - replayed
      - skipped
    SubmitDraftSkipReason:
      type: string
      description: |-
        Why one Draft was skipped. Every one of these is decided before any
        Seller call, so none of them is a Seller failure.
      enum:
      - schema_stale
      - blocked
      - media_foreign
      - media_expired
      - offer_busy
      - compose_failed
    SubmitListingBatchData:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/SubmitListingBatchItemData"
      additionalProperties: false
    SubmitListingBatchItemData:
      type: object
      required:
      - row_id
      - created
      properties:
        blockers:
          type: array
          items: {}
          description: "`op_workflow::OperationBlocker[]` when `skipped` is `blocked`."
        created:
          type: boolean
        detail:
          type: string
          description: Free-text detail for `compose_failed`; empty otherwise.
          nullable: true
        fields:
          type: array
          items:
            type: string
          description: Human-readable names of required fields that need attention after a schema change.
        intent:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIntentView"
        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
            description: Same-txn row projection so the client need not wait for SSE.
        row_id:
          type: string
        skipped:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingBatchSkipReason"
      additionalProperties: false
    SubmitListingDraftItemResult:
      type: object
      required:
      - row_id
      - outcome
      properties:
        blockers:
          type: array
          items:
            "$ref": "#/components/schemas/DraftBlocker"
          description: |-
            Non-field refusals (supplier video snapshot, shipping readiness),
            present only when `skip_reason` is `blocked` for such a reason.
        detail:
          type: string
          description: Free-text detail for `compose_failed`; empty otherwise.
          nullable: true
        fields:
          type: array
          items:
            type: string
          description: Human-readable names of required fields that need attention after a schema change.
        intent:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIntentView"
        issues:
          type: array
          items:
            "$ref": "#/components/schemas/DraftFieldIssue"
          description: |-
            Field findings of the server's `build → validate`, present only when
            `skip_reason` is `blocked` for a field reason. Every one is a
            validate-stage finding (`KnownIssueKey` with `stage: validate` when
            its code is declared): this endpoint has no other field producer.
        outcome:
          "$ref": "#/components/schemas/SubmitDraftOutcome"
        row_id:
          type: string
        skip_reason:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/SubmitDraftSkipReason"
      additionalProperties: false
    SubmitListingDraftsData:
      type: object
      required:
      - server_schema_revision
      - items
      properties:
        accepted_schema_revisions:
          type: array
          items:
            type: string
          description: Current and accepted legacy schema revisions for this snapshot. Advisory only; the server decides whether a submitted revision can be accepted.
        items:
          type: array
          items:
            "$ref": "#/components/schemas/SubmitListingDraftItemResult"
        server_schema_revision:
          type: string
          description: |-
            The Category Schema revision every item was checked against —
            `SchemaMaterial::revision()` for the Card's own coordinate.
      additionalProperties: false
    SubmitListingDraftsRequest:
      type: object
      description: |-
        Send 1..=100 browser-owned Drafts to one Store under one Card
        (browser-owned-listing slice 07). The server always rebuilds from the
        Draft — resolve → validate → freeze runs here, never trusting a
        browser-frozen body or its own validation conclusions (README S2, I7).
        The HTTP envelope uses snake_case; opaque listing-core items retain
        their domain representation. Supplying tags or text requires the
        current rules_version and runs the tag gate before freezing.
      required:
      - store_id
      - card_id
      - items
      properties:
        card_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {}
          description: |-
            `SubmitDraft[]` (`listing_core::ops::SubmitDraft`), 1..=100 items. Kept
            opaque here — same convention as `CreateListingRowRequest.draft` —
            because `SubmitDraft` is a listing-core domain type, not a wire type;
            the handler decodes each element with `serde_json::from_value`. The
            browser obtains each item from the same ABI (`projectSubmitDraft`,
            `SubmitDraft::from_row`) rather than assembling it by hand.
        store_id:
          type: string
          format: uuid
        rules_version:
          type: string
        tags:
          type: array
          items:
            type: string
        text:
          type: string
      additionalProperties: false
