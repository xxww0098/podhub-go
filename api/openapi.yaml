  "/api/catalog/fetch-config/run":
    post:
      tags:
      - catalog
      summary: Fetch now, whatever the schedule says.
      description: |-
        The handler claims and answers immediately: one run is the tree download
        plus a coordinate refresh that outlasts any request deadline, so the pane
        polls `running` / `lastStatus` rather than waiting on this response. A
        failed run is still a finished run — it records `failed` and the poll sees
        it. Refusals that happen *before* the claim — no key, or a run already in
        flight — are errors.

        The run is a spawned task, not part of this request's future: a client
        that disconnects loses nothing — the run still completes, records and
        releases. The supervisor is the panic case: a task that ends without
        recording must give the claim back rather than wedge the feature for the
        lease window.
      operationId: run_now
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogFetchConfigResponse"
        '400':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogErrorResponse"
        '401':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogErrorResponse"
        '403':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogErrorResponse"
        '409':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogErrorResponse"
        '500':
          description: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CatalogErrorResponse"
