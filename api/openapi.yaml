      type: object
      required:
      - authenticated
      properties:
        account_kind:
          type: string
          description: |-
            platform or supplier. The single source of truth for which surface an
            account belongs to; `target` stays a login landing-page hint only.
        authenticated:
          type: boolean
        avatar_url:
          type: string
          description: |-
            `GET /api/avatars/me`, revision-stamped. Absent when the User has no
            avatar.
        email:
          type: string
        is_admin:
          type: boolean
          description: Derived display flag (`role != user`). Not an authorization signal.
        must_change_password:
          type: boolean
          description: |-
            True while a provisioned or staff-reset account has not replaced its
            password. While true every route answers 403 PASSWORD_CHANGE_REQUIRED
            except GET /api/auth/session, POST /api/auth/{login,logout,password}.
        name:
          type: string
        name_changed_at_ms:
          type: integer
          format: int64
          description: |-
            Milliseconds when the account name was last changed. Absent until the
            first rename; the settings UI derives the 24-hour cooldown from it.
        role:
          type: string
        supplier_id:
          type: string
        uuid:
          type: string
          description: |-
            Public id of the signed-in account. The shell keys per-account local
            state (product snapshots, image-set owners, telemetry identity) on it.
      additionalProperties: false
    AdminAccountMutationData:
      type: object
      required:
      - ok
      - user
      properties:
        ok:
          type: boolean
        user:
          "$ref": "#/components/schemas/AdminAccountView"
      additionalProperties: false
    AdminAccountView:
      type: object
      required:
      - kind
      - role_label
      - uuid
      - email
      - name
      - role
      - is_admin
      - plan
      - seat_limit
      - seats_used
      - ai_tokens_used
      - ai_tokens_monthly
      - created_at
      - status
      - disabled
      - manageable
      - editable
      properties:
        ai_tokens_monthly:
          type: integer
          format: int64
          description: Plan (or Workspace) monthly AI Token allowance. Zero when the account owns no Workspace.
        ai_tokens_used:
          type: integer
          format: int64
          description: Current-period AI Token consumption on the first owned Workspace.
        created_at:
          type: string
        disabled:
          type: boolean
        editable:
          type: boolean
        email:
          type: string
        is_admin:
          type: boolean
          description: Derived display flag (`role != user` / platform staff). Not an authorization signal.
        kind:
          type: string
          description: |-
            Account class aligned with PlatformRole: `super_admin` | `admin` | `user`
            (three-way; not collapsed to `"admin"` for staff).
        manageable:
          type: boolean
        name:
          type: string
        plan:
          type: string
        role:
          type: string
          description: Same PlatformRole wire value as `kind` (`super_admin` | `admin` | `user`).
        role_label:
          type: string
        seat_limit:
          type: integer
          format: int64
        seats_used:
          type: integer
          format: int64
          description: Effective seats currently occupied on the first owned Workspace.
        status:
          type: string
        uuid:
          type: string
      additionalProperties: false
    AdminAccountsData:
      type: object
      required:
      - workspaces
      - unaffiliated
      - workspace_count
      - user_count
      properties:
        unaffiliated:
          type: array
          items:
            "$ref": "#/components/schemas/AdminDirectoryPersonView"
        user_count:
          type: integer
          minimum: 0
        workspace_count:
          type: integer
          minimum: 0
        workspaces:
          type: array
          items:
            "$ref": "#/components/schemas/AdminDirectoryWorkspaceView"
      additionalProperties: false
    AdminAgentCommissionListData:
      type: object
