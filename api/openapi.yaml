    UsageRequestRow:
      type: object
      description: |-
        One Cloud-relayed AI access record. Token counts are the provider-observed
        values stored on `ai_requests`; cached input is a subset of input.
      required:
      - request_id
      - model
      - operation
      - status
      - input_tokens
      - output_tokens
      - cached_input_tokens
      - reasoning_output_tokens
      - cache_hit_rate_bps
      - total_microfen
      - charged_microfen
      - absorbed_microfen
      - created_at
      properties:
        absorbed_microfen:
          type: integer
          format: int64
          description: |-
            The part of the exact charge above the per-request ceiling that the
            platform absorbed; zero unless a provider billed past the ceiling.
        cache_hit_rate_bps:
          type: integer
          format: int32
          description: Cached input divided by total input, in basis points (10_000 = 100%).
        cached_input_tokens:
          type: integer
          format: int64
        charged_microfen:
          type: integer
          format: int64
          description: |-
            What the settlement actually took out of the balance; the only figure
            read paths may present as "spent".
        created_at:
          type: string
          description: RFC 3339, always UTC (`Z`) — the client buckets rows by slicing this.
        error_class:
          type: string
          nullable: true
        input_tokens:
          type: integer
          format: int64
        model:
          type: string
        operation:
          type: string
        output_tokens:
          type: integer
          format: int64
        reasoning_output_tokens:
          type: integer
          format: int64
        request_id:
          type: string
        settled_at:
          type: string
          description: RFC 3339, always UTC (`Z`).
          nullable: true
        status:
          type: string
        total_microfen:
          type: integer
          format: int64
      additionalProperties: false
    UsageStatsData:
      type: object
      description: Active Workspace Cloud AI access ledger plus full-range totals.
      required:
      - days
      - from
      - to
      - total_tokens
      - input_tokens
      - output_tokens
      - cached_input_tokens
      - message_count
      - cache_hit_rate_bps
      - total_microfen
      - charged_microfen
      - absorbed_microfen
      - page
      - page_size
      - total_pages
      - requests
      - generated_at_ms
      properties:
        absorbed_microfen:
          type: integer
          format: int64
          description: |-
            The platform-absorbed overage inside the range; zero unless a provider
            billed past the ceiling. `charged + absorbed` equals the nominal total.
        cache_hit_rate_bps:
          type: integer
          format: int32
          description: Cached input divided by total input, in basis points (10_000 = 100%).
        cached_input_tokens:
          type: integer
          format: int64
        charged_microfen:
          type: integer
          format: int64
          description: |-
            What the range's settlements actually took out of the balance; the
            "spent" figure every surface aligns with `wallet.spent_microfen`.
        days:
          type: integer
          format: int32
        from:
          type: string
          description: Inclusive range start `YYYY-MM-DD` (UTC).
        generated_at_ms:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        message_count:
          type: integer
          format: int64
          description: Every relay attempt in range, including failed and unbilled attempts.
        output_tokens:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        requests:
          type: array
          items:
            "$ref": "#/components/schemas/UsageRequestRow"
        to:
          type: string
          description: Inclusive range end `YYYY-MM-DD` (UTC).
        total_microfen:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int64
      additionalProperties: false
