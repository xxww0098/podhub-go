        seq:
          type: string
        workspace_id:
          type: string
      additionalProperties: false
    ListingRowProjection:
      type: object
      description: Read-only semantics shared by every row response. The browser only formats them.
      required:
      - submission_receipt_status
      - current_issue_status
      - can_resume
      - stage
      - ai
      - media
      - fields
      - readiness
      - image_total
      - image_completed
      properties:
        ai:
          "$ref": "#/components/schemas/WorkflowAiPhase"
        can_resume:
          type: boolean
          description: |-
            Domain readiness to resume the latest Intent for the current input,
            by the same rule as the Intent view's `canResume`. Not an
            authorization.
        current_issue_status:
          "$ref": "#/components/schemas/ListingCurrentIssueStatus"
          description: |-
            Whether the current input's issue (`submissionIssue`) could be
            determined; `undeterminable` also closes `publish`.
        error_code:
          type: string
          nullable: true
        error_detail:
          type: string
          nullable: true
        fields:
          "$ref": "#/components/schemas/WorkflowFieldPhase"
        image_completed:
          type: integer
          format: int32
          minimum: 0
        image_total:
          type: integer
          format: int32
          minimum: 0
        import_followup:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportFollowupView"
            description: Set when an accepted import has a newer read than 「已受理」.
        import_probe:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ImportProbeView"
            description: Set only while this row's current input is an unknown import.
        media:
          "$ref": "#/components/schemas/WorkflowMediaPhase"
        media_failure_stage:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/WorkflowMediaStage"
        product_id:
          type: integer
          format: int64
          nullable: true
        readiness:
          "$ref": "#/components/schemas/WorkflowReadinessReport"
        run_id:
          type: string
          nullable: true
        sku:
          type: integer
          format: int64
          nullable: true
        stage:
          "$ref": "#/components/schemas/RowStageView"
        submission_issue:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingIssue"
        submission_receipt:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingSubmissionReceipt"
            description: Present only when `submissionReceiptStatus` is `valid`.
        submission_receipt_status:
          "$ref": "#/components/schemas/ListingSubmissionReceiptStatus"
          description: |-
            `absent` here only means no displayable receipt: the row read model
            cannot tell a stored JSON `null` from none. Never a dispatch fact.
        task_id:
          type: string
          nullable: true
      additionalProperties: false
    ListingRowView:
      type: object
      required:
      - id
      - card_id
      - revision
      - view_revision
      - projection
      - content_state
      - media_state
      - validation_state
      - submission_state
      - draft
      - validation_issues
      - media
      - ai
      - source
      - payload
      - updated_at_ms
      - build
      properties:
        ai:
          description: "`{ candidates, summary?, promptSha256, modelVersion }`."
        build:
          "$ref": "#/components/schemas/ListingRowBuildView"
          description: |-
            Effective build evidence. `built` only when the stored stamp still
            matches the card's current defaults digest.
        card_id:
          type: string
        content_state:
          type: string
        draft:
          description: |-
            `WorkflowCategoryDraft` (`{ values, complex_values }`): the
            operator-visible field values.
        id:
          type: string
        media:
          description: "`{ images, videos, videoCover? }` lifecycle media."
        media_state:
          type: string
        ocr_recovery:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/OcrRecoveryView"
            description: Present only on `GET …/rows/{id}?include=ocrRecovery&jobId=`.
        payload:
          description: |-
            The row payload without the server-only `schemaSnapshot`.
            Includes `schemaRevision`, `normalizedSnapshot`, `handEditedKeys`,
            and the sections projected above.
        projection:
          "$ref": "#/components/schemas/ListingRowProjection"
        render_evidence:
          description: Committed render evidence, when an executor wrote one back.
        revision:
          type: integer
          format: int64
        source:
          description: "`{ assetId, sha256, fileName }` of the PSD / photo the row came from."
        store_id:
          type: string
          nullable: true
        submission_state:
          type: string
        updated_at_ms:
          type: integer
          format: int64
        validation_issues:
          description: "`FieldIssue[]` from the last validate: why the row is `blocked`."
        validation_state:
          type: string
        view_revision:
          type: integer
          format: int64
          description: Monotonic response version. Draft CAS continues to use `revision`.
      additionalProperties: false
    ListingRunView:
      type: object
      required:
      - id
