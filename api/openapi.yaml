      required:
      - status
      properties:
        invite_code:
          type: string
          description: "`[A-Z0-9]{8,32}`; absent keeps the code the Agent already has."
          nullable: true
        status:
          type: string
          description: "`active` or `disabled`."
      additionalProperties: false
    AdminAgentView:
      type: object
      description: |-
        The SuperAdmin's roster row: the Agent's identity and code plus the
        money-side headline (balance, held, payout destination). `rebate_bps`
        used to be a per-Agent override — the platform default is the only rate.
      required:
      - user_uuid
      - email
      - name
      - invite_code
      - status
      - wallet_balance_cents
      - wallet_held_cents
      - invitee_count
      - credited_count
      - skipped_count
      - credited_total_cents
      - created_at
      properties:
        created_at:
          type: string
        credited_count:
          type: integer
          format: int64
        credited_total_cents:
          type: integer
          format: int64
          description: Lifetime credited commissions in 分.
        email:
          type: string
        invite_code:
          type: string
        invitee_count:
          type: integer
          format: int64
        name:
          type: string
        payout_account:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/AgentPayoutAccountView"
            description: Where withdrawals go, when the Agent saved one.
        review_flagged_at:
          type: string
          description: |-
            Set once attribution velocity crossed the review ceiling; informational
            only, it disables nothing.
          nullable: true
        skipped_count:
          type: integer
          format: int64
        status:
          type: string
          description: "`active` or `disabled`."
        user_uuid:
          type: string
        wallet_balance_cents:
          type: integer
          format: int64
        wallet_held_cents:
          type: integer
          format: int64
      additionalProperties: false
    AdminAgentWithdrawalView:
      type: object
      description: |-
        A withdrawal the SuperAdmin decides on: the payout account is the
        snapshot the Agent filed, never the live profile — an in-flight request
        can never be redirected by an edit.
