        cached_input_microfen_per_million:
          type: integer
          format: int64
        output_microfen_per_million:
          type: integer
          format: int64
        reasoning_microfen_per_million:
          type: integer
          format: int64
        per_request_microfen:
          type: integer
          format: int64
        max_request_microfen:
          type: integer
          format: int64
    AIRequestPrice:
      type: object
