  "/mcp":
    get:
      operationId: mcpGet
      tags:
      - mcp
      summary: MCP endpoint. Only POST carries a request; other methods answer 405 with Allow POST.
      responses:
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '405':
          description: Method not allowed. Allow is POST.
          content:
            application/json:
              schema:
                type: object
      description: 'GET never carries a JSON-RPC request: the router answers 405 with Allow: POST. The method is declared so the contract states the 405 explicitly.'
    post:
      operationId: mcpPost
      tags:
      - mcp
      summary: MCP JSON-RPC over one POST. A grant token or a user session authenticates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC result or error envelope
          content:
            application/json:
              schema:
                type: object
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Origin refused by the DNS-rebinding check
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: mcpDelete
      tags:
      - mcp
      summary: MCP endpoint. Only POST carries a request; DELETE answers 405 with Allow POST.
      responses:
        '401':
          description: No live session and no valid automation grant token
          content:
            application/json:
              schema:
                type: object
        '405':
          description: Method not allowed. Allow is POST.
          content:
            application/json:
              schema:
                type: object
      description: 'DELETE never carries a JSON-RPC request: the router answers 405 with Allow: POST. The method is declared so the contract states the 405 explicitly.'
