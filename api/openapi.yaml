          additionalProperties: true
          description: What the job was pinned to, in snake_case. executor is common to every kind; render jobs pin psd_template_sha256, upload jobs pin manifest_digest, manifest, and recognition_prompt. The browser executor acts on this without a second read of the row.
        state:
