    parameters:
    - in: path
      name: provider
      required: true
      schema:
        type: string
    post:
      operationId: billingWebhook
      tags:
      - billing
      summary: Payment provider notification for alipay, wechat, stripe, easypay, or airwallex
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Notice accepted. alipay and easypay answer the text success; other providers answer an empty body
          x-allow-empty-body: true
          content:
            text/plain:
              schema:
                type: string
                enum:
                - success
        '400':
          "$ref": "#/components/responses/BillingPlainError"
        '404':
          "$ref": "#/components/responses/BillingPlainError"
        '503':
          "$ref": "#/components/responses/BillingProviderClosed"
