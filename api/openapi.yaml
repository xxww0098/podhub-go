        object_key:
          type: string
        storage_revision:
          type: integer
          format: int64
        upload_batch:
          type: string
          nullable: true
        upload_ticket:
          type: string
        workspace_uuid:
          type: string
      additionalProperties: false
    MediaObjectPresignData:
