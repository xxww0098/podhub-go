      - request_id
      - model
      - status
      - prompt_tokens
      - cached_prompt_tokens
      - completion_tokens
      - reasoning_completion_tokens
      - uncached_input_microfen
      - cached_input_microfen
      - output_microfen
      - reasoning_microfen
      - total_microfen
      - charged_microfen
      - absorbed_microfen
      - error_class
      - price
      - created_at
      - settled_at
      properties:
        request_id:
          type: string
        model:
          type: string
        status:
          type: string
        prompt_tokens:
          type: integer
          format: int64
        cached_prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        reasoning_completion_tokens:
          type: integer
          format: int64
        uncached_input_microfen:
          type: integer
          format: int64
        cached_input_microfen:
          type: integer
          format: int64
        output_microfen:
          type: integer
          format: int64
        reasoning_microfen:
          type: integer
          format: int64
        total_microfen:
          type: integer
          format: int64
        charged_microfen:
          type: integer
          format: int64
        absorbed_microfen:
          type: integer
