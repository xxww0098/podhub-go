    CatalogCoordinateFreshness:
      type: object
      description: |-
        Freshness rollup over the catalogue rows the daily fetch maintains, in the
        fetch's configured language.

        `total` partitions into `fresh` + `stale` + `expired` + `missing`. The bands
        are classified by `ozon_catalog::contract::catalog_freshness` at read time —
        readers render these counts and never recompute an age, so the 24h/72h
        thresholds keep exactly one owner.
      required:
      - total
      - fresh
      - stale
      - expired
      - missing
      properties:
        expired:
          type: integer
          format: int64
          description: Past `CATALOG_MAX_AGE_MS` — admission fails closed on these.
        fresh:
          type: integer
          format: int64
          description: Inside the daily refresh cadence.
        missing:
          type: integer
          format: int64
          description: Referenced by a product but with no `ozon_category_current` row at all.
        stale:
          type: integer
          format: int64
          description: |-
            Past `CATALOG_STALE_AGE_MS` but inside `CATALOG_MAX_AGE_MS` — still
            listable, operator-visible.
        total:
          type: integer
          format: int64
          description: |-
            Referenced coordinates counted, capped at the referenced-coordinate
            bound (the surplus is truncated, not reported).
      additionalProperties: false
    CatalogDictionarySearchRequest:
      type: object
      description: Platform-authenticated live dictionary lookup; no Store credential selector.
      required:
      - attribute_id
      - description_category_id
      - type_id
      - limit
      - value
      properties:
        attribute_id:
          type: integer
          format: int64
        description_category_id:
          type: integer
          format: int64
        language:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CatalogSchemaLanguage"
        limit:
          type: integer
          format: int64
        type_id:
          type: integer
          format: int64
        value:
          type: string
      additionalProperties: false
    CatalogDictionarySearchResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSchemaOption"
    CatalogErrorCode:
      type: string
      enum:
      - auth_invalid
      - auth_required
      - forbidden
      - validation
      - conflict
      - internal
      - capability_not_ready
      - not_found
      - writes_disabled
      - not_ported
    CatalogErrorResponse:
      type: object
      required:
      - error
      - code
      properties:
        code:
          "$ref": "#/components/schemas/CatalogErrorCode"
        error:
          type: string
      additionalProperties: false
    CatalogFetchConfigData:
      type: object
      description: The whole configuration plus its runtime state.
      required:
      - enabled
      - schedule_mode
      - at_minute
      - window_start_minute
      - window_end_minute
      - utc_offset_minutes
      - keys
      - last_error
      - last_key_attempts
      - failure_streak
      - running
      - coordinate_freshness
      - updated_at_ms
      properties:
        at_minute:
          type: integer
          format: int32
          description: Minute of day (0..1439) for `fixed`.
        coordinate_freshness:
          "$ref": "#/components/schemas/CatalogCoordinateFreshness"
          description: |-
            How fresh the catalogue is at the coordinates supplier products
            reference — the "is the daily fetch keeping up" summary the pane shows.
        enabled:
          type: boolean
        failure_streak:
          type: integer
          format: int32
          description: |-
            Consecutive failures. Above the retry bound the schedule returns to the
            daily slot instead of retrying every few minutes.
        keys:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogFetchKeyView"
          description: The ordered failover list. Empty means the feature has no key yet.
        last_duration_ms:
          type: integer
          format: int64
          nullable: true
        last_error:
          type: string
          description: |-
            Operator-facing detail of the last run; empty after a clean success.
        last_key_attempts:
          type: integer
          format: int32
          description: How many keys that run tried. 1 means the first one answered.
        last_key_client_id:
          type: string
          description: |-
            Client-Id of the last run's final attempt: the key that served it on
            success, or the last one tried before giving up.
          nullable: true
        last_root_nodes:
          type: integer
          format: int64
          nullable: true
        last_run_at_ms:
          type: integer
          format: int64
          nullable: true
        last_status:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CatalogFetchRunStatus"
        next_run_at_ms:
          type: integer
          format: int64
          nullable: true
        running:
          type: boolean
          description: |-
            A run — manual or scheduled — holds the claim right now. The `last_*`
            fields still describe the previous run until this one records.
        schedule_mode:
          "$ref": "#/components/schemas/CatalogFetchScheduleMode"
        updated_at_ms:
          type: integer
          format: int64
        utc_offset_minutes:
          type: integer
          format: int32
          description: Offset from UTC in minutes; the schedule is wall-clock local to it.
        window_end_minute:
          type: integer
          format: int32
        window_start_minute:
          type: integer
          format: int32
          description: Local window `[window_start_minute, window_end_minute)` for `random`.
      additionalProperties: false
    CatalogFetchConfigWriteRequest:
      type: object
      description: |-
        A full replacement of the settings. The submitted list order is the
        failover order.
      required:
      - enabled
      - schedule_mode
      - at_minute
      - window_start_minute
      - window_end_minute
      - utc_offset_minutes
      - keys
      properties:
        at_minute:
          type: integer
          format: int32
        enabled:
          type: boolean
        keys:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogFetchKeyInput"
        schedule_mode:
          "$ref": "#/components/schemas/CatalogFetchScheduleMode"
        utc_offset_minutes:
          type: integer
          format: int32
        window_end_minute:
          type: integer
          format: int32
        window_start_minute:
          type: integer
          format: int32
      additionalProperties: false
    CatalogFetchKeyInput:
      type: object
      description: |-
        One submitted key. An empty `api_key` keeps the stored one for this
        Client-Id; there being nothing stored is a first configuration and must
        carry a key.
      required:
      - client_id
      properties:
        api_key:
          type: string
        client_id:
          type: string
      additionalProperties: false
    CatalogFetchKeyView:
      type: object
      description: One configured key, in list order. The Api-Key is a flag here, never a value.
      required:
      - client_id
      - api_key_configured
      - disabled
      properties:
        api_key_configured:
          type: boolean
          description: Whether a sealed Api-Key is stored for this Client-Id.
        client_id:
          type: string
          description: Seller Client-Id. Not a secret, so it is read back for display.
        disabled:
          type: boolean
          description: |-
            Whether a run saw Ozon refuse this credential and retired it from the
            failover list. Replaced secrets re-enable; kept ones stay retired.
      additionalProperties: false
    CatalogFetchRunStatus:
      type: string
      description: |-
        How the last run ended. A run refreshes only the category tree; category
        field schemas and dictionary values are loaded on demand.
      enum:
      - ok
      - failed
    CatalogFetchScheduleMode:
      type: string
      description: How the daily fetch picks its time.
      enum:
      - fixed
      - random
    CatalogSchemaData:
      type: object
      description: |-
        The cached material for one `(category, type, language)` coordinate. No
        `schema_revision`: it is recomputed from the fields.
      required:
      - description_category_id
      - type_id
      - language
      - fetched_at_ms
      - fields
      properties:
        description_category_id:
          type: integer
          format: int64
        fetched_at_ms:
          type: integer
          format: int64
        fields:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSchemaField"
        language:
          "$ref": "#/components/schemas/CatalogSchemaLanguage"
        native_material:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CatalogSchemaNativeMaterial"
            description: |-
              Read-only projection for the browser's `schema_load`, built per GET from
              exactly `fields` above. Never part of the stored payload or any hash
              input; `None` only on historical fixtures, a served GET always sets it.
        type_id:
          type: integer
          format: int64
      additionalProperties: false
    CatalogSchemaEditor:
      type: string
      description: |-
        Editor kind of one cached field — the same closed set and snake_case values
        as `listing::records::ListingFieldEditor`.
      enum:
      - text
      - integer
      - decimal
      - boolean
      - single_select
      - multi_select
      - dictionary_search
      - url
      - url_list
    CatalogSchemaField:
      type: object
      description: |-
        One cached field. `collection` / `max_value_count` / `dictionary_id` are
        flattened here: the cache carries field material, not nested constraints.
      required:
      - key
      - label
      - group
      - editor
      - required
      - collection
      properties:
        aspect:
          type: boolean
          description: |-
            Ozon `is_aspect` for this field's Seller attribute. Absent = unknown:
            the payload was written before aspect metadata existed, and
            `variants::carries_aspect_metadata` refuses to read it as "no variant
            dimensions". Kept omitted-when-unknown rather than written as `null`
            so one rule covers both an old payload and a field that has none.
          nullable: true
        attribute_id:
          type: string
          nullable: true
        collection:
          type: boolean
        complex_group_collection:
          type: boolean
        complex_id:
          type: string
          nullable: true
        description:
          type: string
        dictionary_id:
          type: string
          nullable: true
        editor:
          "$ref": "#/components/schemas/CatalogSchemaEditor"
        group:
          type: string
        key:
          type: string
        label:
          type: string
        max_value_count:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        options:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSchemaOption"
        options_truncated:
          type: boolean
        raw_type:
          type: string
          nullable: true
        read_only:
          type: boolean
        required:
          type: boolean
      additionalProperties: false
    CatalogSchemaLanguage:
      type: string
      description: Language variant of the cached Seller category schema.
      enum:
      - default
      - ru
      - en
      - tr
      - zh_hans
    CatalogSchemaNativeMaterial:
      type: object
      description: |-
        `listing-core-wasm`'s `SchemaLoadInput` wire shape: the native snapshot plus
        the same Seller-confirmed search bag native validation reads.
      required:
      - snapshot
      - search_materials
      properties:
        search_materials:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogSearchMaterialEntry"
        snapshot:
          type: object
          description: |-
            Native `CategorySchemaSnapshot` serde is authoritative; OpenAPI leaves
            it opaque rather than mirroring every native model.
      additionalProperties: false
    CatalogSchemaOption:
      type: object
      description: One dictionary option carried with a field.
      required:
      - id
      - value
      properties:
        id:
          type: string
        info:
          type: string
        picture:
          type: string
        value:
          type: string
      additionalProperties: false
    CatalogSearchMaterialEntry:
      type: object
      required:
      - description_category_id
      - attribute_id
      - dictionary_id
      - value_id
      - label
      properties:
        attribute_id:
          type: integer
          format: int64
        description_category_id:
          type: integer
          format: int64
        dictionary_id:
          type: integer
          format: int64
        label:
          type: string
        value_id:
          type: integer
          format: int64
      additionalProperties: false
    CatalogTreeCacheNode:
      type: object
      description: One node of the cached tree.
      required:
      - description_category_id
      - category_name
      - type_id
      - type_name
      - disabled
      - parent_index
      properties:
        category_name:
          type: string
        description_category_id:
          type: integer
          format: int64
        disabled:
          type: boolean
        type_id:
          type: integer
          format: int64
        type_name:
          type: string
        parent_index:
          type: integer
          format: int64
          nullable: true
          description: Zero-based index of the parent in items. Null on roots; category IDs are inherited by type nodes.
      additionalProperties: false
    CatalogTreeData:
      type: object
      required:
      - language
      - fetched_at_ms
      - items
      properties:
        fetched_at_ms:
          type: integer
          format: int64
        language:
          "$ref": "#/components/schemas/CatalogTreeLanguage"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogTreeCacheNode"
      additionalProperties: false
    CatalogTreeLanguage:
      type: string
      description: Language variant of the cached Seller category tree.
      enum:
      - default
      - ru
      - en
      - tr
      - zh_hans
    CategoryPromptData:
      type: object
      description: |-
        One Cloud-hosted category AI prompt. Provisioned by SuperAdmin; any
        authenticated operator may list the prompts for the current category leaf
        `content` is canonical product-fact JSON: product_type_ru, facts_ru.
        server-side (`validate_brief`, ≤ 4 KB; `docs/ocr.md` §4.2).
      required:
      - prompt_id
      - name
      - file_name
      - description_category_id
      - type_id
      - updated_at_ms
      properties:
        content:
          type: string
          description: Absent for operators. Platform staff receive confirmed product facts.
          nullable: true
        description_category_id:
          type: integer
          format: int64
        file_name:
          type: string
        fixed_tags:
          type: array
          items:
            type: string
          description: Absent for operators, together with `content`.
          nullable: true
        name:
          type: string
        prompt_id:
          type: string
        type_id:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    CategoryVideoData:
      type: object
      description: One pooled video. `video_id` is server-minted.
      required:
      - video_id
      - name
      - video_url
      - duration_ms
      - description_category_id
      - type_id
      - updated_at_ms
      properties:
        description_category_id:
          type: integer
          format: int64
        duration_ms:
          type: integer
          format: int64
        name:
          type: string
        type_id:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
        video_id:
          type: string
        video_url:
          type: string
      additionalProperties: false
    CompleteListingRowMediaData:
      type: object
      required:
      - jobs
      - applied
      properties:
        applied:
          type: boolean
          description: False when `expected_revision` no longer matches (stale pin ignored).
        jobs:
          type: array
          items:
            "$ref": "#/components/schemas/ListingRunView"
        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
      additionalProperties: false
    CompleteListingRowMediaPayload:
      type: object
      description: |-
        What a media executor may write back. Merged at the payload top level, so
        the three keys are the whole contract — an unknown key would silently
        overwrite a payload section, and is refused instead.
      properties:
        failure_log:
          description: "`WorkflowFailureLogEntry[]`."
        media:
          description: "`{ images }`; this endpoint records rendered image slices."
        render_evidence:
          description: "`RenderEvidence` plus `sliceCount` / `degradations`."
      additionalProperties: false
    CompleteListingRowMediaRequest:
      type: object
      description: The browser reports a media outcome against its durable job, pinned rendering inputs and current row revision. Browser media jobs do not acquire execution leases.
      required:
      - expected_revision
      - media_state
      - job_id
      properties:
        error_code:
          type: string
          nullable: true
        expected_revision:
          type: integer
          format: int64
          description: |-
            Current row revision for the write CAS; unrelated Draft edits may refresh it.
            The prepared source / template / renderer fingerprint is
            an independent fence. A stale row revision returns `applied: false`.
        job_id:
          type: string
        media_state:
          type: string
          description: Render completion (`rendered`) or stage failure (`failed`); uploads use per-image receipts.
        payload:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/CompleteListingRowMediaPayload"
      additionalProperties: false
    ConfirmListingRowImageData:
      type: object
      description: |-
        Per-image upload receipt. Intermediate confirmations stay compact: `row`
        is present only when this receipt settled the Job (or on an idempotent
        replay of an already-succeeded Job), so steady-state upload traffic does
        not pay for a full row projection per slice.
      required:
      - applied
      - index
      - phase
      - completed
      - total
      - media_state
      - view_revision
      properties:
        account_id:
          type: string
          nullable: true
        applied:
          type: boolean
        completed:
          type: integer
          format: int64
        index:
          type: integer
          format: int32
          minimum: 0
        media_state:
          type: string
          description: Row media state after this receipt (`uploading` | `ready`).
        object_key:
          type: string
          nullable: true
        phase:
          type: string
          description: The confirmed image phase (e.g. `public_ready`).
        public_url:
          type: string
          nullable: true
        row:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ListingRowView"
        storage_revision:
          type: integer
          format: int64
          nullable: true
        total:
          type: integer
          format: int64
        view_revision:
          type: integer
          format: int64
          description: The row's view revision after the writeback.
      additionalProperties: false
    ConfirmListingRowImageInput:
      type: object
      required:
      - index
      - object_key
      - account_id
      properties:
        account_id:
          type: string
        index:
          type: integer
          format: int32
          minimum: 0
        object_key:
          type: string
      additionalProperties: false
    ConfirmListingRowImageRequest:
      type: object
      required:
      - job_id
      - object_key
      - account_id
      properties:
        account_id:
          type: string
        job_id:
          type: string
        object_key:
          type: string
      additionalProperties: false
    ConfirmListingRowImagesRequest:
      type: object
      required:
      - job_id
      - images
      properties:
        images:
          type: array
          items:
            "$ref": "#/components/schemas/ConfirmListingRowImageInput"
        job_id:
          type: string
      additionalProperties: false
    ConfirmListingRowImagesResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ConfirmListingRowImageData"
        total:
          type: integer
          format: int64
      additionalProperties: false
    ConsoleLedgerEntry:
      type: object
      required:
      - kind
      - status
      - created_at_ms
      - updated_at_ms
      properties:
        created_at_ms:
          type: integer
          format: int64
        kind:
          "$ref": "#/components/schemas/ConsoleLedgerKind"
        status:
          "$ref": "#/components/schemas/OperationStatus"
        updated_at_ms:
          type: integer
          format: int64
    ConsoleLedgerKind:
      type: string
      description: |-
        Which table a ledger row came from. The snapshot unions two sources into
        one vocabulary; `kind` keeps the 上架 signal (submission intents) separate
        from every other Seller write so a chart can count listings without also
        counting price edits and chat sends.
      enum:
      - listing
      - write
    ConsoleRefreshMetricsResponse:
      type: object
      required:
      - results
      - metrics
      properties:
        metrics:
          type: array
          items:
            "$ref": "#/components/schemas/ConsoleStoreMetrics"
        results:
          type: array
          items:
            "$ref": "#/components/schemas/ConsoleStoreRefreshResult"
    ConsoleSnapshot:
      type: object
      required:
      - roster
      - ledger
      - metrics
      - products
      properties:
        ledger:
          type: array
          items:
            "$ref": "#/components/schemas/ConsoleLedgerEntry"
        metrics:
          type: array
          items:
            "$ref": "#/components/schemas/ConsoleStoreMetrics"
        products:
          type: array
          items:
            "$ref": "#/components/schemas/ConsoleStoreProducts"
        roster:
          "$ref": "#/components/schemas/OzonStoresOverview"
    ConsoleStoreMetrics:
      type: object
      required:
      - store_id
      properties:
        day_series_14d:
          type: array
          items:
            type: number
            format: double
          nullable: true
        last_error:
          type: string
          nullable: true
        last_sync_at_ms:
          type: integer
          format: int64
          nullable: true
        ordered_units_30d:
          type: number
          format: double
          nullable: true
        previous_ordered_units_30d:
          type: number
          format: double
          nullable: true
        retry_at_ms:
          type: integer
          format: int64
          nullable: true
        store_id:
          type: string
        through_day:
          type: string
          nullable: true
    ConsoleStoreProducts:
      type: object
      description: |-
        One visible store's product-mirror position on the console.

        A row exists for every roster store even when the mirror has never synced —
        the `count_*` fields stay `None` together (`count_*` CHECK on the table
        makes a half-written summary unrepresentable) and the client reads that as
        `never`, never as zero.
      required:
      - store_id
      properties:
        count_archived:
          type: integer
          format: int64
          nullable: true
        count_hidden:
          type: integer
          format: int64
          nullable: true
        count_moderation_failed:
          type: integer
          format: int64
          nullable: true
        count_on_sale:
          type: integer
          format: int64
          nullable: true
        count_total:
          type: integer
          format: int64
          nullable: true
        count_zero_stock:
          type: integer
          format: int64
          nullable: true
        hold:
          type: string
          nullable: true
        hold_reason:
          type: string
          nullable: true
        hold_until_ms:
          type: integer
          format: int64
          nullable: true
        last_full_sync_at_ms:
          type: integer
          format: int64
          nullable: true
        pass:
          type: string
          nullable: true
        priced_at_ms_max:
          type: integer
          format: int64
          description: Newest price/stock read across the store's live rows.
          nullable: true
        store_id:
          type: string
    ConsoleStoreRefreshResult:
      oneOf:
      - type: object
        required:
        - store_id
        - status
        properties:
          status:
            type: string
            enum:
            - succeeded
          store_id:
            type: string
      - type: object
        required:
        - store_id
        - error
        - status
        properties:
          error:
            type: string
          status:
            type: string
            enum:
            - failed
          store_id:
            type: string
    ConsumeWorkspaceStoreTombstoneData:
      type: object
      description: |-
        Operator acknowledgement that the local Secret for a deleted Store was
        removed. Replaying the same acknowledgement is safe and idempotent.
      required:
      - store_uuid
      - consumed_at_ms
      properties:
        consumed_at_ms:
          type: integer
          format: int64
        store_uuid:
          type: string
      additionalProperties: false
    CreateAutomationGrantRequest:
      type: object
      required: [name, actions]
      properties:
        name:
          type: string
        actions:
          type: array
          items:
            type: string
        expires_in_days:
          type: integer
          format: int64
          nullable: true
      additionalProperties: false
    CreateAutomationGrantData:
      type: object
      description: The create response is the only place the bearer token ever appears.
      required:
      - grant
      - token
      properties:
        grant:
          "$ref": "#/components/schemas/AutomationGrantView"
        token:
          type: string
      additionalProperties: false
    CreateDelegateAssetRequest:
      type: object
      required:
      - binding_id
      - upload_ticket
      - file_name
      properties:
        binding_id:
          type: string
        file_name:
          type: string
        position:
          type: integer
          format: int32
        upload_ticket:
          type: string
          description: Actor/workspace/binding/storage/content-bound receipt; never sent to S3.
      additionalProperties: false
    CreateDelegateBindingRequest:
      type: object
      required:
      - store_id
      - offer_id
      - source_id
      properties:
        note:
          type: string
        offer_id:
          type: string
          description: Normalized through `NULLIF(btrim(), '')` before any check.
        source_id:
          type: string
        store_id:
          type: string
      additionalProperties: false
    CreateDelegateOrderRequest:
      type: object
      required:
      - store_id
      - posting_number
      properties:
        offer_ids:
          type: array
          items:
            type: string
          description: |-
            Subset of the posting's offer_ids to delegate. Absent/empty = every
            line; lines left out never enter the order.
