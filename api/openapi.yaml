      - term
      - provider
      - expected_workspace_uuid
      properties:
        expected_workspace_uuid:
          type: string
          description: |-
            The Workspace the dialog was opened on. The server re-resolves the
            active Workspace at write time; a stale dialog answers 409 instead of
            charging the Workspace the session landed on (B2).
        operation_id:
          type: string
          description: |-
            One purchase attempt's id. A retry with the same id resumes the pending
            order this attempt already committed — the same public_id, the same
            reservation — instead of answering PENDING_ORDER_EXISTS. The client
            rotates it when the chosen content or provider changes.
        provider:
          type: string
        purchase_agreement:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/PurchaseAgreementAcceptance"
        seats:
          type: integer
          format: int64
          description: Seats on this purchase, 1–20.
        term:
          type: string
          description: 'Billing term: `month`, `quarter`, or `year` (year is discounted).'
        tier:
          type: string
          description: 'Purchased tier: `pro`, `max`, or `ultra`.'
      additionalProperties: false
    PaymentMethodsData:
      type: object
      required:
      - providers
      - manual
      properties:
        manual:
          type: boolean
        providers:
          type: array
          items:
            type: string
        purchase_agreement:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/PurchaseAgreementView"
      additionalProperties: false
    PaymentOrderData:
      type: object
      required:
      - order
      properties:
        order:
          "$ref": "#/components/schemas/PaymentOrderView"
      additionalProperties: false
    PaymentOrderListData:
      type: object
      required:
      - orders
      properties:
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
          nullable: true
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/PaymentOrderView"
      additionalProperties: false
    PaymentOrderView:
      type: object
      required:
      - public_id
      - plan
      - member_seats
      - months
      - unit_month_cents
      - duration_days
      - amount_cents
      - credit_cents
      - currency
      - provider
      - status
      - entry_state
      - created_at
      properties:
        amount_cents:
          type: integer
          format: int64
        canceled_at:
          type: string
          nullable: true
        created_at:
          type: string
        credit_cents:
          type: integer
          format: int64
          description: |-
            Upgrade credit deducted from `amount_cents` at creation; the gross price
            is `amount_cents + credit_cents` (zero on a wallet top-up).
        currency:
          type: string
        duration_days:
          type: integer
          format: int32
          description: Lot validity settle grants, frozen at creation (30 / 90 / 365).
        entry_state:
          type: string
          description: |-
            Where the payment entry stands, derived from the stored row alone:
            `paid` / `canceled` are the terminal statuses; `ready` means a
            stored QR or pay URL is present; `entry_confirming` means the provider
            confirmed the upstream order but this channel cannot re-issue an entry,
            so the reservation is held for reconciliation; `entry_unknown` is a
            pending order whose entry has not been stored (yet).
        member_seats:
          type: integer
          format: int64
        months:
          type: integer
          format: int32
          description: Billed months, frozen at creation (1 / 3 / 12).
        paid_at:
          type: string
          nullable: true
        pay_url:
          type: string
          nullable: true
        plan:
          type: string
          description: The purchased tier (`pro` / `max` / `ultra`).
        provider:
          type: string
        public_id:
          type: string
        purchase_agreement:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/PurchaseAgreementReceipt"
        qr_code:
          type: string
          nullable: true
        remittance:
          type: string
          nullable: true
        renews_lot_id:
          type: integer
          format: int64
          description: |-
            Set when the order extends an existing lot (a renewal) instead of
            minting a fresh current one.
          nullable: true
        status:
          type: string
        unit_month_cents:
          type: integer
          format: int64
          description: Per seat-month price after the term discount, in fen, frozen at creation.
      additionalProperties: false
    PlanView:
      type: object
      required:
      - key
      - name
      - tagline
      - price_monthly
      - price_yearly
      - included_seats
      - max_stores
      - member_seats
      - store_limit
      - ocr_monthly
      - asset_monthly
      - listing_monthly
      - s3_upload_bytes_monthly
      - ai_tokens_monthly
      - highlights
      - admin_only
      properties:
        admin_only:
          type: boolean
        ai_tokens_monthly:
          type: integer
          format: int64
        asset_monthly:
          type: integer
          format: int64
        highlights:
          type: array
          items:
            type: string
        included_seats:
          type: integer
          format: int64
        key:
          type: string
        listing_monthly:
          type: integer
          format: int64
        max_stores:
          type: integer
          format: int64
        member_seats:
          type: integer
          format: int64
          description: |-
            Member seats included in the plan. Migration mirror of
            `included_seats`; clients should read `member_seats`. When the field is
            absent on an old wire, deserialization falls back to `included_seats`.
        name:
          type: string
        ocr_monthly:
          type: integer
          format: int64
        price_monthly:
          type: integer
          format: int64
        price_yearly:
          type: integer
          format: int64
        s3_upload_bytes_monthly:
          type: integer
          format: int64
        store_limit:
          type: integer
          format: int64
          description: |-
            Store slots included in the plan. Migration mirror of `max_stores`;
            clients should read `store_limit`. When the field is absent on an old
            wire, deserialization falls back to `max_stores`.
        tagline:
          type: string
    PlansData:
      type: object
      required:
      - plans
      - seat_catalog
      properties:
        plans:
          type: array
          items:
            "$ref": "#/components/schemas/PlanView"
          description: |-
            Display rows from the `plans` table — names, taglines, highlights and
            the legacy bundle columns. They carry no purchasable truth: quoting
            reads `seat_catalog`, which mirrors `billing::seats`.
        seat_catalog:
          "$ref": "#/components/schemas/SeatCatalogData"
          description: |-
            The purchasable member-seat catalog. `billing::seats` is the source of
            truth; this field is its read projection.
      additionalProperties: false
    PrepareListingRowData:
      type: object
      required:
      - jobs
      - outcome
      properties:
        issues:
          type: array
          items:
            "$ref": "#/components/schemas/ListingPrepareStageIssue"
          description: Refusals on individual rails; other returned Jobs remain runnable.
        jobs:
          type: array
          items:
            "$ref": "#/components/schemas/ListingRunView"
          description: Jobs this call created (`Start`) or joined (`Wait`), one per rail.
        outcome:
          type: string
          description: |-
            `op_workflow::PrepareOutcome`: `running` | `waiting` | `needs_review` |
            `prepared`. Derived on every read, never persisted — there is no
            `prepare_state` column.
      additionalProperties: false
    PrepareListingRowOperation:
      type: string
      description: A preparation action the browser asks Cloud to pin.
      enum:
      - recognize
      - slice
      - upload
      - prepare
    PrepareListingRowRequest:
      type: object
      required:
      - operation
      - renderer_contract_version
      properties:
        command_id:
          type: string
          description: |-
            Optional command idempotency key, at most 128 bytes without control
            characters. A retry with the same Workspace key returns the original
            jobs and cannot be reused on another row.
          nullable: true
        model_routing:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/OcrModelRouting"
            description: Pinned to the recognition task; later purchases use this saved order.
        operation:
          "$ref": "#/components/schemas/PrepareListingRowOperation"
          description: |-
            Exactly one requested preparation operation. `prepare` is the fixed
            recognition + media combination; the other values only admit their own
            rail and prerequisites.
        renderer_contract_version:
          type: string
          description: |-
            Renderer contract version of the browser WASM build asking for the pin.
            Empty is a `missing_renderer_contract` blocker,
            not a default: the slice decision is keyed on it.
      additionalProperties: false
    ProductFreshness:
      type: string
      description: |-
        `freshness` — the freshness vocabulary `store::product_sync::freshness`
        computes and the SPA mirrors. `never` and `expired` are states, not zeroes.
      enum:
      - fresh
      - stale
      - expired
      - never
    ProductGroupingAction:
      type: string
      description: |-
        What the operator asked the manager to do. One action per operation, so a
        frozen request always means exactly one kind of grouping change.
      enum:
      - merge
      - split
      - move
    ProductGroupingState:
      type: string
      description: Where one product of an operation stands.
      enum:
      - pending
      - applied
      - rejected
      - partial
      - needs_review
    ProductMetricsItem:
      type: object
      required:
      - sku
      - hits_view
      - session_view
      - ordered_units
      - revenue
      properties:
        hits_view:
          type: number
          format: double
        ordered_units:
          type: number
          format: double
        revenue:
          type: number
          format: double
        session_view:
          type: number
          format: double
        sku:
          type: integer
          format: int64
    ProductMetricsRequest:
      type: object
      required:
      - store_id
      properties:
        days:
          type: integer
          format: int64
        dimension:
          type: string
          description: |-
            `"day"` asks for a store- or SKU-level daily series. Anything else
            (including empty) is the SKU roster used by the product screen.
          nullable: true
        sku:
          type: integer
          format: int64
          nullable: true
        store_id:
          type: string
      additionalProperties: false
    ProductMetricsSnapshot:
      type: object
      required:
      - store_id
      - items
      - sync_state
      - performance
      properties:
        day_series:
          type: array
          items:
            type: number
            format: double
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMetricsItem"
        performance:
          "$ref": "#/components/schemas/ProductStorePerformance"
        store_id:
          type: string
        sync_state:
          "$ref": "#/components/schemas/ProductMonitorSyncState"
    ProductMonitorItem:
      type: object
      required:
      - product_id
      - offer_id
      - sku
      - name
      - category_name
      - primary_image_url
      - image_count
      - official_state
      - status_name
      - is_archived
      - issue_count
      - issue_level
      - issue_code
      - issue_message
      - price
      - old_price
      - currency_code
      - stock_present
      - stock_reserved
      - promotion_discount_percent
      - promotion_action_title
      - promotion_action_price
      - hits_view
      - session_view
      - ordered_units
      - revenue
      - session_view_series
      properties:
        category_name:
          type: string
        currency_code:
          type: string
        hits_view:
          type: number
          format: double
        image_count:
          type: integer
          format: int64
        is_archived:
          type: boolean
        issue_code:
          type: string
        issue_count:
          type: integer
          format: int64
        issue_level:
          type: string
        issue_message:
          type: string
        name:
          type: string
        offer_id:
          type: string
        official_state:
          "$ref": "#/components/schemas/ProductOfficialState"
        old_price:
          type: number
          format: double
        ordered_units:
          type: number
          format: double
        price:
          type: number
          format: double
        primary_image_url:
          type: string
        product_id:
          type: integer
          format: int64
        promotion_action_price:
          type: string
        promotion_action_title:
          type: string
        promotion_discount_percent:
          type: number
          format: double
        revenue:
          type: number
          format: double
        session_view:
          type: number
          format: double
        session_view_series:
          type: array
          items:
            type: number
            format: double
        sku:
          type: integer
          format: int64
        status_name:
          type: string
        stock_present:
          type: integer
          format: int64
        stock_reserved:
          type: integer
          format: int64
    ProductMonitorRequest:
      type: object
      required:
      - store_id
      properties:
        include_metrics:
          type: boolean
          description: |-
            Skip the slower analytics call when the SPA wants a progressive core
            snapshot. Metrics can be fetched independently.
        metrics_days:
          type: integer
          format: int64
          description: |-
            Product/price/stock reads are current snapshots. Only analytics has a
            time window; product-screen callers default to the trailing three days.
        offer_ids:
          type: array
          items:
            type: string
          description: When non-empty, read only these seller offer IDs.
        sku:
          type: integer
          format: int64
          description: When present, refresh only this Ozon SKU instead of the whole store.
          nullable: true
        store_id:
          type: string
      additionalProperties: false
    ProductMonitorSnapshot:
      type: object
      required:
      - store_id
      - products
      - sync_states
      - performance
      properties:
        performance:
          "$ref": "#/components/schemas/ProductStorePerformance"
        products:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMonitorItem"
        store_id:
          type: string
        sync_states:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMonitorSyncState"
    ProductMonitorSyncState:
      type: object
      required:
      - domain
      - last_sync_at_ms
      - last_error
      - rate_limited_until_ms
      properties:
        domain:
          "$ref": "#/components/schemas/ProductSyncDomain"
        last_error:
          type: string
        last_sync_at_ms:
          type: integer
          format: int64
        rate_limited_until_ms:
          type: integer
          format: int64
    ProductMutationCommand:
      type: object
      description: |-
        Stable client-generated identity plus the Store whose products were shown
        when the operator confirmed the mutation.
      required:
      - operation_id
      - store_id
      - request
      properties:
        operation_id:
          type: string
        request:
          "$ref": "#/components/schemas/ProductMutationRequest"
        store_id:
          type: string
      additionalProperties: false
    ProductMutationItemResult:
      type: object
      required:
      - identity
      - succeeded
      - message
      properties:
        identity:
          type: string
        message:
          type: string
        succeeded:
          type: boolean
    ProductMutationRequest:
      oneOf:
      - type: object
        required:
        - items
        - kind
        properties:
          items:
            type: array
            items:
              "$ref": "#/components/schemas/ProductStockMutationItem"
          kind:
            type: string
            enum:
            - stock
      - type: object
        required:
        - items
        - kind
        properties:
          items:
            type: array
            items:
              "$ref": "#/components/schemas/ProductPriceMutationItem"
          kind:
            type: string
            enum:
            - price
      - type: object
        required:
        - product_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - archive
          product_ids:
            type: array
            items:
              type: integer
              format: int64
      - type: object
        required:
        - product_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - unarchive
          product_ids:
            type: array
            items:
              type: integer
              format: int64
      - type: object
        required:
        - offer_ids
        - kind
        properties:
          kind:
            type: string
            enum:
            - delete
          offer_ids:
            type: array
            items:
              type: string
      - type: object
        description: Join an Ozon platform promotion at an agreed promotional price.
        required:
        - action_id
        - items
        - kind
        properties:
          action_id:
            type: integer
            format: int64
          items:
            type: array
            items:
              "$ref": "#/components/schemas/ProductPromotionMutationItem"
          kind:
            type: string
            enum:
            - promotion_join
      - type: object
        description: |-
          Withdraw products from an Ozon platform promotion. The exit route
          depends on the promotion's type: PROMOCODE leaves via the deactivate
          method, ELASTIC_BOOSTING and STOCK_DISCOUNT leave by re-pricing above
          the product's limit, and anything else is not exitable through the
          API and answers with guidance text.
        required:
        - action_id
        - product_ids
        - kind
        properties:
          action_id:
            type: integer
            format: int64
          action_type:
            type: string
            description: |-
              Promotion `action_type` as `GET /v1/actions` spells it, e.g.
              `PROMOCODE`, `ELASTIC_BOOSTING`, `STOCK_DISCOUNT`. Ledger rows
              written before this field exist deserialize as `""`, which routes
              to the not-exitable guidance.
          exit_prices:
            type: array
            items:
              "$ref": "#/components/schemas/ProductPromotionExitPrice"
            description: |-
              Per-product exit price for the over-limit exit route. Empty on
              pre-v2 ledger rows; on that route a product without an entry
              fails with an explanation instead of being silently skipped.
          kind:
            type: string
            enum:
            - promotion_leave
          product_ids:
            type: array
            items:
              type: integer
              format: int64
      description: |-
        One absolute product-page state change. Absolute, not relative, so a probe
        can decide whether it happened by looking at the current state alone.
    ProductMutationResponse:
      type: object
      required:
      - operation_id
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProductMutationItemResult"
        operation_id:
          type: string
    ProductOfficialState:
      type: string
      enum:
      - active
      - moderating
      - delisted
      - archived
      - missing
      - unknown
    ProductPriceMutationItem:
      type: object
      required:
      - product_id
      - offer_id
      - price
      - old_price
      - currency_code
      properties:
        currency_code:
          type: string
        offer_id:
          type: string
        old_price:
          type: string
        price:
          type: string
        product_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductPromotionActionView:
      type: object
      description: |-
        One promotion the seller may take part in, already narrowed to the
        selection: `eligible` and `participating` count only selected products.
      required:
      - action_id
      - title
      - action_type
      - date_start
      - date_end
      - freeze_date
      - is_participating
      - eligible_selected
      - participating_selected
      - potential_products_total
      - participating_products_total
      properties:
        action_id:
          type: integer
          format: int64
        action_type:
          type: string
        date_end:
          type: string
        date_start:
          type: string
        eligible_selected:
          type: integer
          format: int64
          description: Selected products Ozon accepts into this promotion.
        freeze_date:
          type: string
          description: |-
            Set while the promotion is frozen: the seller may not raise prices or
            withdraw products until it passes.
        is_participating:
          type: boolean
        participating_products_total:
          type: integer
          format: int64
        participating_selected:
          type: integer
          format: int64
          description: Selected products already in this promotion.
        potential_products_total:
          type: integer
          format: int64
          description: Whole-store counts, for context on a partial selection.
        title:
          type: string
    ProductPromotionExitPrice:
      type: object
      description: |-
        One product's over-limit exit price: strictly above its join limit, so
        the update method's price rule removes it from the promotion.
      required:
      - product_id
      - exit_price
      properties:
        exit_price:
          type: number
          format: double
        product_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductPromotionMutationItem:
      type: object
      required:
      - product_id
      - offer_id
      - action_price
      - stock
      properties:
        action_price:
          type: number
          format: double
          description: |-
            Promotional price. Ozon rejects anything above the product's
            `max_action_price` for the promotion.
        offer_id:
          type: string
        product_id:
          type: integer
          format: int64
        stock:
          type: number
          format: double
          description: |-
            Units committed to the promotion; `0` lets Ozon use all available
            stock.
      additionalProperties: false
    ProductPromotionOfferView:
      type: object
      description: One selected product's terms inside one promotion.
      required:
      - action_id
      - product_id
      - participating
      - price
      - action_price
      - max_action_price
      - add_mode
      - stock
      - min_stock
      - current_boost
      - min_boost
      - max_boost
      - price_min_elastic
      - price_max_elastic
      properties:
        action_id:
          type: integer
          format: int64
        action_price:
          type: number
          format: double
          description: Agreed promotional price; `0` for a candidate that has not joined.
        add_mode:
          type: string
          description: |-
            How the product entered the promotion. The actions v2 source lists
            `SELLER` or `AUTO`; v1-era values were `MANUAL`/`NOT_SET`.
        current_boost:
          type: number
          format: double
          description: |-
            Elastic-boosting terms. Zero everywhere for promotions that do not
            trade discount depth for search boost.
        max_action_price:
          type: number
          format: double
          description: Highest promotional price Ozon accepts. Joining above it is rejected.
        max_boost:
          type: number
          format: double
        min_boost:
          type: number
          format: double
        min_stock:
          type: number
          format: double
        participating:
          type: boolean
          description: |-
            `true` when the product is already in the promotion, `false` when it is
            only a candidate.
        price:
          type: number
          format: double
          description: Current non-promotional price.
        price_max_elastic:
          type: number
          format: double
        price_min_elastic:
          type: number
          format: double
        product_id:
          type: integer
          format: int64
        stock:
          type: number
          format: double
          description: Units committed to the promotion; `0` means "all available".
    ProductPromotionsRequest:
      type: object
      required:
      - store_id
      - product_ids
      properties:
        product_ids:
          type: array
          items:
            type: integer
            format: int64
          description: "`product_id` of every selected product."
        store_id:
          type: string
      additionalProperties: false
    ProductPromotionsView:
      type: object
      required:
      - actions
      - offers
      properties:
        actions:
          type: array
          items:
            "$ref": "#/components/schemas/ProductPromotionActionView"
        offers:
          type: array
          items:
            "$ref": "#/components/schemas/ProductPromotionOfferView"
    ProductStockMutationItem:
      type: object
      required:
      - product_id
      - offer_id
      - sku
      - warehouse_id
      - stock
      properties:
        offer_id:
          type: string
        product_id:
          type: integer
          format: int64
        sku:
          type: integer
          format: int64
          description: |-
            Ozon SKU. The write is addressed by `product_id` when it is positive;
            the read-only settlement probe can only query stock by SKU, so it
            travels with the request and is persisted in the write ledger.
        stock:
          type: integer
          format: int64
        warehouse_id:
          type: integer
          format: int64
      additionalProperties: false
    ProductStorePerformance:
      type: object
      required:
      - period_days
      - hits_view
      - session_view
      - ordered_units
      - revenue
      - through_day
      properties:
        hits_view:
          type: number
          format: double
        ordered_units:
          type: number
          format: double
        period_days:
          type: integer
          format: int64
        revenue:
          type: number
          format: double
        session_view:
          type: number
          format: double
        through_day:
          type: string
    ProductSyncDomain:
      type: string
      enum:
      - products
      - prices
      - stocks
      - metrics
    ProductVariantCorrection:
      type: object
      description: |-
        One explicitly selected variant-attribute correction.

        A correction is not a general attribute editor: it may only name a
        characteristic the category declares as a variant dimension, and the
        operation's payload carries nothing else.
      required:
      - product_id
      - attribute_id
      properties:
        attribute_id:
          type: integer
          format: int64
          description: Ozon characteristic id.
        dictionary_value_id:
          type: integer
          format: int64
          description: Directory value id, when the characteristic is a dictionary one.
          nullable: true
        product_id:
          type: string
          description: Selected product, as the preview named it.
        value:
          type: string
          description: Free-text value, when the characteristic is not a dictionary one.
          nullable: true
      additionalProperties: false
    ProductVariantMemberView:
      type: object
      description: One member of a group, as the preview reports it.
      required:
      - product_id
      - offer_id
      - name
      properties:
        model_id:
          type: integer
          format: int64
          description: The group this member is in right now, when the mirror observed one.
          nullable: true
        name:
          type: string
        offer_id:
          type: string
        product_id:
          type: string
      additionalProperties: false
    ProductVariantOperationData:
      type: object
      required:
      - operation_id
      - accepted
      properties:
        accepted:
          type: boolean
          description: |-
            The operation exists and its dispatch was admitted (or already
            happened). The caller polls the status route from here.
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantOperationItem"
        last_checked_at_ms:
          type: integer
          format: int64
          nullable: true
        operation_id:
          type: string
        state:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/ProductGroupingState"
      additionalProperties: false
    ProductVariantOperationItem:
      type: object
      description: |-
        One product's result. The same shape for the operation that was just
        accepted and for the status that is read later.
      required:
      - product_id
      - offer_id
      - state
      properties:
        detail_code:
          type: string
          description: Why the item is where it is — a stable code, never Ozon's prose.
          nullable: true
        offer_id:
          type: string
        product_id:
          type: string
        state:
          "$ref": "#/components/schemas/ProductGroupingState"
        task_id:
          type: integer
          format: int64
          description: |-
            The Ozon task id that carries this product's update, once Ozon
            answered with one.
          nullable: true
      additionalProperties: false
    ProductVariantOperationRequest:
      type: object
      description: |-
        Confirm one preview. The digest is the whole request: the server re-proves
        every fact behind it before anything is dispatched.
      required:
      - operation_id
      - store_id
      - preview_digest
      properties:
        operation_id:
          type: string
        preview_digest:
          type: string
        store_id:
          type: string
      additionalProperties: false
    ProductVariantOperationStatusData:
      type: object
      description: 'The status read: database only, never a Seller call.'
      required:
      - operation_id
      - state
      - passes
      properties:
        deadline_at_ms:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantOperationItem"
        last_checked_at_ms:
          type: integer
          format: int64
          nullable: true
        next_check_at_ms:
          type: integer
          format: int64
          nullable: true
        operation_id:
          type: string
        passes:
          type: integer
          format: int32
          description: How many bounded observation passes have run.
        state:
          "$ref": "#/components/schemas/ProductGroupingState"
      additionalProperties: false
    ProductVariantPreviewData:
      type: object
      description: |-
        The preview: everything the operator confirms, and the digest the
        operation must quote back.
      required:
      - digest
      - action
      - store_id
      - target
      - products
      properties:
        action:
          "$ref": "#/components/schemas/ProductGroupingAction"
        digest:
          type: string
        problems:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantProblemView"
          description: Empty means executable.
        products:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantProductView"
        source_remaining:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantMemberView"
          description: |-
            Source-group members the operator did **not** select. They stay in the
            old group, and the preview shows them so a partial selection is never
            a surprise.
        store_id:
          type: string
        target:
          "$ref": "#/components/schemas/ProductVariantTargetView"
        target_existing:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantMemberView"
          description: Members already in the target group.
      additionalProperties: false
    ProductVariantPreviewRequest:
      type: object
      description: Ask for a preview of one grouping change.
      required:
      - store_id
      - action
      - product_ids
      properties:
        action:
          "$ref": "#/components/schemas/ProductGroupingAction"
        corrections:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantCorrection"
        model_value:
          type: string
          description: |-
            An explicit \`9048\` value for a new group. Optional; absent means the
            server mints a stable one.
          nullable: true
        product_ids:
          type: array
          items:
            type: string
          description: |-
            The products the operator selected, as strings (Ozon product ids
            exceed no JavaScript integer here, but the wire keeps them textual
            because every other product identity in this feature is).
        store_id:
          type: string
        target_model_id:
          type: integer
          format: int64
          description: |-
            The target group's observed model id. Required by \`move\`, refused by
            the others: a new group has no Ozon id yet.
          nullable: true
      additionalProperties: false
    ProductVariantProblemView:
      type: object
      description: |-
        One reason the preview is not executable. A non-empty list *is* the
        refusal; the SPA renders the codes, never prose.
      required:
      - code
      properties:
        attribute_id:
          type: integer
          format: int64
          nullable: true
        code:
          type: string
          description: |-
            A stable code: the listing-core variant issue keys where the rule
            refused, plus this route's own \`verify_first\`-family codes.
        product_id:
          type: string
          nullable: true
      additionalProperties: false
    ProductVariantProductView:
      type: object
      description: One selected product, with its before and after facts.
      required:
      - product_id
      - offer_id
      - name
      - target_model_id
      - variant_values
      - combination_key
      properties:
        combination_key:
          type: string
          description: |-
            Stable digest of the complete dimension combination, so the SPA can
            point at the two rows that collide without recomputing the rule.
        current_model_id:
          type: integer
          format: int64
          description: The product's group as the mirror observed it. Absent = ungrouped.
          nullable: true
        name:
          type: string
        offer_id:
          type: string
        product_id:
          type: string
        target_model_id:
          type: integer
          format: int64
          description: The model identity this operation writes (see the module doc).
        thumbnail_url:
          type: string
          nullable: true
        variant_values:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantValueView"
          description: The dimensions that make this member a distinct variant.
      additionalProperties: false
    ProductVariantTargetView:
      type: object
      description: The group the operation writes into.
      properties:
        existing_members:
          type: array
          items:
            "$ref": "#/components/schemas/ProductVariantMemberView"
          description: Members already in the target group.
        model_id:
          type: integer
          format: int64
          description: The target group's observed Ozon id, when it already exists.
          nullable: true
        model_value:
          type: string
          description: The \`9048\` value this operation submits.
          nullable: true
      additionalProperties: false
    ProductVariantValueView:
      type: object
      description: One variant dimension value of one selected product.
      required:
